<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<title>켠김에 GOAT까지</title><link rel="icon" type="image/png" href="icon-512.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070910;color:#e8ecf4;overflow:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-0.015em;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:#0e1220}
#top{padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top));background:#161b2e;font-size:13px}
#top .l1{display:flex;align-items:center;gap:6px;font-weight:800}
#top .l1 .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#top .l2{color:#9aa4b2;margin-top:3px;font-size:12.5px;display:flex;justify-content:space-between}
.pill{background:#0b0f1c;padding:4px 9px;border-radius:999px;white-space:nowrap;font-size:12.5px}
#main{flex:1;overflow-y:auto;padding:10px;user-select:none;-webkit-user-select:none}
.card{background:#171d31;border-radius:14px;padding:12px;margin-bottom:9px}
.card h4{margin:0 0 8px;font-size:13px;color:#9aa4b2;font-weight:700}
.prof{display:flex;gap:12px;align-items:center}
.ovr{width:74px;height:74px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#7c3aed);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.ovr b{font-size:30px;line-height:1}.ovr small{font-size:11px;opacity:.85}
.prof .info{flex:1;min-width:0;font-size:13px;line-height:1.65}
.tier{font-weight:800}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.bar{font-size:12px}
.bar .lab{display:flex;justify-content:space-between;margin-bottom:3px;color:#c9d1e3}
.bar .lab b{color:#fff}
.bar .tr{height:7px;background:#0b0f1c;border-radius:99px;overflow:hidden}
.bar .fi{height:100%;border-radius:99px;transition:width .4s}
.cond{display:flex;gap:10px;margin-top:10px}.cond>.bar{flex:1}
.sched{display:flex;align-items:center;gap:8px;font-size:13px}
.sched .ic{font-size:22px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act{background:#1f2640;border-radius:12px;padding:10px;text-align:left;border:1px solid #2a3252}
.act:active{transform:scale(.97)}
.act b{display:block;font-size:14px}
.act small{display:block;color:#9aa4b2;font-size:11.5px;margin-top:3px;line-height:1.35}
.act.rec{border-color:#f59e0b}
.act.pink{border-color:#f472b6;background:linear-gradient(145deg,#231c36,#2c1e40)}
.act:disabled{opacity:.4}
.sub{display:flex;gap:5px;margin-top:2px}.sub>button{flex:1;padding:10px 2px;font-size:12.5px}
.btn{background:linear-gradient(#3b82f6,#2563eb);padding:11px 12px;border-radius:11px;font-weight:800;font-size:14px}
.btn.gray{background:#252c46}.btn.gold{background:linear-gradient(#f59e0b,#d97706)}
.btn.red{background:linear-gradient(#ef4444,#b91c1c)}.btn.green{background:linear-gradient(#10b981,#059669)}
.btn.purple{background:linear-gradient(#a855f7,#7c3aed)}.btn.pink{background:linear-gradient(#ec4899,#db2777)}
.btn:disabled{background:#252c46;color:#6b7390}
.wide{width:100%;margin-bottom:7px}
/* 생성 화면 */
.title{text-align:center;padding:14px 0 6px}
.title .logo{font-size:52px}.title h1{margin:4px 0;font-size:26px;letter-spacing:1px}
.title p{color:#9aa4b2;margin:4px 0;font-size:13px}
input.name{width:100%;background:#0b0f1c;border:1px solid #2a3252;border-radius:10px;padding:12px;color:#fff;font:inherit;font-size:16px;margin-bottom:8px}
.poss{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pos{background:#1f2640;border-radius:10px;padding:8px 2px;text-align:center;border:2px solid transparent;font-size:12.5px;font-weight:700}
.pos span{display:block;font-size:22px}
.pos.sel{border-color:#3b82f6;background:#24305a}
/* 경기 */
.mhead{display:flex;align-items:center;justify-content:space-between;text-align:center;gap:6px}
.mhead .tm{flex:1;font-weight:800;font-size:14px}
.mhead .tm small{display:block;color:#9aa4b2;font-weight:600;font-size:12px;margin-top:2px}
.mhead .vs{font-size:20px;font-weight:900;color:#f59e0b}
.mlabel{text-align:center;font-size:12.5px;color:#f59e0b;font-weight:800;margin-bottom:6px}
.gold{margin-top:10px}
.gold .tr{height:12px;background:#ef4444;border-radius:99px;overflow:hidden;position:relative}
.gold .fi{height:100%;background:#3b82f6;transition:width .6s}
.gold .gl{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:#c9d1e3}
.log{font-size:13.5px;line-height:1.6}
.log p{margin:0 0 8px;padding:8px 10px;background:#11162a;border-radius:10px;animation:fade .35s}
.log p.good{border-left:3px solid #22c55e}.log p.bad{border-left:3px solid #ef4444}.log p.neu{border-left:3px solid #64748b}
.log p .ph{display:block;font-size:11.5px;font-weight:800;color:#9aa4b2;margin-bottom:2px}
.choices .btn{display:block;width:100%;text-align:left;margin-bottom:7px;background:#1f2640;border:1px solid #33406a}
.choices .btn small{display:block;font-weight:500;color:#9aa4b2;font-size:12px;margin-top:2px}
.result{text-align:center;padding:6px 0}
.result .big{font-size:44px;font-weight:900}
.win{color:#3b82f6}.lose{color:#ef4444}
.kda{display:flex;justify-content:center;gap:16px;margin:8px 0;font-size:13px}
.kda b{display:block;font-size:20px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 모달 & 비주얼 노벨 (모바일 노치/상단바 및 화면 잘림 100% 방지) */
.modal-close-btn{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);color:#94a3b8;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;transition:all .15s}
.modal-close-btn:active{transform:scale(.9);background:rgba(239,68,68,.3);color:#ef4444}
/* 토너먼트 대진표 브래킷 UI */
.bracket-wrapper{background:#0e1322;border:1px solid #232c48;border-radius:14px;padding:12px;margin:10px 0}
.bracket-grid{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bracket-step{flex:1;display:flex;flex-direction:column;gap:6px}
.bracket-node{background:#151c30;border:1px solid #28375c;border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;color:#cbd5e1}
.bracket-node.me{border-color:#38bdf8;background:#1a2744;color:#fff}
.bracket-node.win{border-color:#22c55e;background:#143823;color:#4ade80}
.bracket-node.loss{border-color:#ef4444;background:#3b1313;color:#fca5a5}
.bracket-node.champ{border-color:#eab308;background:linear-gradient(135deg,#3b270a,#5c3d0b);color:#fde047;box-shadow:0 0 10px rgba(234,179,8,0.3)}
.bracket-arrow{color:#64748b;font-weight:900;font-size:12px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-start;justify-content:center;z-index:9999;padding:max(16px,env(safe-area-inset-top,16px)) 12px max(20px,env(safe-area-inset-bottom,20px)) 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box}
#modal.hidden{display:none}
#modal .box{background:#171d31;border-radius:16px;padding:14px 15px;width:100%;max-width:430px;margin:auto 0;max-height:calc(100dvh - 36px);max-height:calc(100vh - 36px);overflow-y:auto;overscroll-behavior:contain;animation:pop .2s ease-out;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08);box-sizing:border-box}
#mBody{font-size:13.5px;line-height:1.55}
#mBody h3{margin:0 0 8px;text-align:center;font-size:17px}
#mBody .em{font-size:42px;text-align:center;line-height:1.2}
#mBody .c{text-align:center}
#mBtns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}


/* 방향 1~4 확장 스타일 */
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.champ-card{background:#13182a;border:1px solid #283354;border-radius:10px;padding:8px;text-align:left;cursor:pointer}
.champ-card.sel{border-color:#f59e0b;background:#241d3b}
.champ-card b{display:block;font-size:13px;color:#fff}
.champ-card small{display:block;font-size:11px;color:#94a3b8;margin-top:2px}
.clutch-box{background:linear-gradient(135deg,#450a0a,#7f1d1d);border:2px solid #ef4444;border-radius:14px;padding:12px;text-align:center;animation:pop .25s ease-out;margin:10px 0}
.stock-row{display:flex;justify-content:space-between;align-items:center;background:#11162a;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:12.5px}
.stock-row b{color:#fff}
.prop-card{background:#11162a;border:1px solid #283354;border-radius:10px;padding:9px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}

/* 편의성 카테고리 탭 & 퀵 액션 & 뱃지 */

/* 메인 화면 히로인 호감도 퀵 바 스타일 */
.bonds-quick-card{background:linear-gradient(135deg,#16122c,#1a163a);border:1px solid rgba(244,114,182,.45);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.bonds-quick-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bonds-quick-title{font-size:13px;font-weight:900;color:#f472b6;display:flex;align-items:center;gap:6px}
.bonds-quick-sub{font-size:11px;color:#94a3b8}
.bonds-quick-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.bonds-quick-list::-webkit-scrollbar{height:4px}
.bonds-quick-list::-webkit-scrollbar-thumb{background:#475569;border-radius:99px}
.bonds-quick-item{flex:0 0 84px;background:#0d1222;border:1px solid #28375c;border-radius:12px;padding:8px 4px 6px;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s;position:relative}
.bonds-quick-item:active{transform:scale(.95)}
.bonds-quick-item.neglected{border-color:#ef4444;background:linear-gradient(180deg,#2b0d18,#120914);box-shadow:0 0 10px rgba(239,68,68,.35)}
.bonds-quick-avatar{width:56px;height:72px;border-radius:8px;object-fit:cover;object-position:center top;margin:0 auto 5px;display:block;border:2px solid #ec4899;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.bonds-quick-item.locked .bonds-quick-avatar{border-color:#475569;filter:grayscale(1);opacity:.5}
.bonds-quick-name{font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bonds-quick-aff{font-size:11px;font-weight:900;color:#f472b6;margin-top:2px}
.bonds-quick-gauge{width:100%;height:4px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:3px}
.bonds-quick-gauge-fill{height:100%;background:linear-gradient(90deg,#ec4899,#f43f5e);border-radius:99px}
.bonds-alert-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:99px;box-shadow:0 2px 6px rgba(239,68,68,.7);animation:pop .4s ease-out}

.cat-tabs{display:flex;gap:4px;margin-bottom:8px;background:#0b0f1c;padding:3px;border-radius:10px}
.cat-tab{flex:1;padding:7px 2px;border-radius:8px;background:none;font-size:12px;font-weight:800;color:#94a3b8;text-align:center;border:0;cursor:pointer}
.cat-tab.active{background:#232d4b;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.quick-action-bar{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#181432,#25133a);border:1px solid #8b5cf6;border-radius:12px;padding:8px 12px;margin-bottom:8px}
.badge-pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:800;margin:2px;letter-spacing:-0.02em}
.bg-green{background:#14532d;color:#4ade80;border:1px solid #22c55e}
.bg-gold{background:#713f12;color:#fde047;border:1px solid #eab308}
.bg-pink{background:#831843;color:#f472b6;border:1px solid #ec4899}
.bg-purple{background:#581c87;color:#c084fc;border:1px solid #a855f7}
.bg-red{background:#7f1d1d;color:#f87171;border:1px solid #ef4444}
.bg-blue{background:#1e3a8a;color:#60a5fa;border:1px solid #3b82f6}

/* 비주얼 노벨 전용 스타일 */
.vn-portrait{width:100%;min-height:340px;max-height:440px;height:380px;border-radius:16px;overflow:hidden;margin-bottom:12px;background:linear-gradient(180deg,#1e1b4b,#0b0f1c);position:relative;box-shadow:0 8px 30px rgba(0,0,0,.8), 0 0 20px rgba(244,114,182,.15);display:flex;align-items:center;justify-content:center}
.vn-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 18%;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.vn-portrait:hover img{transform:scale(1.04)}
.vn-portrait.mood-sensual{border:2px solid #f43f5e;box-shadow:0 0 25px rgba(244,63,94,.5)}
.vn-portrait.mood-blush{border:2px solid #ec4899;box-shadow:0 0 20px rgba(236,72,153,.4)}
.vn-portrait.mood-intimate{border:2px solid #a855f7;box-shadow:0 0 30px rgba(168,85,247,.6)}
.vn-outfit-badge{position:absolute;bottom:8px;left:8px;background:linear-gradient(135deg,rgba(244,63,94,.92),rgba(168,85,247,.92));backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:900;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:2;letter-spacing:-0.02em}
.vn-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;color:#f472b6;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2}
.vn-scene{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;color:#38bdf8;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2}
.vn-speaker{display:inline-block;background:linear-gradient(90deg,#ec4899,#8b5cf6);padding:3px 12px;border-radius:6px;font-weight:900;font-size:13px;margin-bottom:6px;color:#fff;box-shadow:0 2px 8px rgba(236,72,153,.35)}
.vn-dialogue{background:#0e1324;border:1px solid #283354;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;color:#f1f5f9;margin-bottom:8px}
/* 인연 카드 */
.h-card{display:flex;gap:12px;background:#13182a;border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid #263050;position:relative}
.h-card.locked{opacity:.45;filter:grayscale(.7)}
.h-thumb{width:76px;height:94px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#0b0f1c}
.h-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.h-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.h-name{display:flex;justify-content:space-between;align-items:center}
.h-name b{font-size:15px;color:#fff}
.h-name .status{font-size:11.5px;padding:2px 7px;border-radius:99px;font-weight:800}
.status.s0{background:#334155;color:#94a3b8}
.status.s1{background:#831843;color:#f472b6}
.status.s2{background:#be185d;color:#fbcfe8}
.status.s3{background:#ec4899;color:#fff;box-shadow:0 0 10px rgba(236,72,153,.6)}
.h-buff{font-size:11.5px;color:#cbd5e1;line-height:1.4;margin:4px 0}
.h-buff b{color:#38bdf8}
.h-bar{height:6px;background:#0b0f1c;border-radius:99px;overflow:hidden;margin-top:3px}
.h-bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#ec4899);transition:width .4s}
/* 상점 & 업적 */
.tab-row{display:flex;gap:4px;margin-bottom:12px;background:#0b0f1c;padding:3px;border-radius:10px}
.tab-row button{flex:1;padding:8px 0;border-radius:8px;background:none;font-size:12.5px;font-weight:700;color:#94a3b8}
.tab-row button.act{background:#232d4b;color:#fff}
.shopi{display:flex;align-items:center;gap:10px;background:#11162a;border-radius:10px;padding:9px;margin-bottom:6px;text-align:left}
.shopi .t{flex:1;font-size:13px}.shopi .t small{display:block;color:#9aa4b2}
.shopi.skin-legend{border:1px solid #a855f7}.shopi.skin-mythic{border:1px solid #facc15;background:linear-gradient(135deg,#1b172a,#2c2014)}
.skin-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:900;margin-right:4px}
.tag-normal{background:#475569;color:#fff}.tag-epic{background:#2563eb;color:#fff}.tag-legend{background:#9333ea;color:#fff}.tag-mythic{background:#ca8a04;color:#fff}
.ach-card{display:flex;align-items:center;gap:10px;background:#11162a;border-radius:10px;padding:9px;margin-bottom:6px;text-align:left}
.ach-card.done{border-left:3px solid #22c55e}.ach-card.locked{opacity:.5}
.ach-card .ic{font-size:26px;width:34px;text-align:center}
.ach-card .info{flex:1;min-width:0;font-size:13px}
.ach-card .info small{display:block;color:#9aa4b2;font-size:11.5px}
.ach-card .reward{color:#ffd23f;font-weight:800;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:center;border-bottom:1px solid #222a44}
th{color:#9aa4b2;font-weight:700;font-size:12px}
td.l{text-align:left}
tr.me td{background:#1d2a52;font-weight:800}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;border-bottom:1px solid #222a44}
.kv b{color:#ffd23f}
.delta{font-size:13px;line-height:1.7;background:#11162a;border-radius:10px;padding:8px 10px;margin-top:8px}
.up{color:#4ade80}.dn{color:#f87171}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(15,19,34,.95);padding:9px 16px;border-radius:999px;
  font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;white-space:nowrap;border:1px solid #2f3756}
#toast.show{opacity:1}

/* 📸 인스타그램 & 💬 DM 전용 스타일 */
.sns-profile{display:flex;align-items:center;gap:14px;background:#11162a;padding:12px;border-radius:12px;margin-bottom:10px}
.sns-avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid #ec4899;flex-shrink:0}
.sns-avatar img{width:100%;height:100%;object-fit:cover}
.sns-stats{display:flex;gap:14px;font-size:12px;color:#cbd5e1}
.sns-stats b{display:block;font-size:14px;color:#fff}
.feed-card{background:#0e1322;border:1px solid #232c48;border-radius:14px;overflow:hidden;margin-bottom:12px}
.feed-head{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;font-weight:700}
.feed-img{width:100%;max-height:220px;object-fit:cover;display:block}
.feed-body{padding:10px 12px}
.feed-actions{display:flex;gap:10px;margin-bottom:6px;font-size:14px}
.feed-caption{font-size:12.5px;color:#f1f5f9;line-height:1.5;margin-bottom:8px}
.feed-comments{border-top:1px solid #1c233a;padding-top:6px;font-size:11.5px}

};
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  n = Math.round(n);

  };
}

  return new Promise(res => {

        res(i);
      };

    });

function skinStatBonus(k) {
  if (!P || !P.equippedSkin) return 0;
  const s = SKINS.find(x => x.k === P.equippedSkin);
  return s?.st?.[k] || 0;
}
function ovr(p = P) {
  if (!p || !p.pos || !p.s) return 0;
  const posConfig = POS[p.pos];
  if (!posConfig || !posConfig.w) return 0;
  const w = posConfig.w; let t = 0;
  for (const k in w) t += (p.s[k] + skinStatBonus(k)) * w[k];
  return t;
}
const condF = () => (0.8 + 0.2 * P.hp / 100) * (1 - Math.max(0, P.stress - 50) / 250);
function gearB() {
  let b = 1 + Object.keys(P.gear).reduce((a, k) => a + (GEAR.find(g => g.k === k)?.b || 0), 0);
  if (P.bonds?.harin?.aff >= 50) b += 0.25; // 하린 훈련 보너스
  return b;
}
function updateKrRank() {
  if (!P) return;
  if (!P.krLeaderboard || P.krLeaderboard.length < 50) {
    P.krLeaderboard = generateKrLeaderboard();
  }
  if (!P.rank) return;

  // 천상계 랭킹 판정 (마스터 1~800, 그마 800~1200, 챌린저 1200+ & Top 50)
  if (P.rank.t >= 7) {
    const lp = P.rank.lp;
    if (lp >= 1200) {
      const cut50 = P.krLeaderboard[49]?.baseLp || 1200;
      if (lp >= cut50) {
        P.rank.t = 9; // 챌린저
        let rank = 1;
        for (let i = 0; i < 50; i++) {
          if (lp < P.krLeaderboard[i].baseLp) rank++;
          else break;
        }
        P.rankNum = Math.min(50, rank);
        if (P.rankNum === 1 && !P.rank1Notified) {
          P.rank1Notified = true;
          toast('👑 한국 서버 솔로랭크 1위(솔랭 패왕)에 등극했습니다!');
        }
      } else {
        P.rank.t = 8; // 그랜드마스터 (1200점 이상이나 50위 밖)
        P.rankNum = null;
      }
    } else if (lp >= 800) {
      P.rank.t = 8; // 그랜드마스터
      P.rankNum = null;
    } else {
      P.rank.t = 7; // 마스터
      P.rankNum = null;
    }
  }
}

function tierName(r = P.rank) {
  if (r.t < 7) {
    const bName = BASE_TIERS[r.t] || '골드';
    const div = DIVISIONS[r.div !== undefined ? r.div : 3];
    return `${bName} ${div} ${Math.floor(r.lp)}LP`;
  }
  updateKrRank();
  if (r.t === 7) return `마스터 ${Math.floor(r.lp)}LP`;
  if (r.t === 8) return `그랜드마스터 ${Math.floor(r.lp)}LP`;
  if (r.t === 9) {
    if (P.rankNum === 1) return `👑 챌린저 1위 (${Math.floor(r.lp)}LP)`;
    return `챌린저 ${P.rankNum ? P.rankNum + '위' : ''} (${Math.floor(r.lp)}LP)`;
  }
  return `마스터 ${Math.floor(r.lp)}LP`;
}

function tierSkill(r = P.rank) {
  if (r.t < 7) {
    const divStep = (r.div || 0) * 1.5;
    return TIER_SK[r.t] + divStep + (r.lp / 100) * 1.5;
  }
  return 62 + (r.lp / 40);
}
function myTeam() {
  if (P.stage === 'pro') return P.pro[P.teamId];
  if (P.stage === 'aca') return P.aca[P.teamId];
  return null;
}
function teamPow() {
  const t = myTeam();
  let baseSyn = P.syn;
  if (P.bonds?.mina?.aff >= 50) baseSyn = Math.min(5, baseSyn + 2); // 민아 시너지 보너스
  let skinBonus = P.equippedSkin === 'skin_legend' ? 2 : P.equippedSkin === 'skin_mythic' ? 5 : 0;
  return t.str * 0.62 + ovr() * condF() * 0.38 + baseSyn + skinBonus;
}

function grow(k, base) {
  const cur = P.s[k];
  let decay;
  if (cur < 60) {
    decay = 1.0;
  } else if (cur < 85) {
    decay = 1.0 - (cur - 60.0) / 45.0;
  } else if (cur < 100) {
    decay = 0.44 * (1.0 - (cur - 85.0) / 25.0);
  } else {
    decay = 0.15 * Math.exp(-(cur - 100.0) / 20.0);
  }

  let g = base * gearB() * (0.55 + 0.45 * P.hp / 100) * (1 - P.stress / 220) * decay * rnd(.85, 1.15) * (P.talent || 1);
  if (P.bonds?.seolah?.aff >= 75) g *= 1.4;
  else if (P.bonds?.seolah?.aff >= 25) g *= 1.2;
  if (k === 'mental') g = base * decay * rnd(.85, 1.15);

  g = Math.max(0.05, g);
  const nextVal = +(cur + g).toFixed(2);
  P.s[k] = Math.min(130, nextVal);

  if (cur < 100 && P.s[k] >= 100) {
    playJackpotSound();
    toast(`⚡ [스탯 초월] ${STATS[k].n} 100 돌파! 초월의 경지에 올랐습니다!`);
  }

  checkAchievements();
  return g;
}
function addLP(d) {
  const r = P.rank;
  r.lp += d;
  if (r.t < 7) {
    while (r.lp >= 100 && r.t < 7) { r.lp -= 100; r.t++; if (r.t === 7) { r.lp = Math.max(0, r.lp); } }
    while (r.lp < 0 && r.t > 0) { r.t--; r.lp += 100; r.lp = Math.min(r.lp, 75); }
    if (r.t === 0) r.lp = Math.max(0, r.lp);
  }
  if (r.t >= 7) {
    if (r.lp < 0) { r.t = 6; r.lp = 75; }
    else r.t = r.lp >= 500 ? 9 : r.lp >= 200 ? 8 : 7;
  }
  P.bestT = Math.max(P.bestT, r.t);
  checkHeroineUnlocks();
  checkAchievements();
}
function stressAdd(v) {
  let mult = (1.25 - P.s.mental / 160);
  if (P.bonds?.jieun?.aff >= 50 && v > 0) mult *= 0.6; // 지은 힐링 보너스
  P.stress = clamp(P.stress + v * mult, 0, 100);
}
function hpAdd(v) {
  if (v < 0 && P.gear.chair1) v *= .85;
  if (v < 0 && P.bonds?.jieun?.aff >= 75) v *= .85;
  if (v > 0 && P.bonds?.jieun?.aff >= 25) v *= 1.4;
  P.hp = clamp(P.hp + v, 0, 100);
}

function checkAchievements() {
  if (!P || !P.achieves) return;
  for (const ach of ACHIEVES) {

      toast(`🏆 업적 달성: [${ach.n}] ${ach.r}`);
      save();
    }
  }
}

async function showHeroineCutscene(hid, bodyHtml, btns = [{ t: '확인', cls: 'pink' }], sceneImg = null, sceneLabel = null, outfitLabel = null, mood = 'normal') {
  const h = HEROINES[hid];
  const imgSrc = sceneImg || h.img;
  const fallbackSrc = h.fallback;
  const labelHtml = sceneLabel ? `<span class="vn-scene">📍 ${sceneLabel}</span>` : '';
  const outfitHtml = outfitLabel ? `<span class="vn-outfit-badge">👗 ${outfitLabel}</span>` : '';

  const portraitHtml = `
    <div class="vn-portrait mood-${mood}">
      <img src="${imgSrc}" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${fallbackSrc}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${fallbackSrc}';}else{this.onerror=null;this.src='icon-512.png';}" alt="${h.name}">
      <span class="vn-tag">${h.tag}</span>
      ${outfitHtml}
      ${labelHtml}
    </div>
    <div class="c"><span class="vn-speaker">${h.name} (${h.age}세)</span></div>
  `;
  return await ask(portraitHtml + bodyHtml, btns);
}

async function playPcBangTournament() {
  const isPro = P.stage !== 'ama';
  const tourCount = (P.pcBangWins || 0) + 1;
  const tourName = isPro ? '전국 PC방 올스타 초청전' : `제${tourCount}회 우리동네 PC방 롤 최강자전`;

  const rounds = [
    { name: '8강전', opp: pick(['역곡동 불주먹팀', '고딩 야자탈출단', '신림동 롤선생들', '수유리 PC방 알바연합']), diff: isPro ? 70 : 26 },
    { name: '4강 준결승', opp: pick(['신촌 챌린저 유망주', '대학생 랭커 연합', '부천 천상계 클랜', '전국 PC방 랭킹 1위팀']), diff: isPro ? 77 : 33 },
    { name: '결승전 (FINAL)', opp: pick(['강남 아카데미 연습생팀', '전직 프로 지망생 연합', '전국 올스타 챔피언팀']), diff: isPro ? 83 : 40 }
  ];

  let roundResults = [];
  let reachedFinal = true;
  let wonFinal = false;

  const playerPower = ovr() * condF() + (P.hasSupercar ? 4 : 0);

  for (let idx = 0; idx < rounds.length; idx++) {
    const r = rounds[idx];
    const winProb = clamp(sig((playerPower - r.diff) / 5.2), 0.25, 0.92);

async function doAction(k) {
  const a = ACTS.find(x => x.k === k);
  const before = JSON.parse(JSON.stringify(P.s)), r0 = { ...P.rank }, m0 = P.money, f0 = P.fans;
  let extra = '';
  if (a.cost) P.money -= a.cost;

  if (k === 'date') {
    return await handleDatingAction();
  }

  if (k === 'pcbang') {
    hpAdd(a.hp); stressAdd(a.st);
    return await playPcBangTournament();
  }

  switch (k) {
    case 'solo': {
      let w = 0, l = 0;
      const n = 15;
      let eff = ovr() * condF();
      if (P.bonds?.harin?.aff >= 30) eff += 3;
      for (let i = 0; i < n; i++) {
        const p = clamp(sig((eff - tierSkill()) / 5.5), .15, .85);
        const master = P.rank.t >= 7;
        if (Math.random() < p) { w++; addLP(master ? rint(12, 18) : rint(18, 24)); }
        else { l++; addLP(master ? -rint(12, 18) : -rint(16, 21)); }
      }
      grow('mech', 1.3); grow('lane', 1.1); grow('pool', .7);
      if (P.rank.t >= 7) P.fans += Math.round((P.rank.t - 6) * 40 * rnd(.6, 1.4));
      extra = `<div>📊 ${w}승 ${l}패 (승률 ${Math.round(w / n * 100)}%)</div>`;
      if (l > w + 3) stressAdd(8);
      break;
    }
    case 'lane': grow('lane', 2.6); grow('mech', 1.0); break;
    case 'mech': grow('mech', 2.7); break;
    case 'vod': grow('macro', 2.6); grow('team', .9); break;
    case 'pool': grow('pool', 3.0); break;
    case 'scrim': grow('team', 2.5); grow('macro', 1.4); P.syn = Math.min(5, P.syn + 1); break;
    case 'stream': {
      let mul = 1;
      if (P.bonds?.sora?.aff >= 30) mul = 1.6;
      const inc = (100000 + P.fans * 25 * rnd(.7, 1.3)) * mul;
      P.money += inc; P.fans += Math.round((20 + P.fans * .04 * rnd(.5, 1.5)) * mul); grow('mech', .3);
      break;
    }
    case 'rest': break;
    case 'care': grow('mental', 2.2); break;
  }
  hpAdd(a.hp); stressAdd(a.st);
  if (k !== 'scrim' && P.stage !== 'ama') P.syn = Math.max(0, P.syn - .3);

  let statBadges = [];
  for (const s in STATS) {
    const d = P.s[s] - before[s];
    if (d >= .05) statBadges.push(`<span class="badge-pill bg-purple">${STATS[s].n} +${d.toFixed(1)}</span>`);
  }
  let rankHtml = '';
  if (k === 'solo') {
    const up = P.rank.t > r0.t ? ' 🎉 승급!' : P.rank.t < r0.t ? ' 😢 강등' : '';
    rankHtml = `<div style="margin:4px 0">🏅 <span style="color:${TIER_C[r0.t]}">${tierName(r0)}</span> → <b style="color:${TIER_C[P.rank.t]}">${tierName()}</b>${up}</div>`;
  }
  let moneyBadge = P.money !== m0 ? `<span class="badge-pill ${P.money > m0 ? 'bg-gold' : 'bg-red'}">💰 ${P.money > m0 ? '+' : ''}${won(P.money - m0)}원</span>` : '';
  let fanBadge = P.fans !== f0 ? `<span class="badge-pill bg-green">👥 팬 +${num(P.fans - f0)}</span>` : '';
  let hpBadge = `<span class="badge-pill ${a.hp >= 0 ? 'bg-green' : 'bg-red'}">❤️ 체력 ${a.hp >= 0 ? '+' : ''}${a.hp}</span>`;
  let stBadge = `<span class="badge-pill ${a.st <= 0 ? 'bg-green' : 'bg-red'}">😵 스트레스 ${a.st <= 0 ? '' : '+'}${a.st}</span>`;

  return `
    <div class="delta" style="padding:10px">
      ${extra}
      ${rankHtml}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
        ${hpBadge}${stBadge}${moneyBadge}${fanBadge}
        ${statBadges.join('')}
      </div>
    </div>
  `;
}

// ======================================================================
// Web Audio 사운드 신디사이저 (외부 파일 없이 순수 JS로 구현)
// ======================================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSoundTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1, delay = 0) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  } catch (e) {}
}

function playJackpotSound() {
  // 경쾌하고 화려한 팡파레 아르페지오 (C5 - E5 - G5 - C6 - E6 - G6)
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
  notes.forEach((freq, idx) => {
    playSoundTone(freq, 'triangle', 0.28, 0.18, idx * 0.08);
  });
}

function playDateSound() {
  // 로맨틱한 하프 화음 (F5 - A5 - C6)
  [698.46, 880.00, 1046.50].forEach((freq, idx) => {
    playSoundTone(freq, 'sine', 0.45, 0.12, idx * 0.1);
  });
}

function playCoinSound() {
  playSoundTone(987.77, 'square', 0.1, 0.08, 0);
  playSoundTone(1318.51, 'square', 0.2, 0.08, 0.08);
}

async function handleDatingAction() {
  const un = Object.keys(HEROINES).filter(k => P.bonds[k]?.unlocked);
  const btns = un.map(k => {
    const h = HEROINES[k], b = P.bonds[k];
    const lvTxt = b.lv >= 3 ? '💖' : '🌸';
    return { t: `${lvTxt} ${h.name} (${h.tag}) — 호감도 ${b.aff}♥`, cls: 'pink' };
  });
  btns.push({ t: '취소', cls: 'gray' });

  const idx = await ask(`<h3>누구를 만날까요?</h3><p class="c" style="color:#9aa4b2">누구든 자유롭게 여러 명과 동시에 인연을 쌓을 수 있습니다.</p>`, btns);
  if (idx >= un.length) return `<div class="delta">일정을 취소했습니다.</div>`;

  const targetId = un[idx];
  const h = HEROINES[targetId];
  const bond = P.bonds[targetId];

  // 상황별 데이트 장소 선택지
  const dChoices = h.dates.map(d => ({
    t: `${d.n}<br><small style="font-weight:500;color:#93c5fd">📍 ${d.loc} · 💰${won(d.c)}원</small>`,
    cls: 'pink', disabled: P.money < d.c, date: d, type: 'sceneDate'
  }));
  dChoices.push({
    t: `🎁 ${h.name}에게 맞춤 선물하기<br><small style="font-weight:500;color:#fde047">선호하는 선물 아이템</small>`,
    cls: 'gold', type: 'giftShop'
  });
  dChoices.push({ t: '뒤로가기', cls: 'gray' });

  const dIdx = await showHeroineCutscene(targetId, `
    <div class="vn-dialogue">"오늘 시간 내줘서 고마워. 우리 어디 갈까? 너랑 함께라면 어디든 좋아!"</div>
    <div class="c" style="color:#9aa4b2;font-size:12px;margin-bottom:6px">보유 자산: 💰${won(P.money)}원</div>
  `, dChoices);

  if (dIdx >= dChoices.length - 1) return `<div class="delta">데이트를 다음으로 미뤘습니다.</div>`;

  const sel = dChoices[dIdx];

  // 1) 선물하기
  if (sel.type === 'proposeCohabitation') {
    b.cohabiting = true;
    b.aff = 100;
    stressAdd(-40);
    hpAdd(40);
    await showHeroineCutscene(hid, `
      <h4 style="color:#ec4899;margin:0 0 8px;text-align:center">[동거 시작] 둘만의 보금자리</h4>
      <div class="vn-dialogue">
        "동거라니... 정말 나랑 매일 아침 눈뜨고 싶다는 거지? 고마워, 짐 다 싸서 오늘 밤 바로 들어갈게.<br>
        경기 준비하느라 피곤할 텐데, 앞으로 아침밥이랑 건강 관리는 내가 완벽하게 책임질게!"
      </div>
      <div style="background:rgba(236,72,153,0.15);border:1px solid rgba(236,72,153,0.3);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#fbcfe8;text-align:center">
        이제 매주 시작 시 체력이 가득 차고 당일 경기 집중력 버프가 적용됩니다.
      </div>
    `, [{ t: '따뜻하게 안아주기', cls: 'pink' }], h.img, '둘만의 새 집', '실크 슬립 홈웨어');
    save();
    render();
    return;
  }
  if (sel.type === 'giftShop') {
    const gList = h.gifts.map(g => ({
      t: `${g.n} <small>+${g.aff}♥</small><br><b style="color:#ffd23f">💰${won(g.c)}원</b>`,
      cls: 'gold', disabled: P.money < g.c
    }));
    gList.push({ t: '취소', cls: 'gray' });

    const gIdx = await showHeroineCutscene(targetId, `
      <h4 style="color:#f472b6;margin:0 0 8px;text-align:center">🎁 ${h.name}을(를) 위한 선물 고르기</h4>
      <div class="vn-dialogue">"선물...? 나 주는 거야? 고마워, 뭐가 들었을지 너무 기대된다!"</div>
      <div class="c" style="color:#9aa4b2;font-size:12px;margin-bottom:6px">보유 자산: 💰${won(P.money)}원</div>
    `, gList);

    if (gIdx >= h.gifts.length) return `<div class="delta">선물 고르기를 취소했습니다.</div>`;

    const gift = h.gifts[gIdx];
    P.money -= gift.c;
    bond.aff = Math.min(100, bond.aff + gift.aff);
    stressAdd(-25);

    await showHeroineCutscene(targetId, `
      <h4 style="color:#f472b6;margin:0 0 8px;text-align:center">선물 전달</h4>
      <div class="vn-dialogue">${gift.msg}</div>
      <div class="c" style="color:#4ade80;font-weight:800">💖 호감도 +${gift.aff}♥ (현재 ${bond.aff}/100)</div>
    `);

    playCoinSound();
    await checkBondMilestone(targetId);
    await triggerDatingJackpot(targetId);
    checkAchievements();

    return `<div class="delta">
      <div style="color:#f472b6;font-weight:800">🎁 ${h.name}에게 ${gift.n} 선물!</div>
      <div>호감도 <span class="up">+${gift.aff}♥</span> (현재 ${bond.aff}/100) · 스트레스 -25</div>
    </div>`;
  }

  // 2) 상황별 장면 데이트 (실제 CG 출력)
  const dt = sel.date;
  P.money -= dt.c;
  bond.aff = Math.min(100, bond.aff + dt.aff);
  hpAdd(dt.hp);
  stressAdd(dt.st);

  await showHeroineCutscene(targetId, `
    <h4 style="color:#f472b6;margin:0 0 8px;text-align:center">[데이트] ${dt.n}</h4>
    <div class="vn-dialogue">${dt.dialogue}</div>
    <div class="c" style="color:#4ade80;font-weight:800">💖 호감도 +${dt.aff}♥ (현재 ${bond.aff}/100) · 체력 +${dt.hp} · 스트레스 ${dt.st}</div>
  `, [{ t: '대화 나누기', cls: 'pink' }], dt.img, dt.loc);

  playDateSound();
  await checkBondMilestone(targetId);
  await triggerDatingJackpot(targetId);
  checkAchievements();

  return `<div class="delta">
    <div style="color:#f472b6;font-weight:800">💖 ${h.name}과(와)의 ${dt.loc} 데이트</div>
    <div>호감도 <span class="up">+${dt.aff}♥</span> (현재 ${bond.aff}/100) · 체력 +${dt.hp} · 스트레스 ${dt.st}</div>
  </div>`;
}

async function checkBondMilestone(hid) {
  const h = HEROINES[hid], b = P.bonds[hid];
  for (const st of h.story) {
    if (b.aff >= st.req && b.lv < st.lv) {
      b.lv = st.lv;
      const chBtns = st.choice.map((c, i) => ({ t: c, cls: i === 0 ? 'pink' : 'purple' }));
      await showHeroineCutscene(hid, `
        <h4 style="color:#f472b6;margin:4px 0 8px;text-align:center">[인연 스토리] ${st.title}</h4>
        <div class="vn-dialogue">${st.dialogue}</div>
        <div class="c" style="color:#4ade80;font-size:12.5px;font-weight:700;margin-bottom:6px">효과: ${st.gain}</div>
      `, chBtns, st.img, st.title);
      toast(`💖 ${h.name} 인연 Lv.${b.lv} 달성!`);
      save();
    }
  }
}

async function negotiateSalary(team, baseSal, isRenew) {
  let sal = baseSal;
  const o = ovr();
  const avg = P.ratings.length ? P.ratings.reduce((a, b) => a + b, 0) / P.ratings.length : 6;
  const hasMina = P.bonds?.mina?.aff >= 50;

  const html = `
    <div class="em">💼</div>
    <h3>${team.name} 연봉 협상 테이블</h3>
    <div class="c" style="color:#9aa4b2;margin-bottom:10px">
      종합 전력 ${Math.round(o)} · 시즌 평균 평점 ${avg.toFixed(1)} · 팬 ${num(P.fans)}명
    </div>
    <div style="background:#0e1324;border:1px solid #283354;border-radius:12px;padding:12px;margin-bottom:10px">
      <div class="kv"><span>구단 기본 제시 주급</span><b>${won(sal)}원</b></div>
      <div class="kv"><span>연간 환산 연봉</span><b>💰 ${won(sal * YEAR_WEEKS)}원</b></div>
    </div>
    <p class="c" style="font-size:12.5px;color:#cbd5e1">어떤 협상 전략으로 계약에 임할까요?</p>
  `;

  const stratBtns = [
    { t: '✍️ 1. 제시액에 만족하고 즉시 서명<br><small style="font-weight:500;color:#94a3b8">안전 · 구단 신뢰도↑ (팀 호흡 +1)</small>', cls: 'green' },
    { t: '📈 2. 활약상 어필 (+25% 인상 요구)<br><small style="font-weight:500;color:#94a3b8">평점과 실력에 근거한 정당한 인상 요구</small>', cls: 'gold' },
    { t: '💼 3. 리그 최고 대우 요구 (+50% 파격 인상)<br><small style="font-weight:500;color:#94a3b8">성공 시 역대급 초대형 계약! 실패 시 구단 난색 & 삭감 리스크</small>', cls: 'purple' },
    { t: '🏆 4. 성과급 인센티브 옵션 계약<br><small style="font-weight:500;color:#94a3b8">+10% 기본급 + 우승/POG 추가 수당</small>', cls: 'gray' }
  ];

  if (hasMina) {
    stratBtns.unshift({
      t: '💖 [민아 찬스] 매니저 민아의 막후 중재 협상<br><small style="font-weight:500;color:#fbcfe8">100% 안전하게 +30% 인상 & 옵션 보장</small>',
      cls: 'pink'
    });
  }

  const cIdx = await ask(html, stratBtns);
  let choice = stratBtns[cIdx].t;

  if (choice.includes('민아 찬스')) {
    sal = Math.round(sal * 1.3);
    await showHeroineCutscene('mina', `
      <div class="vn-dialogue">"단장님이랑 프런트 회의 다녀왔어! 네 경기 지표랑 해외 오퍼 루머 들이밀면서 설득했지. 30% 파격 인상에 성공했어! 누나 멋있지?"</div>
      <div class="c" style="color:#ffd23f;font-weight:900;font-size:16px">최종 주급 ${won(sal)}원 (연봉 ${won(sal * YEAR_WEEKS)}원) 확정!</div>
    `, [{ t: '고마워요 누나!', cls: 'pink' }], 'assets/mina_lounge.jpg', '선수 대기실');
    P.syn = Math.min(5, P.syn + 2);
  } else if (choice.includes('1.')) {
    await ask(`<h3>✍️ 즉시 계약 체결</h3><p class="c">구단 프런트: "${P.name} 선수의 팀을 생각하는 마음에 감사드립니다. 이번 시즌 함께 영광을 만들어갑시다!"</p>`, [{ t: '서명 완료', cls: 'green' }]);
    P.syn = Math.min(5, P.syn + 1);
  } else if (choice.includes('2.')) {
    const chance = clamp(50 + (avg - 6.5) * 25 + (o - team.str) * 2 + (P.fans / 20000) * 10, 20, 95);
    if (Math.random() * 100 < chance) {
      sal = Math.round(sal * 1.25);
      await ask(`<div class="em">🎉</div><h3>인상안 전격 수용!</h3><p class="c">구단 프런트: "${P.name} 선수의 지난 시즌 지표와 팬덤을 감안해 25% 인상 요구를 승인합니다!"</p><div class="c" style="color:#ffd23f;font-size:16px;font-weight:900">최종 주급 ${won(sal)}원</div>`, [{ t: '계약 체결', cls: 'gold' }]);
    } else {
      await ask(`<div class="em">😅</div><h3>인상안 반려</h3><p class="c">구단 프런트: "예산 한계로 추가 인상은 어렵습니다. 원안 그대로 진행하시겠습니까?"</p>`, [{ t: '원안 수락', cls: 'gray' }]);
    }
  } else if (choice.includes('3.')) {
    const chance = clamp(25 + (avg - 7.5) * 35 + (P.hist.mvp >= 3 ? 20 : 0) + (P.worldsQ ? 20 : 0), 10, 80);
    if (Math.random() * 100 < chance) {
      sal = Math.round(sal * 1.5);
      await ask(`<div class="em">🔥💰</div><h3>최고 대우 계약 성사!</h3><p class="c">구단주 긴급 승인: "다른 팀에 뺏길 수 없다! 50% 파격 인상안 전격 수용!"</p><div class="c" style="color:#ffd23f;font-size:18px;font-weight:900">최종 주급 ${won(sal)}원 (연봉 ${won(sal * YEAR_WEEKS)}원)</div>`, [{ t: '전설의 계약', cls: 'purple' }]);
    } else {
      sal = Math.round(sal * 0.9);
      stressAdd(15);
      await ask(`<div class="em">📉</div><h3>협상 난항 & 삭감</h3><p class="c">구단 프런트: "무리한 요구로 협상 분위기가 냉각되었습니다. 재조정된 10% 삭감안이 최종 통보입니다."</p><div class="c" style="color:#ef4444;font-size:15px;font-weight:800">조정 주급 ${won(sal)}원</div>`, [{ t: '어쩔 수 없이 서명', cls: 'red' }]);
    }
  } else if (choice.includes('4.')) {
    sal = Math.round(sal * 1.1);
    await ask(`<div class="em">🏆</div><h3>인센티브 옵션 계약</h3><p class="c">기본 주급 10% 인상 + 대회 승리/우승 시 대폭 보너스 지급 옵션이 추가되었습니다!</p><div class="c" style="color:#ffd23f;font-size:16px;font-weight:900">최종 주급 ${won(sal)}원</div>`, [{ t: '옵션 서명', cls: 'gold' }]);
  }

  return sal;
}

function teamName() { const t = myTeam(); return t ? t.name : '아마추어'; }

async function playMatch(opp, label, big = false, isFastAuto = false) {
  if (P.fastSkip || isFastAuto) {
    // 빠른 진행: 챔피언 선택 모달 생략 & AI 최적 픽 자동 시뮬레이션
    const myPos = P.pos || 'mid';
    const myCandidates = CHAMPIONS.filter(c => c.role === myPos);
    const selChamp = myCandidates[0] || CHAMPIONS[0];
    const myPow = teamPow();
    const opPow = opp.str;
    const winProb = clamp(0.5 + (myPow - opPow) * 0.035, 0.1, 0.9);
    const isWin = Math.random() < winProb;
    const mySetW = isWin ? (Math.random() < 0.65 ? 2 : 2) : (Math.random() < 0.4 ? 1 : 0);
    const mySetL = isWin ? (mySetW === 2 ? (Math.random() < 0.35 ? 1 : 0) : 1) : 2;
    toast(`⚡ [${label}] 경기 완료: ${opp.name}전 ${isWin ? '승리(2:' + mySetL + ')' : '패배(' + mySetW + ':2)'}`);
    return { win: isWin, mySetW, mySetL, adv: isWin ? 3.5 : -3.5, kills: isWin ? 6 : 2, deaths: isWin ? 1 : 4, assists: 7 };
  }
  const bp = await showLckChampionSelectModal(opp);
  const main = $('#main');
  const my = teamPow(), op = opp.str;
  const isCounter = !!bp?.isCounter;
  const synergy = bp?.synergy;
  let adv = (my - op) * 0.08 + (isCounter ? 1.5 : 0), perf = 0, kills = 0, deaths = 0, assists = 0, bdWin = null;
  let phaseWins = 0;
  const myName = teamName();

  let skinNameTxt = '';
  if (P.equippedSkin) {
    const sk = SKINS.find(x => x.k === P.equippedSkin);
    if (sk) skinNameTxt = `<span class="skin-tag ${sk.tagCls}" style="margin-left:6px">${sk.n} 착용</span>`;
  }

  const renderHead = () => {
    const pct = clamp(sig(adv / 2.8) * 100, 4, 96);
    const gd = adv * 1000;
    return `<div class="card"><div class="mlabel">${label} ${skinNameTxt}</div>
      <div class="mhead"><div class="tm">${myName}<small>전력 ${my.toFixed(1)}</small></div><div class="vs">VS</div>
      <div class="tm">${opp.name}<small>전력 ${op.toFixed(1)}</small></div></div>
      <div class="gold"><div class="tr"><div class="fi" style="width:${pct}%"></div></div>
      <div class="gl"><span>골드 ${gd >= 0 ? '+' + num(gd) : ''}</span><span>${gd < 0 ? '+' + num(-gd) : ''}</span></div></div></div>`;
  };
  let log = '';
  const draw = (choices = '') => {
    main.innerHTML = renderHead() + `<div class="card log">${log || '<p class="neu">경기가 시작됩니다. 소환사의 협곡에 오신 것을 환영합니다!</p>'}</div>` + choices;
    main.scrollTop = main.scrollHeight;
  };
  draw();
  await sleep(400);
  const mentalVar = (1.25 - P.s.mental / 200) * (big ? 1.15 : 1);

  const curPhases = PHASES_BY_POS[P.pos || 'mid'] || PHASES_BY_POS.mid;
  for (let pi = 0; pi < curPhases.length; pi++) {
    // 3단계 직전 클러치 QTE: 팽팽하거나 중요한 승부처일 때 확률적 등장
    if (pi === 2 && Math.random() < 0.5) {
      try {
        const qteRes = await triggerClutchQTE();
        adv += qteRes.adv;
        kills += qteRes.kills;
        assists += qteRes.assists;
        if (!qteRes.success) deaths += 1;
      } catch (err) {
        console.error('QTE error:', err);
      }
    }
    const ph = curPhases[pi];
    let fastSkipped = false;
    const choice = await new Promise(res => {
      draw(`<div class="card choices">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h4 style="margin:0">${ph.n} — 어떻게 할까요?</h4>
          <button class="badge-pill bg-gold" id="bFastSkip" style="border:0;cursor:pointer;padding:4px 10px">⚡ 빠른 결과 보기</button>
        </div>
        ${ph.opts.map((o, i) =>
        `<button class="btn" data-i="${i}">${o.t}<small>${o.d} · 내 능력 ${Math.round(statMix(o.st))}</small></button>`).join('')}
        <button class="btn gray" data-i="auto" style="text-align:center">🤖 자동 선택</button></div>`);
      const skipBtn = document.querySelector('#bFastSkip');
      if (skipBtn) skipBtn.onclick = () => { fastSkipped = true; res(ph.opts[0]); };
      main.querySelectorAll('.choices .btn').forEach(b => b.onclick = () => {
        if (b.disabled) return;
        main.querySelectorAll('.choices .btn').forEach(btn => btn.disabled = true);
        let i = b.dataset.i;
        if (i === 'auto') {
          let best = 0, bv = -1;
          ph.opts.forEach((o, j) => {
            if (o.bd) return;
            const v = statMix(o.st) - o.risk * 3;
            if (v > bv) { bv = v; best = j; }
          });
          i = best;
        }
        res(ph.opts[+i]);
      });
    });

    let sv = statMix(choice.st) * condF();
    if (pi === 0 && isCounter) sv *= 1.15;
    if (pi === 0 && synergy?.key === 'poke') sv *= 1.18;
    if ((pi === 1 || pi === 2) && synergy?.key === 'dive') sv *= 1.18;
    if (pi === 2 && synergy?.key === 'wombo') sv *= 1.22;
    const oppStat = op * 0.96;
    let score = (sv * 0.45 + my * 0.55 - oppStat) / 9 + gauss() * 0.75 * mentalVar;

    if (P.equippedSkin === 'skin_mythic' && pi === 2 && score < 0) {
      score = 1.6;
      log += `<p class="good" style="border-left-color:#facc15"><span class="ph">✨ [초월급 스킨] 불멸의 황제 강림!</span>황금빛 이펙트와 함께 협곡을 뒤흔드는 궁극기로 전황을 단번에 뒤집었다!</p>`;
    }

    let good = score > 0;
    if (choice.bd) {
      good = score > 1.35;
      if (good) bdWin = true; else { adv -= 4; score = -1.5; }
    }

    if (good) {
      phaseWins++;
      adv += Math.max(0.6, score * choice.risk * 1.3);
      perf += score * choice.risk;
      kills += rint(1, 2) + (score > 0.8 ? 1 : 0);
      assists += rint(1, 3);
    } else {
      adv -= Math.max(0.8, Math.abs(score) * choice.risk * 1.4);
      perf += score * choice.risk;
      deaths += rint(1, 2);
      assists += rint(0, 1);
    }

    const txt = pick(good ? choice.g : choice.b);
    log += `<p class="${good ? 'good' : 'bad'}"><span class="ph">${ph.n} · ${choice.t}</span>${txt}</p>`;
    draw(); await sleep(500);
    if (bdWin) break;
  }

  // 3전 3패일 때 골드 차이 강제 보정 (다 졌는데 골드 리드가 나오는 모순 100% 제거)
  if (phaseWins === 0 && adv > -1.5) {
    adv = -2.5 - rnd(0.5, 2.5);
  }

  // 승패 판정 로직 현실화
  const powerDiff = (my - op);
  let winProb;
  if (phaseWins === 0) {
    // 3페이즈 전부 실패(0승 3패): 본인이 완벽하게 역캐리한 경기
    // 상대가 전력 80대 강팀이면 패배 확률 96%! 팀이 압도적이지 않는 한 절대 2:0 완승 불가!
    winProb = powerDiff > 18 ? 0.35 : 0.04;
  } else if (phaseWins === 1) {
    // 1승 2패: 부진
    winProb = clamp(0.25 + powerDiff * 0.02 + adv * 0.08, 0.08, 0.60);
  } else if (phaseWins === 2) {
    // 2승 1패: 호각 / 우세
    winProb = clamp(0.60 + powerDiff * 0.02 + adv * 0.08, 0.20, 0.85);
  } else {
    // 3승 0패: 하드캐리
    winProb = clamp(0.85 + powerDiff * 0.015 + adv * 0.08, 0.40, 0.98);
  }

  const win = bdWin ? true : Math.random() < winProb;

  // 현실적인 평점 산출
  let rating;
  if (phaseWins === 0) {
    rating = clamp(1.2 + Math.random() * 1.5, 1.0, 2.7);
  } else if (phaseWins === 1) {
    rating = clamp(3.5 + Math.random() * 2.0, 3.0, 5.5);
  } else if (phaseWins === 2) {
    rating = clamp(6.2 + Math.random() * 1.8, 5.8, 7.9);
  } else {
    rating = clamp(8.4 + Math.random() * 1.4, 8.2, 9.9);
  }

  const mvp = win && rating >= 8.3 && phaseWins >= 2;
  P.hist.games++; if (win) P.hist.wins++; if (mvp) P.hist.mvp++;
  P.ratings.push(rating);

  // 세트 스코어 및 경기 요약
  let mySetW, mySetL, setDesc;
  if (win) {
    if (phaseWins === 0) {
      mySetW = 2; mySetL = 1;
      setDesc = '팀원들의 4:5 하드캐리 (2:1 버스 탑승 승리)';
    } else if (phaseWins >= 2 && (adv >= 2.0 || rating >= 8.0)) {
      mySetW = 2; mySetL = 0;
      setDesc = '완승 (2:0 Shutout)';
    } else {
      mySetW = 2; mySetL = 1;
      setDesc = '혈투 끝 신승 (2:1 Clutch)';
    }
  } else {
    if (phaseWins === 0 || adv <= -2.5) {
      mySetW = 0; mySetL = 2;
      setDesc = '완패 (0:2 Sweep)';
    } else {
      mySetW = 1; mySetL = 2;
      setDesc = '풀세트 석패 (1:2 Defeat)';
    }
  }

  // 팬 증감 (0승 3패 부진 시 팬들의 비판/조롱 여론)
  let fanMul = 1;
  if (P.bonds?.sora?.aff >= 50) fanMul += 0.6;
  if (P.bonds?.chloe?.aff >= 50) fanMul += 1.0;
  if (P.bonds?.sea?.aff >= 50) fanMul += 0.5;

  let fanGain = 0;
  if (phaseWins === 0) {
    if (win) {
      fanGain = 50; // 이겨도 비난 여론으로 팬 증가 극소
    } else {
      fanGain = -Math.round(P.fans * 0.02 + 150); // 패배 시 팬 이탈
    }
  } else {
    const baseFan = win ? (phaseWins === 3 ? 1200 : 600) : 150;
    fanGain = Math.round(baseFan * (P.stage === 'pro' ? 1.5 : 1) * (big ? 2 : 1) * fanMul * rnd(0.8, 1.2));
  }
  P.fans = Math.max(0, P.fans + fanGain);

  if (win) stressAdd(phaseWins === 0 ? 5 : -6); else stressAdd(big ? 15 : 9);
  hpAdd(-8);
  grow('team', .5); grow('mental', .25);

  let coachComment = '';
  if (phaseWins === 0) {
    coachComment = win 
      ? '<div style="background:#2d1b0a;border:1px solid #f59e0b;color:#fde047;padding:8px 10px;border-radius:8px;font-size:12px;margin-top:6px;text-align:center">⚠️ <b>[해설진 일침]</b> "본인은 0/3으로 매우 참담했으나 팀원들의 기적 같은 한타력이 사람 하나 살렸습니다."</div>'
      : '<div style="background:#3b1111;border:1px solid #ef4444;color:#fca5a5;padding:8px 10px;border-radius:8px;font-size:12px;margin-top:6px;text-align:center">🚨 <b>[경기 패인 분석]</b> 전 라인전과 한타에서 완벽하게 침묵하며 0:2 완패의 원흉이 되었습니다. 폼 점검이 시급합니다.</div>';
  } else if (phaseWins === 3) {
    coachComment = '<div style="background:#062d1a;border:1px solid #22c55e;color:#86efac;padding:8px 10px;border-radius:8px;font-size:12px;margin-top:6px;text-align:center">👑 <b>[MVP 극찬]</b> "협곡을 혼자서 파괴하는 미친 피지컬! 원맨쇼로 팀을 완승으로 이끌었습니다!"</div>';
  }

  log += `<div class="result"><div class="big ${win ? 'win' : 'lose'}">${win ? '승리' : '패배'}</div>
    <div style="font-size:14.5px;font-weight:900;color:${win ? '#4ade80' : '#f87171'};margin-bottom:6px">🔥 세트 스코어 <b>${mySetW} : ${mySetL}</b> · ${setDesc}</div>
    <div class="kda"><div><b>${kills}/${deaths}/${assists}</b>KDA</div><div><b>${rating.toFixed(1)}</b>평점</div><div><b>${fanGain >= 0 ? '+' : ''}${num(fanGain)}</b>팬</div></div>
    ${coachComment}
    ${mvp ? '<div style="color:#fde047;font-weight:900;margin-top:6px">🏅 POG(Player of the Game) 만장일치 선정!</div>' : ''}</div>`;
  draw(`<button class="btn wide" id="nextBtn">계속</button>`);
  await new Promise(r => $('#nextBtn').onclick = r);

  if (win) await checkHeroineUnlocks();
  checkAchievements();

  return { win, rating, mySetW, mySetL };
}
function statMix(st) { let t = 0; for (const k in st) t += P.s[k] * st[k]; return t; }

function simGame(a, b) { return Math.random() < sig((a.str - b.str) / 6); }
function simRound(league, skipIds) {
  const others = shuffle(league.filter(t => !skipIds.includes(t.id)));
  for (let i = 0; i + 1 < others.length; i += 2) {
    const a = others[i], b = others[i + 1];
    if (!a.setW) { a.setW = a.w * 2; a.setL = a.l * 2; }
    if (!b.setW) { b.setW = b.w * 2; b.setL = b.l * 2; }
    const winA = simGame(a, b);
    const sweep = Math.random() < 0.65;
    if (winA) {
      a.w++; b.l++;
      a.setW += 2; a.setL += sweep ? 0 : 1;
      b.setW += sweep ? 0 : 1; b.setL += 2;
    } else {
      b.w++; a.l++;
      b.setW += 2; b.setL += sweep ? 0 : 1;
      a.setW += sweep ? 0 : 1; a.setL += 2;
    }
  }
}
const standings = lg => lg.slice().sort((a, b) => {
  const diffA = (a.setW || a.w * 2) - (a.setL || a.l * 2);
  const diffB = (b.setW || b.w * 2) - (b.setL || b.l * 2);
  return (b.w - a.w) || (diffB - diffA) || (b.str - a.str);
});

let busy = false;
async function takeTurn(k) {
  P.lastAction = k;
  P.weeklyDates = 0;
  if (busy) return;
  const a = ACTS.find(x => x.k === k);
  if (a.cost && P.money < a.cost) { toast('돈이 부족해요'); return; }
  busy = true;
  try {
    const summary = await doAction(k);
    await ask(`<h3>${a.n}</h3><div class="c" style="color:#9aa4b2">${P.year}년차 ${P.week}주차</div>${summary}`, [{ t: '다음' }]);
    await weekEnd();
  } finally { busy = false; save(); render(); }
}

async function weekEnd(isFastAuto = false) {
  // 동거 중인 히로인이 있으면 아침밥 버프 적용
  if (P.bonds) {
    const cohabiter = Object.keys(P.bonds).find(k => P.bonds[k]?.cohabiting);
    if (cohabiter) {
      P.hp = Math.min(100, P.hp + 20);
      P.stress = Math.max(0, P.stress - 15);
    }
  }
  const ph = phaseOf(P.week);
  const lg = P.stage === 'pro' ? P.pro : P.stage === 'aca' ? P.aca : null;

  if (lg && ph.t === 'reg') {
    const me = myTeam();
    const opps = lg.filter(t => t.id !== me.id);
    const opp = opps[(ph.r - 1 + P.year) % opps.length];
    const res = await playMatch(opp, `${P.stage === 'pro' ? 'LCK' : 'LCK 챌린저스'} ${ph.sp} ${ph.r}라운드`, false, isFastAuto);
    if (!me.setW) { me.setW = me.w * 2; me.setL = me.l * 2; }
    if (!opp.setW) { opp.setW = opp.w * 2; opp.setL = opp.l * 2; }
    if (res.win) {
      me.w++; opp.l++;
      me.setW += (res.mySetW || 2); me.setL += (res.mySetL || 0);
      opp.setW += (res.mySetL || 0); opp.setL += (res.mySetW || 2);
    } else {
      me.l++; opp.w++;
      me.setW += (res.mySetW || 0); me.setL += (res.mySetL || 2);
      opp.setW += (res.mySetL || 2); opp.setL += (res.mySetW || 0);
    }
    simRound(lg, [me.id, opp.id]);
    if (P.stage === 'aca') await checkCallUp();
  }
  if (ph.t === 'reg') {
    if (P.stage !== 'pro') simRound(P.pro, []);
    if (P.stage !== 'aca') simRound(P.aca, []);
  }
  if (ph.t === 'brk' && (P.year === 3 || P.year === 6)) await triggerAsianGames();
  if (ph.t === 'po') await playoffs(ph.sp);
  if (ph.t === 'wg' || ph.t === 'wk' || ph.t === 'wf') await worlds(ph.t);
  if (ph.t === 'con') await contracts();

  if (P.salary) P.money += P.salary;

  if (P.properties && P.properties.length > 0) {
    const weeklyRent = P.properties.reduce((sum, id) => {
      const pr = REAL_ESTATE.find(r => r.id === id);
      return sum + (pr ? pr.rent : 0);
    }, 0);
    if (weeklyRent > 0) {
      P.money += weeklyRent;
    }
  }
  updateStockMarket();
  await checkAsianGames();


  if (P.stress >= 100) {
    if (P.bonds?.jieun?.aff >= 75) {
      P.stress = 60;
      await showHeroineCutscene('jieun', `<h3>💖 지은이의 따뜻한 간호</h3><div class="vn-dialogue">"너 번아웃 온 것 같아서 숙소 앞으로 바로 뛰어왔어. 오늘은 아무 생각도 하지 말고 푹 쉬어... 내가 곁에 있어줄게."<br><br><b>소꿉친구 지은의 헌신으로 번아웃 위기를 넘겼습니다!</b></div>`, [{ t: '고마워 지은아', cls: 'pink' }], 'assets/jieun_night.jpg', '숙소 앞 밤거리');
    } else {
      P.stress = 55; P.hp = Math.min(P.hp, 40);
      if (P.stage === 'ama') addLP(-60);
      await ask(`<div class="em">🫠</div><h3>번아웃</h3><p class="c">스트레스가 한계에 달했다. 아무것도 손에 잡히지 않는다...</p><p class="c" style="color:#9aa4b2">체력·티어 하락. 휴식과 인연 데이트를 챙기세요.</p>`);
    }
  } else if (P.hp <= 0) {
    P.hp = 35; stressAdd(10);
    await ask(`<div class="em">🤒</div><h3>몸살</h3><p class="c">무리한 일정에 몸이 버티지 못했다.</p>`);
  }

  // 복수 연인 질투/삼자대면 이벤트 (호감도 50 이상 히로인이 2명 이상일 때)
  const highLoves = Object.keys(P.bonds).filter(k => P.bonds[k].aff >= 50);
  if (highLoves.length >= 2 && Math.random() < 0.2) {
    await triggerJealousyEvent(highLoves);
  } else if (ph.t !== 'po' && !ph.t.startsWith('w') && Math.random() < .45) {
    await randomEvent();
  }

  await scouting();
  checkAchievements();

  checkWeeklyDM();
  checkNeglectedHeroineDMs();
  checkEndgameMilestones();
  P.week++;
  if (P.week > YEAR_WEEKS) {
    P.week = 1; P.year++; P.age++;
    P.worldsQ = false; P.springChamp = -1;
    for (const t of P.pro) { t.str = clamp(t.str + rint(-5, 5), 56, 86); t.starter = clamp(t.str + rint(-10, 2), 50, 92); }
    for (const t of P.aca) t.str = clamp(t.str + rint(-4, 4), 36, 60);
    if (P.age >= RETIRE_AGE) { await ending(true); return; }
    await ask(`<div class="em">🎆</div><h3>${P.year}년차 시즌 시작</h3><p class="c">${P.name} 선수 ${P.age}세. 새로운 시즌이 밝았다!</p>`);
  }
  const nph = phaseOf(P.week);
  if (nph.t === 'reg' && nph.r === 1) { for (const t of P.pro.concat(P.aca)) { t.w = 0; t.l = 0; t.setW = 0; t.setL = 0; } P.ratings = []; }
}

function salaryFor(team) {
  if (P.stage === 'aca') return 300000;
  const o = ovr();
  let sal = (800000 + Math.pow(Math.max(0, o - 50), 2) * 18000 + P.fans * 8);
  if (P.bonds?.mina?.aff >= 50) sal *= 1.25;
  return Math.round(sal / 10000) * 10000;
}

async function contracts() {
  const o = ovr();
  if (P.stage === 'ama') return;
  const avg = P.ratings.length ? P.ratings.reduce((a, b) => a + b, 0) / P.ratings.length : 6;
  const offers = [];
  if (P.stage === 'pro') {
    const cur = P.pro[P.teamId];
    if (avg >= 5 || o >= cur.starter) offers.push({ team: cur, renew: true });
    for (const t of shuffle(P.pro)) {
      if (t.id === cur.id || offers.length >= 3) continue;
      if (o >= t.starter - 2 && Math.random() < .55) offers.push({ team: t });
    }
    // 4년차 이상 & 오버롤 85+ 일 때 중국 LPL / 북미 LCS 100억 파격 이적 제안
    if (P.year >= 4 && o >= 85) {
      const isMega = o >= 92;
      const offerSal = isMega ? 10000000000 : 2500000000;
      offers.push({
        team: { id: 99, name: isMega ? '상하이 드래곤즈 (중국 LPL)' : '로스앤젤레스 레전드 (북미 LCS)', str: 87, starter: 84 },
        overseas: true,
        sal: offerSal,
        bonusDesc: isMega ? '💰 100억 슈퍼스타 계약 제안!' : '💰 25억 해외 진출 제안'
      });
    }
  } else {
    for (const t of shuffle(P.pro)) {
      if (offers.length >= 2) break;
      if (o >= t.starter - 3 && Math.random() < .6) offers.push({ team: t, pro: true });
    }
    offers.push({ team: P.aca[P.teamId], renew: true, aca: true });
  }
  if (!offers.length) {
    const t = P.aca[P.teamId];
    await ask(`<div class="em">📉</div><h3>재계약 불발</h3><p class="c">${P.pro[P.teamId].name}이 재계약을 하지 않았다.<br>${t.name}(2군)로 내려간다.</p>`);
    P.stage = 'aca'; P.salary = 300000; return;
  }
  const html = `<div class="em">📝</div><h3>스토브리그 - 계약 제안</h3><p class="c" style="color:#9aa4b2">시즌 평균 평점 ${avg.toFixed(1)} · 종합 ${Math.round(o)}</p>`;
  const btns = offers.map(of => {
    const isPro = !of.aca;
    let sal = isPro ? Math.round((800000 + Math.pow(Math.max(0, o - 50), 2) * 18000 + P.fans * 8) * (of.renew ? 1 : 1.1) * (1 + (of.team.str - 70) / 60) / 10000) * 10000 : 300000;
    if (P.bonds?.mina?.aff >= 50) sal = Math.round(sal * 1.2);
    of.sal = sal;
    return { t: `${of.renew ? '🔁 재계약' : '✉️ 이적'} ${of.team.name}${isPro ? '' : ' (2군)'}<br><small style="font-weight:500">팀 전력 ${of.team.str} · 기본 제시 ${won(sal * YEAR_WEEKS)}원/년</small>`, cls: of.renew ? 'gray' : 'purple' };
  });
  const i = await ask(html, btns);
  const of = offers[i];

  const finalSal = await negotiateSalary(of.team, of.sal, of.renew);
  P.salary = finalSal;

  if (of.aca) { P.stage = 'aca'; }
  else {
    if (P.teamId !== of.team.id || P.stage !== 'pro') P.syn = 0;
    P.stage = 'pro'; P.teamId = of.team.id; P.hist.bestStage = 'pro';
    of.team.starter = Math.max(of.team.starter, o);
    if (!of.renew) P.hist.log.push(`${P.year}년차 ${of.team.name} 이적`);
  }
  toast('계약 완료!');
}

async function scouting() {
  if (P.scoutCD > 0) { P.scoutCD--; return; }
  const ph = phaseOf(P.week);
  if (ph.t === 'po' || ph.t.startsWith('w')) return;
  const o = ovr();
  const canScout = P.stage === 'ama' && (P.rank.t >= 7 || (P.rank.t >= 6 && (P.pcBangWins || 0) >= 1));
  if (canScout) {
    const direct = P.pro.filter(t => o >= t.starter - 1).sort((a, b) => b.str - a.str);
    if (P.rank.t >= 8 && direct.length && Math.random() < .45) {
      const t = direct[0];
      const i = await ask(`<div class="em">📨</div><h3>1군 직행 스카우트!</h3><p class="c"><b>${t.name}</b>(전력 ${t.str}) 감독에게서 연락이 왔다.<br>"솔랭 ${TIERS[P.rank.t]} 아이디 맞으시죠? 바로 주전으로 쓰고 싶습니다."</p>`,
        [{ t: '연봉 협상 및 입단!', cls: 'gold' }, { t: '좀 더 고민한다', cls: 'gray' }]);

        const base = salaryFor(t);
        const finalSal = await negotiateSalary(t, base, false);
        P.stage = 'pro'; P.teamId = t.id; P.salary = finalSal; P.hist.bestStage = 'pro';
        t.starter = Math.max(t.starter, o);

        await checkHeroineUnlocks();
        checkAchievements();
      } else P.scoutCD = 4;
      return;

    if (Math.random() < .4) {

      const i = await ask(`<div class="em">📨</div><h3>스카우트 제안</h3><p class="c"><b>${t.name}</b>(${P.pro[t.id].name} 2군)에서 입단 테스트 제안이 왔다!<br>"${TIERS[P.rank.t]} 찍으셨던데, 연습생으로 와보실래요?"</p>
        <p class="c" style="color:#9aa4b2">2군에서 활약하면 1군 콜업 기회!</p>`,
        [{ t: '입단한다', cls: 'gold' }, { t: '거절 (더 높은 곳을 노린다)', cls: 'gray' }]);
      if (i === 0) {
        P.stage = 'aca'; P.teamId = t.id; P.salary = 300000; P.syn = 0; P.hist.bestStage = 'aca';
        P.hist.log.push(`${P.year}년차 ${t.name} 입단 (연습생)`);
        await ask(`<div class="em">🎉</div><h3>프로 연습생이 되었다!</h3><p class="c">이제 매주 주말 KCL 챌린저스 경기에 출전합니다.<br>🤝 팀 스크림으로 팀 호흡을 맞추세요.</p>`);
        await checkHeroineUnlocks();
        checkAchievements();
      } else P.scoutCD = 3;
    }
  }
}

async function ending(natural) {
  const h = P.hist;
  const worldsT = h.titles.filter(t => t.includes('월드')).length;
  const leagueT = h.titles.filter(t => t.includes('KCL ') && !t.includes('챌린저스')).length;
  let grade, desc;
  if (worldsT >= 2) { grade = '🐐 GOAT'; desc = '역사상 최고의 선수. 모두가 당신의 이름을 기억한다.'; }
  else if (worldsT === 1) { grade = '👑 전설'; desc = '월드 챔피언. 명예의 전당에 이름을 올렸다.'; }
  else if (leagueT >= 2) { grade = '⭐ 레전드'; desc = 'KCL을 지배한 선수.'; }
  else if (leagueT === 1 || h.worlds > 0) { grade = '🏅 스타 플레이어'; desc = '정상에 오른 경험이 있는 선수.'; }
  else if (h.bestStage === 'pro') { grade = '🎽 프로게이머'; desc = '꿈의 무대에 섰던 선수.'; }
  else if (h.bestStage === 'aca') { grade = '🌱 연습생 출신'; desc = '프로의 문턱까지 갔었다.'; }
  else { grade = '🎮 솔랭 고수'; desc = `최고 ${TIERS[P.bestT]}. 프로의 꿈은 이루지 못했다.`; }

  const loves80 = Object.keys(P.bonds).filter(k => P.bonds[k].aff >= 70);
  let romanceHtml = '';

  if (loves80.length >= 2) {
    // 하렘 챔피언 엔딩
    const imgsHtml = loves80.map(k => `
      <div style="flex:1;max-width:90px;height:115px;border-radius:8px;overflow:hidden;border:1px solid #f472b6">
        <img src="${HEROINES[k].img}" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${HEROINES[k].fallback}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${HEROINES[k].fallback}';}else{this.onerror=null;this.src='icon-512.png';}" style="width:100%;height:100%;object-fit:cover;object-position:top">
      </div>
    `).join('');

    romanceHtml = `
      <div style="margin-top:14px;padding:12px;background:#281534;border:2px solid #ec4899;border-radius:14px;text-align:center">
        <h4 style="color:#f472b6;margin:0 0 6px">👑 [트루 엔딩] 소중한 사람들과 함께 만든 전설</h4>
        <div style="display:flex;justify-content:center;gap:6px;margin:8px 0">
          ${imgsHtml}
        </div>
        <p style="font-size:13px;line-height:1.6;color:#fbcfe8;margin:0">
          치열했던 소환사의 협곡에서 모든 트로피를 들어 올린 당신의 곁에는, 가장 힘든 순간부터 정상에 오르기까지 묵묵히 곁을 지켜준 ${loves80.map(k => `<b>${HEROINES[k].name}</b>`).join(', ')}이(가) 함께하고 있습니다.<br>
          그녀들의 진심 어린 응원과 사랑 속에서, 당신의 커리어는 프로게이머를 넘어 한 사람의 눈부신 인생으로 완성되었습니다.
        </p>
      </div>
    `;
  } else if (loves80.length === 1) {
    const rh = HEROINES[loves80[0]];
    romanceHtml = `
      <div style="margin-top:14px;padding:12px;background:#231733;border:1px solid #db2777;border-radius:12px;text-align:center">
        <h4 style="color:#f472b6;margin:0 0 6px">💍 [인연 웨딩 엔딩] ${rh.name}과의 영원한 약속</h4>
        <div style="width:100px;height:120px;border-radius:10px;overflow:hidden;margin:0 auto 8px">
          <img src="${rh.img}" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${rh.fallback}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${rh.fallback}';}else{this.onerror=null;this.src='icon-512.png';}" style="width:100%;height:100%;object-fit:cover;object-position:top">
        </div>
        <p style="font-size:13px;line-height:1.6;color:#fbcfe8;margin:0">
          은퇴 후, 당신의 곁에는 가장 빛나는 순간과 가장 힘들었던 순간을 함께해 준 <b>${rh.name}</b>이(가) 있습니다.<br>
          소환사의 협곡을 떠나, 이제 두 사람만의 행복하고 따뜻한 새로운 인생이 시작됩니다.
        </p>
      </div>
    `;
  }

  const html = `<div class="em">🎬</div><h3>${natural ? '은퇴' : '커리어 종료'}</h3>
    <div class="c" style="font-size:24px;font-weight:900;margin:6px 0">${grade}</div><p class="c">${desc}</p>
    <div class="kv"><span>선수</span><b>${P.name} (${POS[P.pos].n})</b></div>
    <div class="kv"><span>최종 종합 능력</span><b>${Math.round(ovr())}</b></div>

    <div class="kv"><span>공식 경기</span><b>${h.games}전 ${h.wins}승</b></div>
    <div class="kv"><span>POG</span><b>${h.mvp}회</b></div>
    <div class="kv"><span>월즈 진출</span><b>${h.worlds}회</b></div>
    <div class="kv"><span>팬</span><b>${num(P.fans)}</b></div>
    <div class="kv"><span>자산</span><b>${won(P.money)}원</b></div>
    ${h.titles.length ? '<h4 style="margin:10px 0 4px">🏆 우승 기록</h4>' + h.titles.map(t => `<div>· ${t}</div>`).join('') : ''}
    ${romanceHtml}`;

  const endChoices = [{ t: '새 커리어 시작', cls: 'gold' }];
  if (P.money >= 30000000 || h.titles.length > 0) {
    endChoices.unshift({ t: '👑 [2회차] 신생 구단 창단 (구단주 모드)', cls: 'blue' });
  }

  const ans = await ask(html, endChoices);
  if (ans && ans.t && ans.t.includes('구단주 모드')) {
    await startOwnerModeDraft();
    return;
  }
  store.del(SAVE); P = null; render();
}

    <div style="display:flex;flex-direction:column;gap:10px;margin:12px 0">
      ${rookies.map((r, i) => `

        </div>

  `;

  const picked = await ask(html, rookies.map((r, i) => ({ t: `🎯 ${r.n} 지명 (${r.type})`, cls: 'gold', idx: i })));
  const rookie = rookies[picked.idx || 0];

  store.del(SAVE);
  P = makePlayer(rookie.n, rookie.pos, rookie.s);
  P.money = inheritedCash;
  P.isOwnerMode = true;
  P.mentorName = oldName;
  P.hist.log.push(`[2회차 구단주 모드] 전설 ${oldName}의 신생 게임단 창단 및 ${rookie.n} 지명`);

  toast(`👑 [창단 완료] ${oldName} 구단주님의 새로운 신화가 시작됩니다!`);
  render();
}

function bar(label, v, color, max = 100, showMax = false) {
  return `<div class="bar"><div class="lab"><span>${label}</span><b>${Math.floor(v)}${showMax ? '/' + max : ''}</b></div>
    <div class="tr"><div class="fi" style="width:${clamp(v / max * 100, 0, 100)}%;background:${color}"></div></div></div>`;
}
function stageName() {
  if (P.stage === 'pro') return `🏟️ ${P.pro[P.teamId].name} <b>1군</b>`;
  if (P.stage === 'aca') return `🏫 ${P.aca[P.teamId].name} <b>(2군)</b>`;
  return '🎮 아마추어';
}
function nextSchedule() {
  const ph = phaseOf(P.week);
  const me = myTeam();
  if (!me) {
    if (P.rank.t >= 7) return ['📨', '마스터 이상! 프로팀 스카우트 연락을 기다리는 중...'];
    return ['🎯', `목표: <b>마스터</b> 달성 → 프로팀 스카우트 (현재 ${TIERS[P.rank.t]})`];
  }
  const lg = P.stage === 'pro' ? P.pro : P.aca;
  if (ph.t === 'reg') {
    const opps = lg.filter(t => t.id !== me.id);
    const opp = opps[(ph.r - 1 + P.year) % opps.length];
    return ['⚔️', `이번 주말: <b>vs ${opp.name}</b> (전력 ${opp.str})<br><small style="color:#9aa4b2">${ph.sp} ${ph.r}R · 우리 팀 전력 ${teamPow().toFixed(1)} · 현재 ${me.w}승 ${me.l}패</small>`];
  }
  if (ph.t === 'po') return ['🏟️', `이번 주말: <b>${ph.sp} 플레이오프</b>`];
  if (ph.t.startsWith('w')) return P.stage === 'pro' && P.worldsQ && P.worldsAlive ? ['🌍', '<b>월드 챔피언십</b> 진행 중!'] : ['📺', '월즈 기간 (관전 중)'];
  if (ph.t === 'con') return ['📝', '이번 주말: <b>스토브리그 계약</b>'];
  return ['🌴', `${ph.sp} - 다음 시즌 준비 기간`];
}
function recommend() {
  if (P.hp < 30) return 'rest';
  if (P.stress > 75) return 'date';
  if (P.stage === 'ama') return 'solo';
  if (P.syn < 2) return 'scrim';
  return null;
}
if (P) {
    if (!P.sns) P.sns = { posts: [], followers: 120 };
    if (!P.dms) P.dms = { unread: 0, list: [] };
  }

function renderBondsQuickBar() {
  if (!P || !P.bonds) return '';
  const currentTotalWeek = (P.year - 1) * 48 + P.week;
  const list = Object.keys(HEROINES).map(k => {
    const h = HEROINES[k];
    const b = P.bonds[k] || { unlocked: false, aff: 0, lv: 0 };
    if (!b.lastInteractWeek) b.lastInteractWeek = currentTotalWeek;
    
    const weeksPassed = currentTotalWeek - b.lastInteractWeek;
    const isNeglected = b.unlocked && weeksPassed >= 3;
    const pct = clamp(b.aff || 0, 0, 100);

    return `
      <div class="bonds-quick-item ${!b.unlocked ? 'locked' : ''} ${isNeglected ? 'neglected' : ''}" 
           data-bhid="${k}" title="${h.name} (${h.tag})">
        ${isNeglected ? `<span class="bonds-alert-badge">연락 필요</span>` : (b.lv >= 3 ? `<span class="bonds-alert-badge" style="background:#ec4899">💖Lv.${b.lv}</span>` : '')}
        <img src="${h.img}" class="bonds-quick-avatar" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${h.fallback}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${h.fallback}';}else{this.onerror=null;this.src='assets/jieun.jpg';}">
        <div class="bonds-quick-name">${h.name}</div>

        <div class="bonds-quick-gauge"><div class="bonds-quick-gauge-fill" style="width:${pct}%"></div></div>
      </div>

  }).join('');

  return `
    <div class="bonds-quick-card">

        <div class="bonds-quick-title">인연 목록</div>
        <div class="bonds-quick-sub">선택하여 대화</div>

function getChampMastery(id) {
  if (!P.champs) P.champs = {};
  return P.champs[id] || { lv: 1, pts: 0 };
}

function addChampMastery(id, pts = 100) {
  if (!P.champs) P.champs = {};
  if (!P.champs[id]) P.champs[id] = { lv: 1, pts: 0 };
  const cm = P.champs[id];
  cm.pts += pts;
  if (cm.pts >= cm.lv * 300 && cm.lv < 7) {
    cm.lv++;
    toast(`⭐ ${CHAMPIONS.find(c => c.id === id)?.n || id} 숙련도 Lv.${cm.lv} 달성!`);
  }
}

function updateStockMarket() {
  if (!P.stocks) P.stocks = {};
  for (const s of STOCKS) {

  }
}

async function showBanPickModal(opp) {
  const oppChamps = shuffle(CHAMPIONS).slice(0, 3);
  let bannedChamp = null;
  let myChamp = CHAMPIONS[0];

  const banBtns = oppChamps.map(c => ({
    t: `🚫 [밴] ${c.n} (${c.t})`,
    cls: 'red',
    champ: c
  }));

  // AI 자동 원클릭 밴픽 옵션
  banBtns.unshift({
    t: '⚡ [AI 자동 밴픽 & 즉시 출전] 추천 밴/픽으로 1클릭 시작',
    cls: 'gold',
    autoQuick: true
  });

  const banIdx = await ask(`
    <h3>⚔️ 경기 전 밴픽 전략 회의</h3>
    <p class="c" style="color:#9aa4b2">상대 <b>${opp.name}</b>의 주요 시그니처 카드 중 1개를 필밴하세요.</p>
  `, banBtns);

  if (banBtns[banIdx]?.autoQuick) {
    // 1클릭 원패스: 상대 최강 픽 밴 + 내 최고 숙련도 챔피언 자동 출전
    bannedChamp = oppChamps[0].id;
    const bestMyChamp = CHAMPIONS.filter(c => c.id !== bannedChamp).sort((a,b) => (getChampMastery(b.id).lv - getChampMastery(a.id).lv))[0] || CHAMPIONS[0];
    addChampMastery(bestMyChamp.id, 80);
    toast(`⚡ [AI 자동 밴픽] ${bestMyChamp.n} 픽 (숙련도 Lv.${getChampMastery(bestMyChamp.id).lv}) 출전!`);
    return { myChamp: bestMyChamp, bannedChamp, bonus: 8 };
  }
  bannedChamp = oppChamps[banIdx - 1]?.id || oppChamps[0].id;

  const pickBtns = CHAMPIONS.filter(c => c.id !== bannedChamp).map(c => {
    const cm = getChampMastery(c.id);
    return {
      t: `⭐ ${c.n} <small>Lv.${cm.lv}</small><br><small style="color:#93c5fd">${c.t}</small>`,
      cls: 'gold',
      champ: c
    };
  });

  const pickIdx = await ask(`
    <h3>🎯 나의 출전 챔피언 선택</h3>
    <p class="c" style="color:#9aa4b2">오늘 승부를 결정지을 나의 챔피언을 선택하세요.</p>
  `, pickBtns.slice(0, 6));

  myChamp = pickBtns[pickIdx]?.champ || CHAMPIONS[0];
  addChampMastery(myChamp.id, 150);
  P.currentChamp = myChamp;
  toast(`⚔️ ${myChamp.n} 픽 완료! (상대 ${CHAMPIONS.find(c => c.id === bannedChamp)?.n} 밴)`);
  return { myChamp, bannedChamp };
}

async function triggerClutchQTE() {
  playJackpotSound();
  const pos = P.pos || 'mid';
  const myRoleChamps = CHAMPIONS.filter(c => c.role === pos);
  const c = P.currentChamp || myRoleChamps[0] || CHAMPIONS[0];
  P.currentChamp = c; // 동기화 보장

  const qteData = CHAMP_QTE_TABLE[c.id] || {
    hero: c.n,
    opts: [
      { t: `🔥 ${c.n} [시그니처 필살기 작렬!] (피지컬 판정)`, desc: '최고의 집중력으로 한타를 지배합니다!', cls: 'red' },
      { t: `🎯 [적 핵심 딜러 기습 마크!] (판단 판정)`, desc: '냉철한 상황 판단으로 승기를 잡습니다.', cls: 'gold' },
      { t: `🛡️ [장로/바론 오브젝트 집중!] (운영 판정)`, desc: '팀플레이와 운영으로 이득을 확정 짓습니다.', cls: 'purple' }
    ],
    shout: `🎙️ 전용준: "${c.n}의 슈퍼플레이 작렬!! 협곡을 뒤집어놓습니다아아악!!"`,
    sub: `${c.n} 슈퍼플레이 캐리`
  };

  const qteIdx = await ask(`
    <div class="clutch-box">
      <div style="font-size:38px">⚡🚨</div>
      <h3 style="color:#fde047;margin:4px 0">승부처! 장로 드래곤 클러치 한타!</h3>
      <p style="color:#fecaca;font-size:13px;line-height:1.5;margin:6px 0">
        경기 시간 38분, 팽팽한 대치 상황! <b style="color:#fff">[${POS[pos]?.n || '프로'}]</b> <b>${c.n}</b>의 손끝에 경기의 운명이 걸렸습니다!
      </p>
      <div style="font-size:11px;color:#93c5fd">선택한 행동에 따라 경기 골드와 KDA가 즉시 변동됩니다.</div>
    </div>
  `, qteData.opts.map(opt => ({
    t: `${opt.t}<small style="display:block;font-size:11px;color:#cbd5e1;font-weight:400;margin-top:2px">${opt.desc}</small>`,
    cls: opt.cls
  })));

  const success = Math.random() < clamp(sig((ovr() - 50) / 4.5), 0.35, 0.90);
  if (success) {
    playJackpotSound();
    grow('mech', 2.0); grow('mental', 2.0);
    await ask(`
      <div style="text-align:center">
        <div style="font-size:52px">🔥👑</div>
        <h3 style="color:#4ade80">슈퍼플레이 작렬! ${qteData.sub}!</h3>
        <p class="c">${qteData.shout}</p>
        <p class="c" style="color:#cbd5e1;font-size:12px">해설진: "말도 안 되는 피지컬입니다! ${P.name} 선수가 혼자서 전장을 지배합니다!!"</p>
      </div>
    `, [{ t: '승리를 확정짓는다!', cls: 'gold' }]);
    return { adv: 2.5, kills: 2, assists: 1, success: true };
  } else {
    stressAdd(12);
    toast('상대의 거센 반격에 아쉽게 슈퍼플레이가 막혔습니다!');
    return { adv: -2.5, kills: 0, assists: 0, success: false };
  }
}

async function showWealthModal() {
  while (true) {
    if (!P.stocks) P.stocks = {};
    if (!P.properties) P.properties = [];

    let totalRent = P.properties.reduce((sum, id) => {
      const prop = REAL_ESTATE.find(r => r.id === id);
      return sum + (prop ? prop.rent : 0);
    }, 0);

    let body = `
      <div class="tab-row">
        <button class="${assetTab === 'stocks' ? 'act' : ''}" id="tabStk">📈 e스포츠 주식/코인</button>
        <button class="${assetTab === 'real' ? 'act' : ''}" id="tabReal">🏢 부동산 매입</button>
      </div>
      <div class="c" style="color:#9aa4b2;font-size:12.5px;margin-bottom:8px">
        보유 현금: 💰<b>${won(P.money)}원</b> · 매주 불로소득(월세): 💰<b>+${won(totalRent)}원</b>
      </div>
    `;

    let btns = [];

    if (assetTab === 'stocks') {
      const stockHtml = STOCKS.map(s => {
        const owned = P.stocks[s.id] || 0;
        const totalVal = owned * s.p;
        return `
          <div class="stock-row">
            <div>
              <b>${s.n}</b>
              <small style="color:#94a3b8;display:block">${s.d}</small>
              <span style="color:#ffd23f">현재가: ₩${num(s.p)}</span> · <span style="color:#a78bfa">보유: ${owned}주 (${won(totalVal)}원)</span>
            </div>
          </div>
        `;
      }).join('');

      body += stockHtml;
      STOCKS.forEach(s => {
        btns.push({ t: `💵 ${s.n} 10주 매수 (₩${num(s.p * 10)})`, sId: s.id, type: 'buy', cls: 'gold', disabled: P.money < s.p * 10 });
        btns.push({ t: `📤 ${s.n} 전량 매도`, sId: s.id, type: 'sell', cls: 'gray', disabled: !(P.stocks[s.id] > 0) });
      });
    } else {
      const propHtml = REAL_ESTATE.map(r => {
        const has = P.properties.includes(r.id);
        return `
          <div class="prop-card">
            <div>
              <b>${r.n}</b>
              <small style="color:#94a3b8;display:block">${r.d}</small>
              <span style="color:#4ade80">매주 월세: +₩${won(r.rent)}원</span>
            </div>
            <div>
              ${has ? '<span class="badge-pill bg-green">소유 중</span>' : `<span style="color:#ffd23f;font-weight:800;font-size:12px">₩${won(r.c)}원</span>`}
            </div>
          </div>
        `;
      }).join('');

      body += propHtml;
      REAL_ESTATE.filter(r => !P.properties.includes(r.id)).forEach(r => {
        btns.push({ t: `🏢 ${r.n} 매입 (₩${won(r.c)})`, pId: r.id, type: 'buyProp', cls: 'purple', disabled: P.money < r.c });
      });
    }

    btns.push({ t: '닫기', cls: 'gray', type: 'close' });

    const idx = await ask(`<h3>🏢 자산 관리 & 재테크 센터</h3>${body}`, btns);
    const sel = btns[idx];

    if (!sel || sel.type === 'close') break;

    if (sel.type === 'buy') {
      const s = STOCKS.find(x => x.id === sel.sId);
      const cost = s.p * 10;
      P.money -= cost;
      P.stocks[s.id] = (P.stocks[s.id] || 0) + 10;
      playCoinSound();
      toast(`📈 ${s.n} 10주 매수 완료!`);
    } else if (sel.type === 'sell') {
      const s = STOCKS.find(x => x.id === sel.sId);
      const owned = P.stocks[s.id] || 0;
      const gain = owned * s.p;
      P.money += gain;
      P.stocks[s.id] = 0;
      playCoinSound();
      toast(`📤 ${s.n} 전량 매도! +${won(gain)}원 입금`);
    } else if (sel.type === 'buyProp') {
      const pr = REAL_ESTATE.find(x => x.id === sel.pId);
      P.money -= pr.c;
      P.properties.push(pr.id);
      playJackpotSound();
      toast(`🏢 ${pr.n} 매입 완료! 이제 건물주입니다.`);
      checkAchievements();
    }
    save();
  }
}

      t: `${g.n} <small>+${g.aff}♥</small><br><b style="color:#ffd23f">💰${won(g.c)}원</b>`,

    stressAdd(-25);
    playCoinSound();
    await showHeroineCutscene(hid, `

    render();

  b.aff = Math.min(100, b.aff + dt.aff);
  b.lastInteractWeek = totalWeeks;

  await checkBondMilestone(hid);
  await triggerDatingJackpot(hid);
  save();
  render();
}

// 💔 히로인 장기 미접촉 시 서운함/투정 선톡 DM 자동 발송
function checkNeglectedHeroineDMs() {
  if (!P || !P.bonds) return;
  if (!P.dms) P.dms = { unread: 0, list: [] };
  const currentTotalWeek = (P.year - 1) * 48 + P.week;

  const neglectedList = Object.keys(HEROINES).filter(k => {
    const b = P.bonds[k];
    if (!b || !b.unlocked) return false;
    if (!b.lastInteractWeek) b.lastInteractWeek = currentTotalWeek;
    const diff = currentTotalWeek - b.lastInteractWeek;
    return diff >= 3; // 3주 이상 무관심 시
  });

  if (neglectedList.length === 0) return;
  // 50% 확률로 서운함 선톡 발송 (이미 읽지 않은 해당 DM이 있으면 스킵)
  if (Math.random() > 0.55) return;

  const targetId = pick(neglectedList);
  const h = HEROINES[targetId];
  const b = P.bonds[targetId];

  // 최근 DM 목록에 이미 해당 히로인의 서운함 메시지가 있으면 중복 발송 방지
  if (P.dms.list.slice(0, 3).some(m => m.sender === h.name && m.isNeglected)) return;

  const dialoguePool = {
    jieun: '"너 요즘 연습하느라 바쁜 건 아는데... 얼굴 본 지 너무 오래됐다. 오늘 연습 끝나고 잠깐 볼래?"',
    harin: '"야 넌 내 방송 보지도 않지? 요즘 통 연락도 없고 서운하다 진짜. 톡 보면 답장해라."',
    sora: '"바쁜 건 알지만 연락이 너무 없네요. 오늘 저녁에 시간 괜찮아요? 밥 사줄게요."',
    mina: '"후배님, 요즘 숙소에서 얼굴 보기 힘드네? 스트레스 많이 쌓였으면 나와, 커피 한잔 사줄게."',
    sea: '"한동안 연락이 없어서 걱정했어요. 시간 괜찮을 때 차 한잔해요."',
    chloe: '"요즘 경기 준비하느라 많이 바빠요? 오랜만에 커피 한잔 마셔요."',
    seolah: '"손목 상태 체크할 때 됐는데 안 오시네요. 무리하고 있는 건 아니죠? 시간 날 때 들러요."',
    rin: '"요즘 한국 서버 접속도 안 하고... 바빠요? 린 심심해요. 시간 날 때 톡 줘요."',
    camila: '"너 운동 안 나온 지 3주 넘었어! 스트레칭이라도 해야지. 오늘 저녁에 센터로 와."',
    yejin: '"서예진 변호사예요. 요즘 연락이 너무 뜸하네요. 저녁 식사나 한번 같이 해요."'
  };

  const defaultDialogue = `"요즘 대회 준비로 많이 바쁜가 봐... 그래도 너무 소식이 없으니까 서운하고 걱정돼. 답장 기다릴게!"`;
  const msg = dialoguePool[targetId] || defaultDialogue;

  const newDm = {
    id: 'dm_neglected_' + Date.now(),
    isNeglected: true,
    sender: h.name,
    badge: '연락 필요',
    tagCls: 'bg-red',
    avatar: h.img,
    fallback: h.fallback,
    msg: msg,
    choices: [
      {
        t: '"미안해, 오늘 밤에 만날래?"',
        gain: `💖 ${h.name} 호감도 +15♥ · 서운함 완전 해소`,
        act: p => {
          b.aff = Math.min(100, (b.aff || 0) + 15);

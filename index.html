async function worlds(t) {
  if (!(P.stage === 'pro' && P.worldsQ && P.worldsAlive)) return;
  const pool = intlTeams();
  if (t === 'wg') {
    P.hist.worlds++;
    await checkHeroineUnlocks();
    const grp = shuffle(pool).slice(0, 3);
    let w = 0;
    for (let i = 0; i < 3; i++) { const r = await playMatch(grp[i], `월즈 그룹 스테이지 ${i + 1}경기`, true); if (r.win) w++; }
    if (w >= 2) await ask(`<div class="em">✅</div><h3>그룹 스테이지 통과! (${w}승)</h3><p class="c">8강 진출!</p>`, [{ t: '8강으로', cls: 'gold' }]);

async function contracts() {
  const player = P;
  const o = ovr();
  if (P.stage === 'ama') return;
  const previousClub=careerClub();
  const avg = P.ratings.length ? P.ratings.reduce((a, b) => a + b, 0) / P.ratings.length : 6;
  const offers = [];
  if (P.stage === 'pro') {
    const cur = P.pro[P.teamId];
    if (avg >= 5 || o >= cur.starter) offers.push({ team: cur, renew: true });
    for (const t of shuffle(P.pro)) {
      if (t.id === cur.id || offers.length >= 3) continue;
      if (o >= t.starter - 2 && Math.random() < .55) offers.push({ team: t });
    }
    // 4년차 이상 & 오버롤 85+ 일 때 중국 LPL / 북미 LCS 100억 파격 이적 제안
    if (P.year >= 4 && o >= 85) {
      const isMega = o >= 92;
      const offerSal = isMega ? 10000000000 : 2500000000;
      offers.push({
        team: { id: 99, name: isMega ? '상하이 드래곤즈 (중국 LPL)' : '로스앤젤레스 레전드 (북미 LCS)', str: 87, starter: 84 },
        overseas: true,
        sal: offerSal,
        bonusDesc: isMega ? '💰 100억 슈퍼스타 계약 제안!' : '💰 25억 해외 진출 제안'
      });
    }
  } else {
    for (const t of shuffle(P.pro)) {
      if (offers.length >= 2) break;
      if (o >= t.starter - 3 && Math.random() < .6) offers.push({ team: t, pro: true });
    }
    offers.push({ team: P.aca[P.teamId], renew: true, aca: true });
  }
  if (!offers.length) {
    const t = P.aca[P.teamId];
    await ask(`<div class="em">📉</div><h3>재계약 불발</h3><p class="c">${P.pro[P.teamId].name}이 재계약을 하지 않았다.<br>${t.name}(2군)로 내려간다.</p>`);
    if (P !== player) return;
    P.stage = 'aca'; P.salary = 300000; P.contractBonus = null;
    await showCareerContractReaction(recordCareerContract(previousClub,'relegation'));return;
  }
  const html = `<div class="em">📝</div><h3>스토브리그 - 계약 제안</h3><p class="c" style="color:#9aa4b2">시즌 평균 평점 ${avg.toFixed(1)} · 종합 ${Math.round(o)}</p>`;
  const btns = offers.map(of => {
    const isPro = !of.aca;
    let sal = of.overseas ? Math.round(of.sal / YEAR_WEEKS) : isPro ? Math.round((800000 + Math.pow(Math.max(0, o - 50), 2) * 18000 + P.fans * 8) * (of.renew ? 1 : 1.1) * (1 + (of.team.str - 70) / 60) / 10000) * 10000 : 300000;
    if (P.bonds?.mina?.aff >= 50) sal = Math.round(sal * 1.2);
    of.sal = sal;
    const competition=isPro?Math.max(0,(of.team.starter || of.team.str)-o):Math.max(0,(P.pro[of.team.id]?.starter || 0)-1-o);
    return { t: `${of.renew ? '🔁 재계약' : '✉️ 이적'} ${of.team.name}${isPro ? '' : ' (2군)'}<br><small style="font-weight:500">팀 전력 ${of.team.str} · 기본 제시 ${won(sal * YEAR_WEEKS)}원/년<br>주급 ${num(sal)}원 · ${isPro?'주전 경쟁':'콜업'} 기준까지 ${competition>0?'OVR +'+competition.toFixed(1):'현재 기준 충족'}</small>`, cls: of.renew ? 'gray' : 'purple' };
  });
  const i = await ask(html, btns);
  if (P !== player) return;
  const of = offers[i];
  if (!of) return;

  const contractDraft = {};
  const finalSal = await negotiateSalary(of.team, of.sal, of.renew, contractDraft);
  if (finalSal == null) return;
  P.salary = finalSal;

  if (of.aca) { P.stage = 'aca'; }
  else {
    if (of.overseas) {
      // 기존 고정 규모 리그를 유지하면서 새 팀을 현재 슬롯에 연결한다.
      const slot = P.teamId;
      of.team = { ...P.pro[slot], ...of.team, id: slot };
      P.pro[slot] = of.team;
    }
    if (P.teamId !== of.team.id || P.stage !== 'pro') P.syn = 0;
    P.stage = 'pro'; P.teamId = of.team.id; P.hist.bestStage = 'pro';
    of.team.starter = Math.max(of.team.starter, o);
    if (!of.renew) P.hist.log.push(`${P.year}년차 ${of.team.name} 이적`);
  }
  commitSalaryContract(contractDraft, finalSal);
  toast('계약 완료!');
  await showCareerContractReaction(recordCareerContract(previousClub,of.renew?'renew':'transfer'));
}

async function scouting() {
  const player = P;
  if (P.scoutCD > 0) { P.scoutCD--; return; }
  const ph = phaseOf(P.week);
  if (ph.t === 'po' || ph.t.startsWith('w')) return;
  const o = ovr();
  const canScout = P.stage === 'ama' && (P.rank.t >= 7 || (P.rank.t >= 6 && (P.pcBangWins || 0) >= 1));
  if (canScout) {
    const direct = P.pro.filter(t => o >= t.starter - 1).sort((a, b) => b.str - a.str);
    if (P.rank.t >= 8 && direct.length && Math.random() < .45) {
      const t = direct[0];
      const i = await ask(`<div class="em">📨</div><h3>1군 직행 스카우트!</h3><p class="c"><b>${t.name}</b>(전력 ${t.str}) 감독에게서 연락이 왔다.<br>"솔랭 ${TIERS[P.rank.t]} 아이디 맞으시죠? 바로 주전으로 쓰고 싶습니다."</p>`,
        [{ t: '연봉 협상 및 입단!', cls: 'gold' }, { t: '좀 더 고민한다', cls: 'gray' }]);
      if (P !== player) return;
      if (i === 0) {
        const base = salaryFor(t);
        const contractDraft = {};
        const finalSal = await negotiateSalary(t, base, false, contractDraft);
        if (finalSal == null) return;
        P.stage = 'pro'; P.teamId = t.id; P.salary = finalSal; P.hist.bestStage = 'pro';
        commitSalaryContract(contractDraft, finalSal);
        t.starter = Math.max(t.starter, o);
        P.hist.log.push(`${P.year}년차 ${t.name} 1군 입단 (직행)`);
        await checkHeroineUnlocks();
        checkAchievements();
      } else P.scoutCD = 4;
      return;
    }
    if (Math.random() < .4) {
      const t = pick(P.aca);
      const i = await ask(`<div class="em">📨</div><h3>스카우트 제안</h3><p class="c"><b>${t.name}</b>(${P.pro[t.id].name} 2군)에서 입단 테스트 제안이 왔다!<br>"${TIERS[P.rank.t]} 찍으셨던데, 연습생으로 와보실래요?"</p>
        <p class="c" style="color:#9aa4b2">2군에서 활약하면 1군 콜업 기회!</p>`,
        [{ t: '입단한다', cls: 'gold' }, { t: '거절 (더 높은 곳을 노린다)', cls: 'gray' }]);
      if (P !== player) return;
      if (i === 0) {
        P.stage = 'aca'; P.teamId = t.id; P.salary = 300000; P.syn = 0; P.hist.bestStage = 'aca'; P.contractBonus = null;
        P.hist.log.push(`${P.year}년차 ${t.name} 입단 (연습생)`);
        await ask(`<div class="em">🎉</div><h3>프로 연습생이 되었다!</h3><p class="c">이제 매주 주말 KCL 챌린저스 경기에 출전합니다.<br>🤝 팀 스크림으로 팀 호흡을 맞추세요.</p>`);
        await checkHeroineUnlocks();
        checkAchievements();
      } else P.scoutCD = 3;
    }
  }
}

function renderCinematicEventHtml(opt) {
  const { bannerImg, tag, tagCls, title, desc, buffs } = opt;
  let { heroine } = opt;
  if (heroine) {
    const hid = Object.keys(HEROINES).find(k => HEROINES[k].name === heroine.name);
    if (hid && !canAdultRomance(hid)) heroine = { ...heroine, img: HEROINES[hid].img, dialogue: '함께 연습을 돌아보며 다음 목표를 응원합니다.', moodText: '응원', moodCls: 'mood-happy' };
  }
  let heroineHtml = '';
  if (heroine) {
    heroineHtml = `
      <div class="cine-heroine-row">
        <div class="cine-heroine-portrait-box ${heroine.moodCls || 'mood-shock'}">
          <img src="${heroine.img}" class="cine-heroine-img" onerror="this.src='assets/jieun.jpg'">
          <div class="cine-mood-badge">${heroine.moodText || '반응'}</div>
        </div>
        <div class="cine-dialogue-bubble">
          <div class="cine-dialogue-speaker">
            <span>${heroine.name}</span>
            <span style="font-size:10.5px;color:#94a3b8;font-weight:normal">${heroine.role || ''}</span>
          </div>
          <div class="cine-dialogue-text">"${heroine.dialogue}"</div>
        </div>
      </div>
    `;
  }

  const buffHtml = (buffs || []).map(b => `<span class="badge-pill ${b.cls}">${b.t}</span>`).join('');

  return `
    <div class="cine-event-card">
      <div class="cine-banner-wrap">
        <img src="${bannerImg}" class="cine-banner-img" onerror="this.src='event_paparazzi.jpg'">
        <div class="cine-banner-tag ${tagCls || 'gold'}">${tag}</div>
        <div class="cine-banner-title">${title}</div>
      </div>
      ${heroineHtml}
      <div class="cine-desc-text">${desc}</div>
      ${buffHtml ? `<div class="cine-buff-row">${buffHtml}</div>` : ''}
    </div>
  `;
}

}
function nextSchedule() {
  const ph = phaseOf(P.week);
  const me = myTeam();
  if (!me) {
    if (P.rank.t >= 7) return ['📨', '마스터 이상! 프로팀 스카우트 연락을 기다리는 중...'];
    return ['🎯', `목표: <b>마스터</b> 달성 → 프로팀 스카우트 (현재 ${TIERS[P.rank.t]})`];
  }
  const lg = P.stage === 'pro' ? P.pro : P.aca;
  if (ph.t === 'reg') {
    const opps = lg.filter(t => t.id !== me.id);
    const opp = opps[(ph.r - 1 + P.year) % opps.length];
    return ['⚔️', `이번 주말: <b>vs ${opp.name}</b> (전력 ${opp.str})<br><small style="color:#9aa4b2">${ph.sp} ${ph.r}R · 우리 팀 전력 ${teamPow().toFixed(1)} · 현재 ${me.w}승 ${me.l}패</small>`];
  }
  if (ph.t === 'po') return ['🏟️', `이번 주말: <b>${ph.sp} 플레이오프</b>`];
  if (ph.t.startsWith('w')) return P.stage === 'pro' && P.worldsQ && P.worldsAlive ? ['🌍', '<b>월드 챔피언십</b> 진행 중!'] : ['📺', '월즈 기간 (관전 중)'];
  if (ph.t === 'con') return ['📝', '이번 주말: <b>스토브리그 계약</b>'];
  return ['🌴', `${ph.sp} - 다음 시즌 준비 기간`];
}
function feasibleRecommendedDate(companion, affordable = true) {
  if ((P.weeklyDates || 0)>=1 || P.hp<8) return null;
  const unlocked=Object.keys(HEROINES).filter(hid=>P.bonds?.[hid]?.unlocked);
  unlocked.sort((a,b)=>Number(b===companion)-Number(a===companion) || (P.bonds[a].lastInteractWeek || 0)-(P.bonds[b].lastInteractWeek || 0));
  for (const hid of unlocked) {
    const date=getHeroineDates(hid).filter(d=>Number.isFinite(d.c) && d.c>=0 && (!affordable || d.c<=P.money)).sort((a,b)=>a.c-b.c)[0];
    if(date)return {hid,dateId:date.id || date.n,name:date.n,cost:date.c,stress:date.st};
  }
  return null;
}
function recommendationOpponent() {
  const phase=phaseOf(P.week),me=myTeam();
  if(!me || phase.t!=='reg')return null;
  const league=P.stage==='pro'?P.pro:P.aca,others=league.filter(t=>t.id!==me.id);
  const opp=others[(phase.r-1+P.year)%others.length];
  if(!opp)return null;
  const power=teamPow(),gap=opp.str-power;
  return {name:opp.name,str:opp.str,power,gap,threat:`${opp.name} 전력 ${opp.str} · 우리 팀 ${power.toFixed(1)} · ${gap>0?'상대가 '+gap.toFixed(1)+' 앞섭니다':gap<0?'우리 팀이 '+(-gap).toFixed(1)+' 앞섭니다':'전력이 같습니다'}`};
}
function recommendationPlan() {
  const s=validSeasonJourney(P.seasonJourney,P.year)?P.seasonJourney:null,opponent=recommendationOpponent();
  const result=(key,reason,date=null)=>({key,reason,date,opponent});
  if(P.hp<30)return result('rest','체력이 30 미만입니다. 주말 경기 전에 컨디션을 회복하세요.');
  const date=feasibleRecommendedDate(s?.companion);
  if(P.stress>75)return date?result('date',`스트레스가 높습니다. 가능한 ${HEROINES[date.hid].name} 인연 일정으로 회복하세요.`,date):result('rest','스트레스가 높습니다. 이번 주 데이트 횟수·체력·코스 비용을 고려해 휴식으로 회복하세요.');
  let contactDue=false,contactNote='';
  if(s?.focus==='balance'){
    const span=YEAR_WEEKS-s.startWeek+1,target=Math.max(1,Math.ceil(span/7)),elapsed=P.week-s.startWeek+1;
    // 마지막 소통은 비용 마련·휴식 뒤 다시 만날 수 있도록 두 주의 여유를 둔다.
    const due=P.week>=YEAR_WEEKS-2?target:Math.floor(elapsed*target/span),count=new Set(s.contactWeeks).size;
    contactDue=count<due && !s.contactWeeks.includes(P.week);
    if(contactDue && date)return result('date',`균형 목표 · 인연 소통 ${count}/${target}주. ${HEROINES[date.hid].name} 인연 일정을 챙기세요. 데이트·선물·DM 등 실제 소통한 서로 다른 주를 셉니다.`,date);
    if(contactDue && feasibleRecommendedDate(s.companion,false))return result('stream','균형 목표의 인연 소통이 남았습니다. 가능한 코스 비용을 마련하도록 이번 주는 개인 방송을 진행하세요.');
    if(contactDue)contactNote=' 인연 소통도 남아 있지만 이번 주 횟수·체력·비용에 맞는 데이트가 없어 가능한 준비를 먼저 합니다.';
  }
  const youth=s && YOUTH_ARCS[s.companion]?youthArcState(s.companion,false):null;
  if(youth?.step===1 && !youth.prepared && !(P.weeklyDates || 0))return result(youth.task,'동행과의 약속 · '+actionLabel(youth.task)+' 일정으로 '+YOUTH_ARCS[s.companion].subject+' 준비를 마칩니다. 다음 만남의 약속 이행 선택으로 이어집니다.');
  if(P.stage!=='ama' && P.syn<2)return result('scrim','팀 호흡이 2 미만입니다. 스크림은 한타·운영을 훈련하고 실제 팀 호흡을 높입니다.'+contactNote);
  const options = ['lane', 'mech', 'vod', 'pool'];
  const weights = POS[P.pos]?.w || POS.mid.w;
  const gains = { lane: { lane: 2.6, mech: 1 }, mech: { mech: 2.7 }, vod: { macro: 2.6, team: .9 }, pool: { pool: 3 } };
  let bestTraining = options.sort((a,b) => {
    const score = key => Object.entries(gains[key]).reduce((sum,[stat,value]) => sum + value * (weights[stat] || 0) / Math.max(20,P.s[stat]),0);
    return score(b)-score(a);
  })[0];
  const promise=s?.scenes.filter(x=>x.id==='summerStart' && P.week-x.week>=0 && P.week-x.week<3).at(-1);
  let promiseNote='';
  if(promise?.choice===0){bestTraining='vod';promiseNote=' 동행과 약속한 상대 분석을 경기 분석 일정으로 준비합니다.';}
  if(promise?.choice===1)promiseNote=' 동행에게 말한 장점 다듬기를 포지션별 성장 효율에 맞춰 이어갑니다.';
  const training=s?.weeks.filter(w=>SEASON_TRAINING.includes(w.action)).length || 0;
  const trainTarget=s?Math.max(1,Math.ceil((YEAR_WEEKS-s.startWeek+1)*(s.focus==='balance'?.25:.4))):0;
  if(s?.focus==='foundation' && training<trainTarget)return result(bestTraining,`기본기 목표 · 핵심 훈련 ${training}/${trainTarget}주. 포지션 성장 효율을 고려한 훈련입니다.`+promiseNote+contactNote);
  if(opponent?.gap>0 && P.syn<4)return result('scrim',`${opponent.name}의 전력이 앞섭니다. 스크림으로 한타·운영과 팀 호흡을 준비하세요.`+contactNote);
  if(s?.focus==='balance' && training<trainTarget)return result(bestTraining,`균형 목표 · 훈련 ${training}/${trainTarget}주를 채웁니다.`+promiseNote+contactNote);
  if(promiseNote)return result(bestTraining,promiseNote.trim()+contactNote);
  if(P.stage==='ama' && P.rank.t<7 && ovr()*condF()>=tierSkill()+2)return result('solo',(s?.focus==='challenge'?'도전 목표 · ':'')+'현재 티어보다 유효 경기력이 높습니다. 솔로랭크로 티어와 입단 기회를 노리세요.'+contactNote);
  return result(bestTraining,'현재 능력치와 포지션별 OVR 가중치에 맞춰 성장 효율이 높은 훈련을 고릅니다.'+contactNote);
}

}
function actionIcon(key) { return ({solo:'game',pcbang:'trophy',scrim:'users',lane:'target',mech:'bolt',vod:'book',pool:'shield',date:'heart',stream:'camera',rest:'moon',care:'coffee'})[key] || 'game'; }
function actionSummary(action) {
  const hp = action.k === 'date' ? -8 : action.hp;
  return `<span class="effect-chip" title="체력 변화">${uiIcon('heart',12)} ${hp > 0 ? '+' : ''}${hp}</span><span class="effect-chip" title="스트레스 변화">${uiIcon('bolt',12)} ${action.st > 0 ? '+' : ''}${action.st}</span>${action.cost ? `<span class="effect-chip">${uiIcon('wallet',12)} ${won(action.cost)}</span>` : action.k === 'date' ? '<span class="effect-chip">코스별 비용</span>' : ''}`;
}

function getChampMastery(id) {
  if (!P.champs) P.champs = {};
  return P.champs[id] || { lv: 1, pts: 0 };
}

function addChampMastery(id, pts = 100) {
  if (!P.champs) P.champs = {};
  if (!P.champs[id]) P.champs[id] = { lv: 1, pts: 0 };
  const cm = P.champs[id];
  cm.pts += pts;
  if (cm.pts >= cm.lv * 300 && cm.lv < 7) {
    cm.lv++;
    toast(`⭐ ${CHAMPIONS.find(c => c.id === id)?.n || id} 숙련도 Lv.${cm.lv} 달성!`);
  }
}

function updateStockMarket() {
  if (!P.stocks) P.stocks = {};
  for (const s of STOCKS) {
    const change = rnd(-s.vol, s.vol);
    s.p = Math.max(1000, Math.round(s.p * (1 + change)));
  }
}

async function showBanPickModal(opp) {
  const oppChamps = shuffle(CHAMPIONS).slice(0, 3);
  let bannedChamp = null;
  let myChamp = CHAMPIONS[0];

  const banBtns = oppChamps.map(c => ({
    t: `🚫 [밴] ${c.n} (${c.t})`,
    cls: 'red',
    champ: c
  }));

  // AI 자동 원클릭 밴픽 옵션
  banBtns.unshift({
    t: '⚡ [AI 자동 밴픽 & 즉시 출전] 추천 밴/픽으로 1클릭 시작',
    cls: 'gold',
    autoQuick: true
  });

  const banIdx = await ask(`
    <h3>⚔️ 경기 전 밴픽 전략 회의</h3>
    <p class="c" style="color:#9aa4b2">상대 <b>${opp.name}</b>의 주요 시그니처 카드 중 1개를 필밴하세요.</p>
  `, banBtns);

  if (banBtns[banIdx]?.autoQuick) {
    // 1클릭 원패스: 상대 최강 픽 밴 + 내 최고 숙련도 챔피언 자동 출전
    bannedChamp = oppChamps[0].id;
    const bestMyChamp = CHAMPIONS.filter(c => c.id !== bannedChamp).sort((a,b) => (getChampMastery(b.id).lv - getChampMastery(a.id).lv))[0] || CHAMPIONS[0];
    addChampMastery(bestMyChamp.id, 80);
    toast(`⚡ [AI 자동 밴픽] ${bestMyChamp.n} 픽 (숙련도 Lv.${getChampMastery(bestMyChamp.id).lv}) 출전!`);
    return { myChamp: bestMyChamp, bannedChamp, bonus: 8 };
  }
  bannedChamp = oppChamps[banIdx - 1]?.id || oppChamps[0].id;

  const pickBtns = CHAMPIONS.filter(c => c.id !== bannedChamp).map(c => {
    const cm = getChampMastery(c.id);
    return {
      t: `⭐ ${c.n} <small>Lv.${cm.lv}</small><br><small style="color:#93c5fd">${c.t}</small>`,
      cls: 'gold',
      champ: c
    };
  });

  const pickIdx = await ask(`
    <h3>🎯 나의 출전 챔피언 선택</h3>
    <p class="c" style="color:#9aa4b2">오늘 승부를 결정지을 나의 챔피언을 선택하세요.</p>
  `, pickBtns.slice(0, 6));

  myChamp = pickBtns[pickIdx]?.champ || CHAMPIONS[0];
  addChampMastery(myChamp.id, 150);
  P.currentChamp = myChamp;
  toast(`⚔️ ${myChamp.n} 픽 완료! (상대 ${CHAMPIONS.find(c => c.id === bannedChamp)?.n} 밴)`);
  return { myChamp, bannedChamp };
}

  const myRoleChamps = CHAMPIONS.filter(c => c.role === pos);
  const c = P.currentChamp || myRoleChamps[0] || CHAMPIONS[0];
  P.currentChamp = c; // 동기화 보장

  const qteData = CHAMP_QTE_TABLE[c.id] || {
    hero: c.n,
    opts: [
      { t: `🔥 ${c.n} [시그니처 필살기 작렬!] (피지컬 판정)`, desc: '최고의 집중력으로 한타를 지배합니다!', cls: 'red' },
      { t: `🎯 [적 핵심 딜러 기습 마크!] (판단 판정)`, desc: '냉철한 상황 판단으로 승기를 잡습니다.', cls: 'gold' },
      { t: `🛡️ [장로/바론 오브젝트 집중!] (운영 판정)`, desc: '팀플레이와 운영으로 이득을 확정 짓습니다.', cls: 'purple' }

    shout: `🎙️ 전용준: "${c.n}의 슈퍼플레이 작렬!! 협곡을 뒤집어놓습니다아아악!!"`,
    sub: `${c.n} 슈퍼플레이 캐리`
  };

  const qteIdx = await ask(`
    <div class="clutch-box">
      <div style="font-size:38px">⚡🚨</div>
      <h3 style="color:#fde047;margin:4px 0">승부처! 장로 드래곤 클러치 한타!</h3>
      <p style="color:#fecaca;font-size:13px;line-height:1.5;margin:6px 0">

      </p>
      <div style="font-size:11px;color:#93c5fd">선택한 행동에 따라 경기 골드와 KDA가 즉시 변동됩니다.</div>
    </div>
  `, qteData.opts.map(opt => ({
    t: `${opt.t}<small style="display:block;font-size:11px;color:#cbd5e1;font-weight:400;margin-top:2px">${opt.desc}</small>`,
    cls: opt.cls
  })));

  const success = Math.random() < clamp(sig((ovr() - 50) / 4.5), 0.35, 0.90);
  if (success) {
    playJackpotSound();
    grow('mech', 2.0); grow('mental', 2.0);
    await ask(`
      <div style="text-align:center">
        <div style="font-size:52px">🔥👑</div>
        <h3 style="color:#4ade80">슈퍼플레이 작렬! ${qteData.sub}!</h3>
        <p class="c">${qteData.shout}</p>
        <p class="c" style="color:#cbd5e1;font-size:12px">해설진: "말도 안 되는 피지컬입니다! ${P.name} 선수가 혼자서 전장을 지배합니다!!"</p>
      </div>
    `, [{ t: '승리를 확정짓는다!', cls: 'gold' }]);
    return { adv: 2.5, kills: 2, assists: 1, success: true };
  } else {
    stressAdd(12);
    toast('상대의 거센 반격에 아쉽게 슈퍼플레이가 막혔습니다!');
    return { adv: -2.5, kills: 0, assists: 0, success: false };
  }

async function showWealthModal() {
  while (true) {
    if (!P.stocks) P.stocks = {};
    if (!P.properties) P.properties = [];

    let totalRent = P.properties.reduce((sum, id) => {
      const prop = REAL_ESTATE.find(r => r.id === id);
      return sum + (prop ? prop.rent : 0);
    }, 0);

    let body = `
      <div class="tab-row">
        <button class="${assetTab === 'stocks' ? 'act' : ''}" id="tabStk">📈 e스포츠 주식/코인</button>
        <button class="${assetTab === 'real' ? 'act' : ''}" id="tabReal">🏢 임대 부동산</button>
        <button class="${assetTab === 'life' ? 'act' : ''}" id="tabLife">거주·차량·팬클럽</button>
      </div>
      <div class="c" style="color:#9aa4b2;font-size:12.5px;margin-bottom:8px">
        보유 현금: 💰<b>${won(P.money)}원</b> · 매주 불로소득(월세): 💰<b>+${won(totalRent)}원</b>
      </div>
    `;

    let btns = [];

    if (assetTab === 'stocks') {
      const stockHtml = STOCKS.map(s => {
        const owned = P.stocks[s.id] || 0;
        const totalVal = owned * s.p;
        return `
          <div class="stock-row">
            <div>
              <b>${s.n}</b>
              <small style="color:#94a3b8;display:block">${s.d}</small>
              <span style="color:#ffd23f">현재가: ₩${num(s.p)}</span> · <span style="color:#a78bfa">보유: ${owned}주 (${won(totalVal)}원)</span>
            </div>
          </div>
        `;
      }).join('');

      body += `<details class="catalog-details"><summary>${uiIcon('chart',16)} 시세·보유 내역 <small>${STOCKS.length}종</small></summary>${stockHtml}</details>`;
      STOCKS.forEach(s => {
        btns.push({ t: `💵 ${s.n} 10주 매수 (₩${num(s.p * 10)})`, sId: s.id, type: 'buy', cls: 'gold', disabled: P.money < s.p * 10 });
        btns.push({ t: `📤 ${s.n} 전량 매도`, sId: s.id, type: 'sell', cls: 'gray', disabled: !(P.stocks[s.id] > 0) });
      });
    } else if (assetTab === 'real') {
      const propHtml = REAL_ESTATE.map(r => {
        const has = P.properties.includes(r.id);
        return `
          <div class="prop-card">
            <div>
              <b>${r.n}</b>
              <small style="color:#94a3b8;display:block">${r.d}</small>
              <span style="color:#4ade80">매주 월세: +₩${won(r.rent)}원</span>
            </div>
            <div>
              ${has ? '<span class="badge-pill bg-green">소유 중</span>' : `<span style="color:#ffd23f;font-weight:800;font-size:12px">₩${won(r.c)}원</span>`}
            </div>
          </div>
        `;
      }).join('');

      body += `<details class="catalog-details"><summary>${uiIcon('bag',16)} 임대 수익·보유 내역</summary>${propHtml}</details>`;
      REAL_ESTATE.filter(r => !P.properties.includes(r.id)).forEach(r => {
        btns.push({ t: `🏢 ${r.n} 매입 (₩${won(r.c)})`, pId: r.id, type: 'buyProp', cls: 'purple', disabled: P.money < r.c });
      });
    } else {
      body += '<p class="c">거주는 컨디션 회복, 임대 부동산은 주간 수익을 제공합니다. 구매한 거주지와 차량은 다시 비용 없이 선택할 수 있습니다.</p>';
      for (const [type, catalog, owned, selected] of [
        ['house', HOUSES, P.houses || {}, P.house], ['car', VEHICLES, P.cars || {}, P.car]
      ]) {
        for (const item of Object.values(catalog)) {
          body += `<div class="prop-card"><b>${item.n}</b><small>${item.d}</small></div>`;
          btns.push({ t: `${selected === item.k ? '사용 중' : owned[item.k] ? '선택' : '구매'} · ${item.n} · ${won(owned[item.k] ? 0 : item.c)}원`, type, item, disabled: selected === item.k || (!owned[item.k] && P.money < item.c) });
        }
      }
      btns.push({ t: '공식 팬클럽 창단 · 1,000만 원 (팬 3,000명 필요)', type: 'fanclub', disabled: !!P.fanclub?.founded || P.fans < 3000 || P.money < 10000000 });
      if (P.isOwnerMode) {
        body += '<p>구단주 후원 회차: 매주 후원 예산 50만 원. 코칭 레벨당 운영비 20만 원과 함께 유망주를 추가 훈련합니다.</p>';
        btns.push({ t: `코칭 강화 Lv.${P.owner?.coachLevel || 0} → ${(P.owner?.coachLevel || 0) + 1} · ${won(((P.owner?.coachLevel || 0) + 1) * 1000000)}원`, type: 'coach', disabled: P.money < ((P.owner?.coachLevel || 0) + 1) * 1000000 || (P.owner?.coachLevel || 0) >= 3 });
      }
    }

    btns.push({ t: '닫기', cls: 'gray', type: 'close' });

    const idx = await askWithTabs(`<h3>🏢 자산 관리 & 재테크 센터</h3>${body}`, btns, { tabStk: 'stocks', tabReal: 'real', tabLife: 'life' });
    if (idx?.tab) { assetTab = idx.tab; continue; }
    const sel = btns[idx];

    if (!sel || sel.type === 'close') break;

    if (sel.disabled) continue;
    if (sel.type === 'house' || sel.type === 'car') {
      const field = sel.type === 'house' ? 'houses' : 'cars';
      P[field] ||= {};
      if (!P[field][sel.item.k]) { if (P.money < sel.item.c) continue; P.money -= sel.item.c; P[field][sel.item.k] = 1; }
      P[sel.type] = sel.item.k;
    } else if (sel.type === 'fanclub') {
      if (!P.fanclub?.founded && P.money >= 10000000 && P.fans >= 3000) { P.money -= 10000000; P.fanclub = { ...P.fanclub, founded: true, level: 1 }; }
    } else if (sel.type === 'coach') {
      P.owner ||= { coachLevel: 0 };
      const cost = (P.owner.coachLevel + 1) * 1000000;
      if (P.money >= cost && P.owner.coachLevel < 3) { P.money -= cost; P.owner.coachLevel++; }
    } else if (sel.type === 'buy') {
      const s = STOCKS.find(x => x.id === sel.sId);
      const cost = s.p * 10;
      P.money -= cost;
      P.stocks[s.id] = (P.stocks[s.id] || 0) + 10;
      playCoinSound();
      toast(`📈 ${s.n} 10주 매수 완료!`);
    } else if (sel.type === 'sell') {
      const s = STOCKS.find(x => x.id === sel.sId);
      const owned = P.stocks[s.id] || 0;
      const gain = owned * s.p;
      P.money += gain;
      P.stocks[s.id] = 0;
      playCoinSound();
      toast(`📤 ${s.n} 전량 매도! +${won(gain)}원 입금`);
    } else if (sel.type === 'buyProp') {
      const pr = REAL_ESTATE.find(x => x.id === sel.pId);
      P.money -= pr.c;
      P.properties.push(pr.id);
      playJackpotSound();
      toast(`🏢 ${pr.n} 매입 완료! 이제 건물주입니다.`);
      checkAchievements();
    }
    save();
  }
}

// 💖 메인 화면에서 히로인 터치 시 즉시 1:1 만남 메뉴
async function openHeroineDirectMenu(hid) {
  const h = HEROINES[hid], b = P.bonds?.[hid];
  if (!h || !b?.unlocked) return false;
  const dates = getHeroineDates(hid);
  const choices = dates.map(d => ({ t: d.n + ' · ' + won(d.c) + '원 · 체력 -8', cls: 'pink',
    disabled: (P.weeklyDates || 0) >= 1 || P.money < d.c || P.hp < 8 }));
  choices.push({ t: '맞춤 선물하기 (인물별 주 1회)', cls: 'gold', disabled: !!weeklyState().gifts[hid] });
  choices.push({ t: '함께한 선택 기억', cls: 'gray' });
  choices.push({ t: '닫기', cls: 'gray' });
  const index = await showHeroineCutscene(hid, '<h4>인연 일정</h4><div class="c">주간 데이트 ' + (P.weeklyDates || 0) + '/1 · 호감도 ' + b.aff + '/100</div>', choices);
  if (index < 0 || index >= choices.length - 1) return false;
  if (index < dates.length) return performHeroineDate(hid, dates[index].id || dates[index].n);
  if (index===dates.length+1) { await showCareerBondMemory(hid);return false; }
  // 선물 상점의 기회비용과 취소를 보존하고 보상은 인물별 주1회로 제한한다.
  if (weeklyState().gifts[hid]) return false;
  const gi = await showHeroineCutscene(hid, '<h4>선물 고르기</h4>', h.gifts.map(g => ({ t: g.n + ' · ' + won(g.c) + '원', cls: 'gold', disabled: P.money < g.c })).concat({ t: '취소', cls: 'gray' }));
  const gift = h.gifts[gi];
  if (!gift || P.money < gift.c || weeklyState().gifts[hid]) return false;
  weeklyState().gifts[hid] = true; P.money -= gift.c;
  recordSeasonContact(hid);
  affectionGain(hid, gift.aff); stressAdd(-25); playCoinSound();
  await showHeroineCutscene(hid, '<h4>선물 전달</h4><div class="vn-dialogue">' + gift.msg + '</div>');
  await checkBondMilestone(hid); checkAchievements(); save(); render();
  return true;
}

function checkWeeklyDM() {
  if (!P.dms) P.dms = { unread: 0, list: [] };
  if (!P.sns) P.sns = { posts: [], followers: 120 };

  // 읽지 않은 DM이 2개 이상이면 추가 발송 대기
  if (P.dms.unread >= 2) return;

  // 40% 확률로 새 DM 수신
  if (Math.random() > 0.40) return;

  const validTemplates = DM_TEMPLATES.filter(t => {
    if (!t.req(P)) return false;
    // 최근 3개 안에 같은 템플릿이 없으면 가능
    return !P.dms.list.slice(0, 3).some(m => m.templateId === t.id);
  });

  if (validTemplates.length === 0) return;
  const picked = pick(validTemplates);

  const newDm = {
    id: 'dm_' + Date.now(),
    templateId: picked.id,
    sender: picked.sender,
    badge: picked.badge,
    tagCls: picked.tagCls,
    avatar: picked.avatar,
    fallback: picked.fallback,
    msg: picked.msg,
    choices: picked.choices,
    read: false,
    time: `${P.year}년차 ${P.week}주차`
  };

  P.dms.list.unshift(newDm);
  P.dms.unread = (P.dms.unread || 0) + 1;
  toast(`[새 메시지] ${picked.sender}님으로부터 메시지가 도착했습니다!`);
}

function syncHeroineAges() {
  if (!P) return;
  for (const [key, h] of Object.entries(HEROINES)) {
    h.age = getHeroineAge(key);
    h.dates = JSON.parse(JSON.stringify(HEROINE_ORIGINALS[key].dates));
    if (canAdultRomance(key) && (key === 'jieun' || key === 'harin')) updateHeroineAdultContent(key);
    if (!canAdultRomance(key)) h.dates = h.dates.map(d => safeHeroineDate(key, d));
  }
}

  // 인지도만으로 공식전/우승 댓글이 나타나지 않도록 실제 커리어를 확인한다.
  if (P.stage === 'ama' || !P.hist.wins) commentsPool = [{ u: 'training_friend', t: '꾸준히 연습하는 모습 응원합니다.' }, { u: 'local_fan', t: '다음 목표도 파이팅!' }];
  const abilityScore = clamp(0.5 + ovr() / 100, 0.5, 1.8);
  const fanBonus = Math.round(fans * 0.05);
  
  const rawLikes = Math.round((rint(baseLikesMin, baseLikesMax) + fanBonus) * abilityScore * bonusMult);
  const likes = Math.max(3, Math.round(rawLikes * (1 + (VEHICLES[P.car]?.fanBonus || 0) / 100)));
  
  const rawFollowers = Math.round((rint(followerGainMin, followerGainMax) + Math.round(fans * 0.003)) * bonusMult);
  const followerGain = Math.max(1, rawFollowers);

  const shuffled = commentsPool.sort(() => 0.5 - Math.random());
  const comments = shuffled.slice(0, rint(2, 3));

  return { likes, followerGain, comments };
}

function postToInsta(title, img, caption, comments = []) {
  if (!P.sns) P.sns = { posts: [], followers: 35 };
  syncHeroineAges();
  
  const weekly = weeklyState();
  const rewarded = !weekly.postRewarded;
  weekly.postRewarded = true;
  P.sns.nextId = (P.sns.nextId || 0) + 1;
  const id = 'post_' + Date.now() + '_' + P.sns.nextId;
  const metrics = calculateInstaMetrics();
  const finalLikes = metrics.likes;
  const finalFollowers = metrics.followerGain;
  const finalComments = comments.length > 0 ? comments : metrics.comments;

  P.sns.posts.unshift({
    id,
    title,
    img: img || 'assets/jieun_cafe.jpg',
    caption,
    likes: finalLikes,
    comments: finalComments,
    time: `${P.year}년차 ${P.week}주차`
  });

  if (rewarded) {
    P.sns.followers = (P.sns.followers || 35) + finalFollowers;
    P.fans = (P.fans || 0) + Math.round(finalFollowers * 0.85);
  }
  // 이미 저장된 게시물은 삭제하거나 잘라내지 않는다.
  save();

  playJackpotSound();
  toast(`📸 GamerGram 피드 게시 완료! (❤️ 좋아요 ${num(finalLikes)}개 / 새 팔로워 +${num(rewarded ? finalFollowers : 0)}명)`);
}

}

    const heroineId = template?.category === 'heroine' ? Object.keys(HEROINES).find(k => dm.templateId.includes('_' + k + '_')) : dm.isNeglected ? Object.keys(HEROINES).find(k => HEROINES[k].name === dm.sender) : null;

    const beforeAff = Object.fromEntries(Object.entries(P.bonds).map(([k,b]) => [k,b.aff || 0]));
    // JSON에는 함수를 저장할 수 없으므로 템플릿 식별자로 실행 시 다시 연결한다.
    const action = DM_TEMPLATES.find(t => t.id === dm.templateId)?.choices[indexChosen]?.act || choice.act;
    if (typeof action === 'function') { const before = P.money; dm.claimed = true; action(P); if (P.perk === 'fame' && DM_TEMPLATES.find(t => t.id === dm.templateId)?.category === 'sponsor') P.money = before + Math.round((P.money - before) * 1.5); }
    else if (dm.isNeglected) {
      const hid = Object.keys(HEROINES).find(k => HEROINES[k].name === dm.sender);
      if (hid && !weeklyState().dm[hid]) {
        weeklyState().dm[hid] = true; P.bonds[hid].aff = Math.min(100, (P.bonds[hid].aff || 0) + (indexChosen === 0 ? 15 : 8)); stressAdd(-15); dm.claimed = true;
      }
    }
    if (dm.claimed) {
      if (heroineId) { weeklyState().dm[heroineId] = true; P.bonds[heroineId].lastInteractWeek = careerWeek(); }
      for (const [hid, bond] of Object.entries(P.bonds)) {
        const delta = (bond.aff || 0) - (beforeAff[hid] || 0);
        if (delta > 0) { bond.aff = beforeAff[hid]; affectionGain(hid, delta); await checkBondMilestone(hid); }
      }
      if (heroineId) await checkBondMilestone(heroineId);
    }
  }
  dm.read = true;
  P.dms.unread = P.dms.list.filter(d => !d.read).length;
  checkAchievements(); save();
}

      const bDm = $('#mBody #bSendNewDm');

            post.likedByPlayer = true;
            post.likes += 1;
            playJackpotSound();
            toast(`❤️ [좋아요] 회원님이 이 게시물을 좋아합니다!`);
            res('re-render');
          }
        };
      });

      // 댓글 달기 버튼
      $$('#mBody [data-replyid]').forEach(b => {
        b.onclick = async () => {
          const pid = b.dataset.replyid;
          const inputEl = $(`#mBody input[data-inputid="${pid}"]`);
          const customReply = inputEl?.value?.trim();
          if (customReply) {
            const post = P.sns.posts.find(p => p.id === pid);
            if (post) {
              if (!post.comments) post.comments = [];
              post.comments.push({ u: (P.name || 'player').toLowerCase() + '_pro', t: customReply });
              if (!weeklyState().replyRewarded) {
                weeklyState().replyRewarded = true;
                weeklyState().replies[pid] = true;
                P.fans = (P.fans || 0) + rint(10, 50);
              }
              save();
              toast(`💬 댓글 등록 완료! (팬들과의 소통으로 팬덤 증가)`);
              res('re-render');
            }
          } else {
            await handleReplyToComments(pid);
            res('re-render');
          }
        };
      });

      $$('#mBody .insta-dm-item').forEach(el => {
        el.onclick = async () => {
          const idx = parseInt(el.dataset.dmidx, 10);
          await openDmChat(idx);
          res('re-render');
        };
      });

      renderButtons(btns, res);
    });

    if (choiceIdx === 'create') {
      await openCreatePostModal();
    } else if (choiceIdx === 'pick_gallery') {
      await openPickGalleryModal();
    } else if (choiceIdx === 'send_dm') {
      await openSendDmModal();
    } else if (choiceIdx === 'close' || choiceIdx === 0 || choiceIdx === -1) {
      break;
    }
  }
}

const TEAM_COMPS = {
  dive: { name: '🔥 돌진·이니시 조합 (Dive)', desc: '한타 개시력 +18% · 킬 캐치', champs: ['vi', 'nautilus', 'kaisa', 'sylas', 'aatrox'] },
  wombo: { name: '🛡️ 밸런스 한타 조합 (Wombo)', desc: '후반 30분 한타 승률 +22%', champs: ['orianna', 'azir', 'ksante', 'jinx', 'thresh'] },
  poke: { name: '⚡ 포킹·암살 조합 (Poke & Pick)', desc: '초반 라인전 주도권 +18%', champs: ['zed', 'leblanc', 'zeri', 'leesin', 'yasuo'] }
};

function getChampIcon(c) {
  return `assets/champs/${c.id}.png`;
}

function analyzeCompSynergy(champList) {
  const ids = champList.map(c => c.id);
  for (const [k, comp] of Object.entries(TEAM_COMPS)) {
    const matchCount = ids.filter(id => comp.champs.includes(id)).length;
    if (matchCount >= 2) {
      return { key: k, ...comp, count: matchCount };
    }
  }
  return { key: 'standard', name: '⚖️ 스탠다드 밸런스 조합', desc: '모든 국면 안정적인 경기력', count: 1 };
}

async function showLckChampionSelectModal(opp) {
  const myPos = P.pos || 'mid';
  const posOrder = ['top', 'jg', 'mid', 'adc', 'sup'];

  // 상대팀 5인 픽 생성
  const oppRoster = {};
  posOrder.forEach(p => {
    const cand = CHAMPIONS.filter(c => c.role === p);
    oppRoster[p] = cand.length > 0 ? pick(cand) : pick(CHAMPIONS);
  });

  // 우리팀 4인 픽 생성 (내 포지션 제외)
  const myTeamRoster = {};
  posOrder.forEach(p => {
    if (p !== myPos) {
      const cand = CHAMPIONS.filter(c => c.role === p && c.id !== oppRoster[p]?.id);
      myTeamRoster[p] = cand.length > 0 ? pick(cand) : pick(CHAMPIONS);
    }
  });

  const oppLaner = oppRoster[myPos] || CHAMPIONS[0];

  // 추천 기본 픽
  const myCandidates = CHAMPIONS.filter(c => c.role === myPos);
  let selectedChamp = myCandidates.sort((a,b) => getChampMastery(b.id).lv - getChampMastery(a.id).lv)[0] || CHAMPIONS[0];

  while (true) {
    const fullMyTeam = Object.values(myTeamRoster).concat([selectedChamp]);
    const synergy = analyzeCompSynergy(fullMyTeam);
    const isCounter = (selectedChamp.strongVs || []).includes(oppLaner.id);

    const draftHtml = `
      <h3>⚔️ LCK 공식 밴픽 &amp; 챔피언 선택</h3>
      <div class="c" style="color:#9aa4b2;font-size:12px;margin-bottom:8px">
        상대: <b>${opp.name}</b> (전력 ${opp.str}) vs 우리 팀 (전력 ${Math.round(teamPow())})
      </div>

      <!-- 양 팀 픽 현황 -->
      <div class="draft-teams">
        <div class="draft-team-col my-col">
          <div style="font-weight:900;font-size:12px;color:#60a5fa;margin-bottom:6px">🔵 우리 팀 조합</div>
          ${posOrder.map(p => {
            const isMe = p === myPos;
            const c = isMe ? selectedChamp : myTeamRoster[p];
            return `
              <div class="draft-slot ${isMe ? 'my-slot' : ''}">
                <span class="pos-tag">${p.toUpperCase()}</span>
                <img src="${getChampIcon(c)}" onerror="this.src='champs/${c.id}.png'">
                <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <b>${c.n}</b> ${isMe ? '<span style="color:#fde047;font-size:10px">[MY]</span>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="draft-team-col opp-col">
          <div style="font-weight:900;font-size:12px;color:#f87171;margin-bottom:6px">🔴 ${opp.name}</div>
          ${posOrder.map(p => {
            const c = oppRoster[p];
            const isOppLaner = p === myPos;
            return `
              <div class="draft-slot ${isOppLaner ? 'opp-target' : ''}">
                <span class="pos-tag">${p.toUpperCase()}</span>
                <img src="${getChampIcon(c)}" onerror="this.src='champs/${c.id}.png'">
                <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <b>${c.n}</b> ${isOppLaner ? '<span style="color:#fca5a5;font-size:10px">[맞라이너]</span>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- 상성 & 시너지 분석 박스 -->
      <div style="background:#11182c;border:1px solid #28375c;border-radius:10px;padding:9px 12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
          <span>맞라인 상성:</span>
          <b>${isCounter ? `<span style="color:#4ade80">🎯 카운터 우세! (${selectedChamp.n} > ${oppLaner.n} 라인전 +15%)</span>` : `<span style="color:#cbd5e1">⚖️ 팽팽한 호각세</span>`}</b>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px">
          <span>팀 시너지:</span>
          <b style="color:#fde047">${synergy.name} <small style="color:#94a3b8">(${synergy.desc})</small></b>
        </div>
      </div>

      <!-- 챔피언 선택 그리드 -->
      <div style="font-size:12px;font-weight:800;color:#cbd5e1;margin-bottom:4px">내 챔피언 선택 (Riot Data Dragon 연동):</div>
      <div class="champ-pick-grid">
        ${myCandidates.map(c => {
          const isSel = c.id === selectedChamp.id;
          const cm = getChampMastery(c.id);
          const counterAdv = (c.strongVs || []).includes(oppLaner.id);
          return `
            <div class="champ-pick-card ${isSel ? 'sel' : ''}" data-cid="${c.id}">
              <img src="${getChampIcon(c)}" onerror="this.src='champs/${c.id}.png'">

            </div>

        }).join('')}

    const choiceIdx = await new Promise(res => {
      // 주간 경기의 밴픽을 닫으면 추천 픽으로 이어가 비동기 진행이 멈추지 않는다.
      currentAskResolve = () => res({ type: 'auto' });
      $('#mBody').innerHTML = draftHtml;

      $('#mBody').querySelectorAll('[data-cid]').forEach(card => {
        card.onclick = () => {
          const cObj = CHAMPIONS.find(x => x.id === card.dataset.cid);
          if (cObj) {
            selectedChamp = cObj;
            res({ type: 'reselect' });
          }
        };
      });

      const f = $('#mBtns'); f.innerHTML = '';
      const btns = [
        { t: `✨ [${selectedChamp.n}] 출전 확정!`, cls: 'gold', type: 'confirm' },
        { t: '⚡ [AI 최적 추천 픽으로 즉시 출전]', cls: 'purple', type: 'auto' }
      ];
      btns.forEach((b, i) => {
        const e = document.createElement('button');
        e.className = 'btn ' + (b.cls || '');
        e.innerHTML = b.t;
        e.onclick = () => { $('#modal').classList.add('hidden'); res(b); };
        f.appendChild(e);
      });
      $('#modal').classList.remove('hidden');
    });

    if (choiceIdx.type === 'reselect') continue;

    if (choiceIdx.type === 'auto') {
      // 카운터 또는 최고 숙련도 픽
      const counterPick = myCandidates.find(c => (c.strongVs || []).includes(oppLaner.id));
      selectedChamp = counterPick || myCandidates[0];
      toast(`⚡ [AI 최적 픽] ${selectedChamp.n} 자동 선택 완료!`);
    }

    const finalIsCounter = (selectedChamp.strongVs || []).includes(oppLaner.id);
    const finalFullTeam = Object.values(myTeamRoster).concat([selectedChamp]);
    const finalSynergy = analyzeCompSynergy(finalFullTeam);
    addChampMastery(selectedChamp.id, 100);
    P.currentChamp = selectedChamp;
    const bonusVal = finalIsCounter ? 15 : 5;
    return { myChamp: selectedChamp, bannedChamp: oppRoster.mid?.id, bonus: bonusVal, isCounter: finalIsCounter, synergy: finalSynergy };
  }
}

const CURRENT_VERSION = '2.7.1';

function initIntroVideo() {
  const splash = document.getElementById('introSplash');
  const video = document.getElementById('introVideo');
  const skipBtn = document.getElementById('skipIntroBtn');
  if (!splash) return;

  let dismissed = false;
  function dismissSplash() {
    if (dismissed) return;
    dismissed = true;
    splash.style.opacity = '0';
    setTimeout(() => {
      try {
        splash.style.display = 'none';
        splash.remove();
      } catch (e) {}
      checkForUpdates(true);
    }, 350);
  }

  // 1-터치 즉시 스킵: 화면 어디든 탭하면 바로 게임으로 진입
  splash.onclick = (e) => {
    e.stopPropagation();
    dismissSplash();
  };

  if (skipBtn) {
    skipBtn.onclick = (e) => {
      e.stopPropagation();
      dismissSplash();
    };
  }

  if (video) {
    const isPortrait = window.innerHeight > window.innerWidth;
    const videoSrc = isPortrait ? 'assets/logo_portrait.mp4' : 'assets/logo_landscape.mp4';
    const fallbackSrc = isPortrait ? 'logo_portrait.mp4' : 'logo_landscape.mp4';

    video.src = videoSrc;
    video.playbackRate = 1.65;

    // 비디오가 정상 재생 시작되면 부드럽게 페이드인 노출
    video.onplaying = () => {
      video.style.opacity = '1';
    };

    video.onended = () => {
      dismissSplash();
    };

    video.onerror = () => {
      // 비디오 재생 실패 시 조용히 스플래시 종료하여 게임 화면 즉시 표시
      if (video.src.indexOf('assets/') !== -1) {
        video.src = fallbackSrc;
        video.play().catch(() => { dismissSplash(); });
      } else {
        dismissSplash();
      }
    };

    const p = video.play();
    if (p !== undefined) {
      p.catch(() => {
        video.muted = true;
        video.play().catch(() => {
          // 비디오 재생 불가능한 기기에서는 1.5초 후 자동 게임 진입
          setTimeout(dismissSplash, 1500);
        });
      });
    }
  }

  // 안전 타임아웃: 어떤 기기든 최대 3.0초 후 무조건 게임 메인 화면 노출 보장!
  setTimeout(() => {
    dismissSplash();
  }, 3000);
}

async function checkForUpdates(silent = true) {
  try {
    const urls = [
      'https://raw.githubusercontent.com/JyHwa0702/pro-gamer/master/version.json',
      'version.json',
      'assets/version.json'
    ];
    let remoteData = null;
    for (const url of urls) {
      try {
        const res = await fetch(url + '?_t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          remoteData = await res.json();
          break;
        }
      } catch (e) {}
    }

    if (!remoteData || !remoteData.version) return;

    if (isNewerVersion(remoteData.version, CURRENT_VERSION)) {
      showUpdateModal(remoteData);
    } else if (!silent) {
      toast(`✨ 현재 최신 버전(v${CURRENT_VERSION})을 이용 중입니다.`);
    }
  } catch (err) {
    console.warn('Update check failed:', err);
  }
}

function isNewerVersion(remote, local) {
  const r = (remote || '').split('.').map(Number);
  const l = (local || '').split('.').map(Number);
  for (let i = 0; i < Math.max(r.length, l.length); i++) {
    const rv = r[i] || 0, lv = l[i] || 0;
    if (rv > lv) return true;
    if (rv < lv) return false;
  }
  return false;
}

// Result motion reads rendered text only. It never reads or mutates career/save/RNG state.
function parseResultNumber(text) {
  const original=String(text ?? '');
  const match=original.trim().match(/^([+\-−]?)(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?((?:만|억)?(?:원|명|주|%)?)$/);
  if(!match)return null;
  const value=Number((match[1]==='−'?'-':match[1])+match[2].replace(/,/g,'')+(match[3]||''));
  if(!Number.isFinite(value)||(match[3]||'').length>21)return null;
  return {original,value,sign:match[1],precision:(match[3]||'').slice(1).length,grouped:match[2].includes(','),suffix:match[4]};
}

function formatResultNumber(number,progress) {
  if(progress>=1)return number.original;
  const magnitude=(Math.abs(number.value)*Math.max(0,progress)).toFixed(number.precision);
  const parts=magnitude.split('.');
  if(number.grouped)parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return number.sign+parts.join('.')+number.suffix;
}

function resultMotionTone(label,delta) {
  if(!Number.isFinite(delta)||delta===0)return 'neutral';
  const improvement=label.includes('스트레스')?-delta:delta;
  return improvement>0?'positive':'negative';
}

function initResultMotion() {
  if(initResultMotion.started||typeof MutationObserver==='undefined')return;
  initResultMotion.started=true;
  const seen=new WeakSet(),active=new Map();
  const media=window.matchMedia?.('(prefers-reduced-motion: reduce)');
  const selector='.brief-metric,.season-result-grid > div';
  const finish=node=>{
    const running=active.get(node);if(!running)return;
    cancelAnimationFrame(running.frame);node.textContent=running.number.original;active.delete(node);
  };
  const enhance=card=>{
    if(seen.has(card)||!card.isConnected)return;
    seen.add(card);
    const weekly=card.classList.contains('brief-metric');
    const value=card.querySelector(weekly?'strong':'b');
    if(!value||value.children.length)return;
    const number=parseResultNumber(value.textContent);if(!number)return;
    const label=card.querySelector(weekly?'span':'small')?.textContent||'';
    let delta=0;
    if(weekly){
      const pair=(card.querySelector('small')?.textContent||'').split('→').map(parseResultNumber);
      if(pair.length===2&&pair.every(Boolean))delta=pair[1].value-pair[0].value;
    }else if(number.sign||label==='승리')delta=number.value;
    card.classList.add('result-card','result-'+resultMotionTone(label,delta));
    value.setAttribute('aria-label',number.original);
    if(media?.matches)return;
    card.classList.add('result-enter');
    if(number.value===0)return;
    const running={number,frame:0,start:performance.now()};active.set(value,running);
    value.textContent=formatResultNumber(number,0);
    const tick=now=>{
      if(!value.isConnected||media?.matches){finish(value);return;}
      const progress=Math.min(1,(now-running.start)/640);
      value.textContent=formatResultNumber(number,1-Math.pow(1-progress,3));
      if(progress<1)running.frame=requestAnimationFrame(tick);else active.delete(value);
    };
    running.frame=requestAnimationFrame(tick);
  };
  const scan=node=>{
    if(node.nodeType!==1)return;
    if(node.matches(selector))enhance(node);
    node.querySelectorAll(selector).forEach(enhance);
  };
  scan(document.body);
  new MutationObserver(records=>{
    // Number text writes add only text nodes, so they cannot trigger another enhancement.
    records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)scan(node);}));
    active.forEach((_,node)=>{if(!node.isConnected)finish(node);});
  }).observe(document.body,{childList:true,subtree:true});
  media?.addEventListener?.('change',event=>{if(event.matches)active.forEach((_,node)=>finish(node));});
}

// DOM 전용 이미지 감상: 실제로 렌더링된 src만 사용하며 P/세이브/난수를 건드리지 않는다.
function imageViewerSize(width,height,viewWidth,viewHeight,zoom=1) {
  const w=Number.isFinite(width)&&width>0?width:1,h=Number.isFinite(height)&&height>0?height:1;
  const vw=Math.max(1,Number.isFinite(viewWidth)?viewWidth:1),vh=Math.max(1,Number.isFinite(viewHeight)?viewHeight:1);
  const z=Number.isFinite(zoom)?Math.min(4,Math.max(1,zoom)):1,fit=Math.min(vw/w,vh/h);
  return {width:w*fit*z,height:h*fit*z,zoom:z};
}
function initImageViewer() {
  const dialog=$('#imageViewer'),stage=$('#imageViewerStage'),canvas=$('#imageViewerCanvas'),photo=$('#imageViewerImage');
  const closeButton=$('#imageViewerClose'),zoomIn=$('#imageZoomIn'),zoomOut=$('#imageZoomOut'),reset=$('#imageZoomReset');
  const selector='.vn-portrait img,img.season-portrait,img.champion-avatar,img.cine-heroine-img,img.cine-banner-img,img.insta-card-img,[data-image-viewer]';
  let state=null;
  const resize=(zoom=1)=>{
    if(!state)return;
    const oldWidth=canvas.offsetWidth || 1,oldHeight=canvas.offsetHeight || 1;
    const x=oldWidth>stage.clientWidth?(stage.scrollLeft+stage.clientWidth/2)/oldWidth:.5;
    const y=oldHeight>stage.clientHeight?(stage.scrollTop+stage.clientHeight/2)/oldHeight:.5;
    const size=imageViewerSize(photo.naturalWidth,photo.naturalHeight,Math.max(1,stage.clientWidth-24),Math.max(1,stage.clientHeight-24),zoom);
    state.zoom=size.zoom;canvas.style.width=size.width+'px';canvas.style.height=size.height+'px';
    stage.scrollLeft=Math.max(0,size.width*x-stage.clientWidth/2);stage.scrollTop=Math.max(0,size.height*y-stage.clientHeight/2);
    $('#imageZoomValue').textContent=Math.round(size.zoom*100)+'%';zoomOut.disabled=size.zoom<=1;zoomIn.disabled=size.zoom>=4;
  };
  const close=()=>{if(dialog.open)dialog.close();};
  const open=origin=>{
    if(dialog.open || !origin?.isConnected || origin.closest('[disabled],.locked'))return;
    const image=origin.matches('img')?origin:origin.querySelector('img');if(!image)return;
    const src=image.currentSrc || image.src;if(!src)return;
    state={origin,zoom:1,pointers:new Map(),dragged:false,bodyOverflow:document.body.style.overflow};
    photo.alt=image.alt || '이미지';photo.src=src;
    $('#imageViewerTitle').textContent=image.alt?image.alt+' · 크게 보기':'이미지 크게 보기';$('#imageViewerStatus').textContent='';
    document.body.style.overflow='hidden';dialog.showModal();resize(1);closeButton.focus({preventScroll:true});
  };
  const enhance=root=>{
    const images=[...(root.matches?.(selector)?[root]:[]),...root.querySelectorAll(selector)];
    images.forEach(image=>{
      if(!image.matches('img') || image.closest('#imageViewer,button,a,[disabled],.locked'))return;
      image.dataset.imageViewer='1';image.setAttribute('role','button');image.tabIndex=0;
      image.title='눌러서 크게 보기';
      image.setAttribute('aria-label',(image.alt || '이미지')+' 크게 보기');image.setAttribute('aria-haspopup','dialog');
    });
  };
  enhance(document.body);
  new MutationObserver(records=>{
    records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)enhance(node);}));
    if(state && !state.origin.isConnected)close();
  }).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',event=>{
    const trigger=event.target.closest?.('[data-image-trigger],img[data-image-viewer]');
    if(!trigger || trigger.closest('#imageViewer'))return;
    event.preventDefault();event.stopPropagation();open(trigger);
  },true);
  document.addEventListener('keydown',event=>{
    if(dialog.open){
      if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();close();return;}
      if(['+','=','-','0'].includes(event.key)){event.preventDefault();event.stopImmediatePropagation();resize(event.key==='0'?1:state.zoom+(event.key==='-'?-.5:.5));return;}
      if(event.key==='Tab'){
        const buttons=[closeButton,zoomOut,zoomIn,reset].filter(b=>!b.disabled),first=buttons[0],last=buttons.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
        event.stopImmediatePropagation();
      }return;
    }
    const trigger=event.target.matches?.('img[data-image-viewer]')?event.target:null;
    if(trigger && ['Enter',' '].includes(event.key)){event.preventDefault();event.stopPropagation();open(trigger);}
  },true);
  const bindControl=(button,action)=>{
    let lastTouch=-Infinity;
    // 핀치/이동 직후 브라우저가 합성 click을 생략해도 명시적인 버튼 탭은 처리한다.
    button.addEventListener('pointerup',event=>{
      if(event.pointerType!=='touch' || button.disabled)return;
      const box=button.getBoundingClientRect();
      if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)return;
      event.preventDefault();lastTouch=performance.now();action();
    });
    button.onclick=event=>{
      if(event.detail && (event.pointerType==='touch' || (!event.pointerType && performance.now()-lastTouch<500)))return;
      action();
    };
  };
  bindControl(closeButton,close);bindControl(zoomIn,()=>{if(state)resize(state.zoom+.5);});bindControl(zoomOut,()=>{if(state)resize(state.zoom-.5);});bindControl(reset,()=>resize(1));
  dialog.addEventListener('cancel',event=>{event.preventDefault();event.stopPropagation();close();});
  dialog.addEventListener('close',()=>{
    const previous=state;if(!previous)return;state=null;photo.removeAttribute('src');document.body.style.overflow=previous.bodyOverflow;
    if(previous.origin.isConnected && previous.origin.getClientRects().length)previous.origin.focus({preventScroll:true});
  });
  photo.onload=()=>resize(state?.zoom || 1);photo.onerror=()=>{if(state)$('#imageViewerStatus').textContent='이미지를 불러오지 못했습니다.';};
  stage.addEventListener('wheel',event=>{if(!state)return;event.preventDefault();resize(state.zoom+(event.deltaY<0?.25:-.25));},{passive:false});
  stage.addEventListener('dblclick',event=>{event.preventDefault();if(state)resize(state.zoom>1?1:2);});
  stage.addEventListener('pointerdown',event=>{
    if(!state || event.button>0)return;state.dragged=false;state.pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    stage.setPointerCapture(event.pointerId);
    if(state.pointers.size===2){const [a,b]=[...state.pointers.values()];state.pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),zoom:state.zoom};}
  });
  stage.addEventListener('pointermove',event=>{
    const old=state?.pointers.get(event.pointerId);if(!old)return;
    const dx=event.clientX-old.x,dy=event.clientY-old.y;state.pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if(Math.abs(dx)+Math.abs(dy)>2)state.dragged=true;
    if(state.pointers.size===2 && state.pinch){const [a,b]=[...state.pointers.values()];resize(state.pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,state.pinch.distance));state.dragged=true;}
    else{stage.scrollLeft-=dx;stage.scrollTop-=dy;}
  });
  const release=event=>{if(!state)return;state.pointers.delete(event.pointerId);if(state.pointers.size<2)state.pinch=null;};
  stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
  stage.addEventListener('click',event=>{
    if(!state || state.dragged)return;
    // Pointer capture로 사진 터치도 stage에 전달되므로 실제 사진 영역을 확인한다.
    const box=canvas.getBoundingClientRect(),inside=event.clientX>=box.left&&event.clientX<=box.right&&event.clientY>=box.top&&event.clientY<=box.bottom;
    if(event.target===stage && !inside)close();
  });
  dialog.addEventListener('click',event=>{if(event.target===dialog)close();});
  window.addEventListener('resize',()=>{if(state)resize(1);});
  window.visualViewport?.addEventListener('resize',()=>{if(state)resize(1);});
}

function initInterfaceAccessibility() {
  const modal = $('#modal'), app = $('#app');
  let previousFocus = null;
  document.addEventListener('keydown', event => {
    if ($('#imageViewer')?.open) return;
    if (modal.classList.contains('hidden')) return;
    if (event.key === 'Escape') { event.preventDefault(); $('#mCloseBtn').click(); }
    if (event.key === 'Tab') {
      const elements = Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,a[href],summary')).filter(el=>el.getClientRects().length);
      if (!elements.length) return;
      const first=elements[0],last=elements[elements.length-1];
      if (event.shiftKey && document.activeElement===first) {event.preventDefault();last.focus();}
      else if(!event.shiftKey && document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  new MutationObserver(() => {
    const open = !modal.classList.contains('hidden');
    if (open) {if(app.contains(document.activeElement))previousFocus = document.activeElement; app.inert = true; $('#mCloseBtn').focus({preventScroll:true});}
    else {app.inert = false;$('#gameNav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-expanded','false'));const id=previousFocus?.id;requestAnimationFrame(()=>{if(!modal.classList.contains('hidden'))return;const target=(id&&document.getElementById(id))||(previousFocus?.isConnected?previousFocus:null);target?.focus({preventScroll:true});});}
  }).observe(modal,{attributes:true,attributeFilter:['class']});
}

P = load();
syncHeroineAges();
render();
initInterfaceAccessibility();
initResultMotion();
initImageViewer();
initIntroVideo();
addEventListener('pagehide', save);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<title>켠김에 GOAT까지</title><link rel="icon" type="image/png" href="icon-512.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070910;color:#e8ecf4;overflow:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-0.015em;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:#0e1220}
#top{padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top));background:#161b2e;font-size:13px}
#top .l1{display:flex;align-items:center;gap:6px;font-weight:800}
#top .l1 .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#top .l2{color:#9aa4b2;margin-top:3px;font-size:12.5px;display:flex;justify-content:space-between}
.pill{background:#0b0f1c;padding:4px 9px;border-radius:999px;white-space:nowrap;font-size:12.5px}
#main{flex:1;overflow-y:auto;padding:10px;user-select:none;-webkit-user-select:none}
.card{background:#171d31;border-radius:14px;padding:12px;margin-bottom:9px}
.card h4{margin:0 0 8px;font-size:13px;color:#9aa4b2;font-weight:700}
.prof{display:flex;gap:12px;align-items:center}
.ovr{width:74px;height:74px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#7c3aed);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.ovr b{font-size:30px;line-height:1}.ovr small{font-size:11px;opacity:.85}
.prof .info{flex:1;min-width:0;font-size:13px;line-height:1.65}
.tier{font-weight:800}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.bar{font-size:12px}
.bar .lab{display:flex;justify-content:space-between;margin-bottom:3px;color:#c9d1e3}
.bar .lab b{color:#fff}
.bar .tr{height:7px;background:#0b0f1c;border-radius:99px;overflow:hidden}
.bar .fi{height:100%;border-radius:99px;transition:width .4s}
.cond{display:flex;gap:10px;margin-top:10px}.cond>.bar{flex:1}
.sched{display:flex;align-items:center;gap:8px;font-size:13px}
.sched .ic{font-size:22px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act{background:#1f2640;border-radius:12px;padding:10px;text-align:left;border:1px solid #2a3252}
.act:active{transform:scale(.97)}
.act b{display:block;font-size:14px}
.act small{display:block;color:#9aa4b2;font-size:11.5px;margin-top:3px;line-height:1.35}
.act.rec{border-color:#f59e0b}
.act.pink{border-color:#f472b6;background:linear-gradient(145deg,#231c36,#2c1e40)}
.act:disabled{opacity:.4}
.sub{display:flex;gap:5px;margin-top:2px}.sub>button{flex:1;padding:10px 2px;font-size:12.5px}
.btn{background:linear-gradient(#3b82f6,#2563eb);padding:11px 12px;border-radius:11px;font-weight:800;font-size:14px}
.btn.gray{background:#252c46}.btn.gold{background:linear-gradient(#f59e0b,#d97706)}
.btn.red{background:linear-gradient(#ef4444,#b91c1c)}.btn.green{background:linear-gradient(#10b981,#059669)}
.btn.purple{background:linear-gradient(#a855f7,#7c3aed)}.btn.pink{background:linear-gradient(#ec4899,#db2777)}
.btn:disabled{background:#252c46;color:#6b7390}
.wide{width:100%;margin-bottom:7px}
/* 생성 화면 */
.title{text-align:center;padding:14px 0 6px}
.title .logo{font-size:52px}.title h1{margin:4px 0;font-size:26px;letter-spacing:1px}
.title p{color:#9aa4b2;margin:4px 0;font-size:13px}
input.name{width:100%;background:#0b0f1c;border:1px solid #2a3252;border-radius:10px;padding:12px;color:#fff;font:inherit;font-size:16px;margin-bottom:8px}
.poss{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pos{background:#1f2640;border-radius:10px;padding:8px 2px;text-align:center;border:2px solid transparent;font-size:12.5px;font-weight:700}
.pos span{display:block;font-size:22px}
.pos.sel{border-color:#3b82f6;background:#24305a}
/* 경기 */
.mhead{display:flex;align-items:center;justify-content:space-between;text-align:center;gap:6px}
.mhead .tm{flex:1;font-weight:800;font-size:14px}
.mhead .tm small{display:block;color:#9aa4b2;font-weight:600;font-size:12px;margin-top:2px}
.mhead .vs{font-size:20px;font-weight:900;color:#f59e0b}
.mlabel{text-align:center;font-size:12.5px;color:#f59e0b;font-weight:800;margin-bottom:6px}
.gold{margin-top:10px}
.gold .tr{height:12px;background:#ef4444;border-radius:99px;overflow:hidden;position:relative}
.gold .fi{height:100%;background:#3b82f6;transition:width .6s}
.gold .gl{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:#c9d1e3}
.log{font-size:13.5px;line-height:1.6}
.log p{margin:0 0 8px;padding:8px 10px;background:#11162a;border-radius:10px;animation:fade .35s}
.log p.good{border-left:3px solid #22c55e}.log p.bad{border-left:3px solid #ef4444}.log p.neu{border-left:3px solid #64748b}
.log p .ph{display:block;font-size:11.5px;font-weight:800;color:#9aa4b2;margin-bottom:2px}
.choices .btn{display:block;width:100%;text-align:left;margin-bottom:7px;background:#1f2640;border:1px solid #33406a}
.choices .btn small{display:block;font-weight:500;color:#9aa4b2;font-size:12px;margin-top:2px}
.result{text-align:center;padding:6px 0}
.result .big{font-size:44px;font-weight:900}
.win{color:#3b82f6}.lose{color:#ef4444}
.kda{display:flex;justify-content:center;gap:16px;margin:8px 0;font-size:13px}
.kda b{display:block;font-size:20px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 모달 & 비주얼 노벨 (모바일 노치/상단바 및 화면 잘림 100% 방지) */
.modal-close-btn{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);color:#94a3b8;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;transition:all .15s}
.modal-close-btn:active{transform:scale(.9);background:rgba(239,68,68,.3);color:#ef4444}
/* 토너먼트 대진표 브래킷 UI */
.bracket-wrapper{background:#0e1322;border:1px solid #232c48;border-radius:14px;padding:12px;margin:10px 0}
.bracket-grid{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bracket-step{flex:1;display:flex;flex-direction:column;gap:6px}
.bracket-node{background:#151c30;border:1px solid #28375c;border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;color:#cbd5e1}
.bracket-node.me{border-color:#38bdf8;background:#1a2744;color:#fff}
.bracket-node.win{border-color:#22c55e;background:#143823;color:#4ade80}
.bracket-node.loss{border-color:#ef4444;background:#3b1313;color:#fca5a5}
.bracket-node.champ{border-color:#eab308;background:linear-gradient(135deg,#3b270a,#5c3d0b);color:#fde047;box-shadow:0 0 10px rgba(234,179,8,0.3)}
.bracket-arrow{color:#64748b;font-weight:900;font-size:12px}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-start;justify-content:center;z-index:9999;padding:max(16px,env(safe-area-inset-top,16px)) 12px max(20px,env(safe-area-inset-bottom,20px)) 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box}
#modal.hidden{display:none}
/* 키보드가 가리는 영역을 제외하고 모달 내부에서 스크롤한다. 미지원 브라우저는 전체 높이 유지. */
#modal{top:var(--visual-viewport-top,0px);bottom:auto;height:var(--visual-viewport-height,100%)}
#modal .box{background:#171d31;border-radius:16px;padding:14px 15px;width:100%;max-width:430px;margin:auto 0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;animation:pop .2s ease-out;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08);box-sizing:border-box}
/* 공간은 유지하여 키보드 전환 중 배경 본문의 스크롤 위치가 뛰지 않도록 한다. */
.keyboard-open .bottom-nav-dock{visibility:hidden;pointer-events:none}
#mBody{font-size:13.5px;line-height:1.55}
#mBody h3{margin:0 0 8px;text-align:center;font-size:17px}
#mBody .em{font-size:42px;text-align:center;line-height:1.2}
#mBody .c{text-align:center}
#mBtns{display:flex;flex-direction:column;gap:6px;margin-top:10px}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}


/* 방향 1~4 확장 스타일 */
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.champ-card{background:#13182a;border:1px solid #283354;border-radius:10px;padding:8px;text-align:left;cursor:pointer}
.champ-card.sel{border-color:#f59e0b;background:#241d3b}
.champ-card b{display:block;font-size:13px;color:#fff}
.champ-card small{display:block;font-size:11px;color:#94a3b8;margin-top:2px}
.clutch-box{background:linear-gradient(135deg,#450a0a,#7f1d1d);border:2px solid #ef4444;border-radius:14px;padding:12px;text-align:center;animation:pop .25s ease-out;margin:10px 0}
.stock-row{display:flex;justify-content:space-between;align-items:center;background:#11162a;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:12.5px}
.stock-row b{color:#fff}
.prop-card{background:#11162a;border:1px solid #283354;border-radius:10px;padding:9px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}

/* 편의성 카테고리 탭 & 퀵 액션 & 뱃지 */

/* 메인 화면 히로인 호감도 퀵 바 스타일 */
.bonds-quick-card{background:linear-gradient(135deg,#16122c,#1a163a);border:1px solid rgba(244,114,182,.45);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.bonds-quick-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bonds-quick-title{font-size:13px;font-weight:900;color:#f472b6;display:flex;align-items:center;gap:6px}
.bonds-quick-sub{font-size:11px;color:#94a3b8}
.bonds-quick-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.bonds-quick-list::-webkit-scrollbar{height:4px}
.bonds-quick-list::-webkit-scrollbar-thumb{background:#475569;border-radius:99px}
.bonds-quick-item{flex:0 0 84px;background:#0d1222;border:1px solid #28375c;border-radius:12px;padding:8px 4px 6px;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s;position:relative}
.bonds-quick-item:active{transform:scale(.95)}
.bonds-quick-item.neglected{border-color:#ef4444;background:linear-gradient(180deg,#2b0d18,#120914);box-shadow:0 0 10px rgba(239,68,68,.35)}
.bonds-quick-avatar{width:56px;height:72px;border-radius:8px;object-fit:cover;object-position:center top;margin:0 auto 5px;display:block;border:2px solid #ec4899;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.bonds-quick-item.locked .bonds-quick-avatar{border-color:#475569;filter:grayscale(1);opacity:.5}
.bonds-quick-name{font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bonds-quick-aff{font-size:11px;font-weight:900;color:#f472b6;margin-top:2px}
.bonds-quick-gauge{width:100%;height:4px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:3px}
.bonds-quick-gauge-fill{height:100%;background:linear-gradient(90deg,#ec4899,#f43f5e);border-radius:99px}
.bonds-alert-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:99px;box-shadow:0 2px 6px rgba(239,68,68,.7);animation:pop .4s ease-out}

.cat-tabs{display:flex;gap:4px;margin-bottom:8px;background:#0b0f1c;padding:3px;border-radius:10px}
.cat-tab{flex:1;padding:7px 2px;border-radius:8px;background:none;font-size:12px;font-weight:800;color:#94a3b8;text-align:center;border:0;cursor:pointer}
.cat-tab.active{background:#232d4b;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.quick-action-bar{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#181432,#25133a);border:1px solid #8b5cf6;border-radius:12px;padding:8px 12px;margin-bottom:8px}
.badge-pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:800;margin:2px;letter-spacing:-0.02em}
.bg-green{background:#14532d;color:#4ade80;border:1px solid #22c55e}
.bg-gold{background:#713f12;color:#fde047;border:1px solid #eab308}
.bg-pink{background:#831843;color:#f472b6;border:1px solid #ec4899}
.bg-purple{background:#581c87;color:#c084fc;border:1px solid #a855f7}
.bg-red{background:#7f1d1d;color:#f87171;border:1px solid #ef4444}
.bg-blue{background:#1e3a8a;color:#60a5fa;border:1px solid #3b82f6}

/* 비주얼 노벨 전용 스타일 */
.vn-portrait{width:100%;min-height:340px;max-height:440px;height:380px;border-radius:16px;overflow:hidden;margin-bottom:12px;background:linear-gradient(180deg,#1e1b4b,#0b0f1c);position:relative;box-shadow:0 8px 30px rgba(0,0,0,.8), 0 0 20px rgba(244,114,182,.15);display:flex;align-items:center;justify-content:center}
.vn-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 18%;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.vn-portrait:hover img{transform:scale(1.04)}
.vn-portrait.mood-sensual{border:2px solid #f43f5e;box-shadow:0 0 25px rgba(244,63,94,.5)}
.vn-portrait.mood-blush{border:2px solid #ec4899;box-shadow:0 0 20px rgba(236,72,153,.4)}
.vn-portrait.mood-intimate{border:2px solid #a855f7;box-shadow:0 0 30px rgba(168,85,247,.6)}
.vn-outfit-badge{position:absolute;bottom:8px;left:8px;background:linear-gradient(135deg,rgba(244,63,94,.92),rgba(168,85,247,.92));backdrop-filter:blur(6px);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:900;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:2;letter-spacing:-0.02em}
.vn-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;color:#f472b6;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2}
.vn-scene{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;color:#38bdf8;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2}
.vn-speaker{display:inline-block;background:linear-gradient(90deg,#ec4899,#8b5cf6);padding:3px 12px;border-radius:6px;font-weight:900;font-size:13px;margin-bottom:6px;color:#fff;box-shadow:0 2px 8px rgba(236,72,153,.35)}
.vn-dialogue{background:#0e1324;border:1px solid #283354;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;color:#f1f5f9;margin-bottom:8px}
/* 인연 카드 */
.h-card{display:flex;gap:12px;background:#13182a;border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid #263050;position:relative}
.h-card.locked{opacity:.45;filter:grayscale(.7)}
.h-thumb{width:76px;height:94px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#0b0f1c}
.h-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.h-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.h-name{display:flex;justify-content:space-between;align-items:center}
.h-name b{font-size:15px;color:#fff}
.h-name .status{font-size:11.5px;padding:2px 7px;border-radius:99px;font-weight:800}
.status.s0{background:#334155;color:#94a3b8}
.status.s1{background:#831843;color:#f472b6}
.status.s2{background:#be185d;color:#fbcfe8}
.status.s3{background:#ec4899;color:#fff;box-shadow:0 0 10px rgba(236,72,153,.6)}
.h-buff{font-size:11.5px;color:#cbd5e1;line-height:1.4;margin:4px 0}
.h-buff b{color:#38bdf8}
.h-bar{height:6px;background:#0b0f1c;border-radius:99px;overflow:hidden;margin-top:3px}
.h-bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#ec4899);transition:width .4s}
/* 상점 & 업적 */
.tab-row{display:flex;gap:4px;margin-bottom:12px;background:#0b0f1c;padding:3px;border-radius:10px}
.tab-row button{flex:1;padding:8px 0;border-radius:8px;background:none;font-size:12.5px;font-weight:700;color:#94a3b8}
.tab-row button.act{background:#232d4b;color:#fff}
.shopi{display:flex;align-items:center;gap:10px;background:#11162a;border-radius:10px;padding:9px;margin-bottom:6px;text-align:left}
.shopi .t{flex:1;font-size:13px}.shopi .t small{display:block;color:#9aa4b2}
.shopi.skin-legend{border:1px solid #a855f7}.shopi.skin-mythic{border:1px solid #facc15;background:linear-gradient(135deg,#1b172a,#2c2014)}
.skin-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:900;margin-right:4px}
.tag-normal{background:#475569;color:#fff}.tag-epic{background:#2563eb;color:#fff}.tag-legend{background:#9333ea;color:#fff}.tag-mythic{background:#ca8a04;color:#fff}
.ach-card{display:flex;align-items:center;gap:10px;background:#11162a;border-radius:10px;padding:9px;margin-bottom:6px;text-align:left}
.ach-card.done{border-left:3px solid #22c55e}.ach-card.locked{opacity:.5}
.ach-card .ic{font-size:26px;width:34px;text-align:center}
.ach-card .info{flex:1;min-width:0;font-size:13px}
.ach-card .info small{display:block;color:#9aa4b2;font-size:11.5px}
.ach-card .reward{color:#ffd23f;font-weight:800;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;text-align:center;border-bottom:1px solid #222a44}
th{color:#9aa4b2;font-weight:700;font-size:12px}
td.l{text-align:left}
tr.me td{background:#1d2a52;font-weight:800}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;border-bottom:1px solid #222a44}
.kv b{color:#ffd23f}
.delta{font-size:13px;line-height:1.7;background:#11162a;border-radius:10px;padding:8px 10px;margin-top:8px}
.up{color:#4ade80}.dn{color:#f87171}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(15,19,34,.95);padding:9px 16px;border-radius:999px;
  font-weight:800;font-size:14px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;white-space:nowrap;border:1px solid #2f3756}
#toast.show{opacity:1}

/* 📸 인스타그램(GamerGram) 리얼 UI & DM 전용 스타일 */
.insta-wrap { background: #000; border-radius: 16px; border: 1px solid #262626; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.insta-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1a1a1a; background: #050505; }
.insta-brand-logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.insta-nav-icons { display: flex; gap: 14px; align-items: center; font-size: 17px; }
.insta-nav-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 2px; position: relative; font-size: 17px; }
.insta-nav-btn.act { color: #ec4899; }
.insta-badge-dot { position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 1.5px solid #000; }

/* 스토리 바 */
.insta-stories-container { display: flex; gap: 12px; padding: 12px 14px; overflow-x: auto; border-bottom: 1px solid #1a1a1a; background: #080808; -webkit-overflow-scrolling: touch; }
.insta-stories-container::-webkit-scrollbar { display: none; }
.insta-story-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; cursor: pointer; }
.insta-story-ring { width: 62px; height: 62px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); display: flex; align-items: center; justify-content: center; transition: transform .15s; }
.insta-story-ring:active { transform: scale(0.92); }
.insta-story-ring.my-ring { background: #262626; border: 1.5px dashed #64748b; padding: 2px; }
.insta-story-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; object-fit: cover; }
.insta-story-user { font-size: 10.5px; color: #e5e5e5; max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

/* 내 프로필 요약 카드 */
.insta-profile-bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; }
.insta-p-avatar { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 2px solid #ec4899; flex-shrink: 0; }
.insta-p-avatar img { width: 100%; height: 100%; object-fit: cover; }
.insta-p-info { flex: 1; }
.insta-p-name { font-size: 14px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 4px; }
.insta-p-badge { color: #38bdf8; font-size: 13px; }
.insta-p-bio { font-size: 11.5px; color: #8e8e8e; margin-top: 2px; }
.insta-p-stats { display: flex; gap: 14px; margin-top: 6px; font-size: 11.5px; color: #a8a8a8; }
.insta-p-stats b { color: #fff; font-weight: 700; }

/* 피드 카드 (1:1 정사각형 리얼 인스타) */
.insta-card { background: #000; border-bottom: 1px solid #1a1a1a; margin-bottom: 14px; }
.insta-card-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
.insta-card-author { display: flex; align-items: center; gap: 10px; }
.insta-author-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid #ec4899; }
.insta-author-meta { font-size: 12.5px; font-weight: 700; color: #fff; }
.insta-author-loc { font-size: 10.5px; color: #8e8e8e; font-weight: 400; }
.insta-card-img-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #121212; overflow: hidden; }
.insta-card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.insta-card-actions { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; }
.insta-actions-left { display: flex; gap: 14px; font-size: 20px; }
.insta-action-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 0; font-size: 19px; transition: transform .1s; }
.insta-action-btn:active { transform: scale(1.2); }
.insta-likes-row { padding: 0 14px 6px; font-size: 12.5px; font-weight: 700; color: #f5f5f5; }
.insta-caption-row { padding: 0 14px 6px; font-size: 12px; line-height: 1.45; color: #e5e5e5; }
.insta-caption-row b { font-weight: 700; margin-right: 6px; color: #fff; }
.insta-hashtags { color: #0095f6; font-size: 11.5px; margin-top: 2px; }
.insta-comments-wrap { padding: 0 14px 10px; font-size: 11.5px; }
.insta-comment-line { margin-bottom: 4px; color: #d4d4d4; }
.insta-comment-line b { color: #fff; font-weight: 700; margin-right: 6px; }
.insta-time-row { padding: 0 14px 12px; font-size: 10px; color: #737373; text-transform: uppercase; letter-spacing: 0.3px; }
.insta-reply-box { margin: 6px 14px 12px; display: flex; gap: 6px; }
.insta-reply-input { flex: 1; background: #141414; border: 1px solid #262626; border-radius: 20px; padding: 6px 12px; font-size: 11.5px; color: #fff; outline: none; }
.insta-reply-btn { background: #0095f6; color: #fff; border: none; border-radius: 20px; padding: 6px 14px; font-size: 11px; font-weight: 700; cursor: pointer; }

/* DM 수신함 */
.insta-dm-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #141414; cursor: pointer; transition: background .15s; position: relative; }
.insta-dm-item:active { background: #141414; }
.insta-dm-item.unread { background: #161224; }
.insta-dm-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.insta-dm-meta { flex: 1; min-width: 0; }
.insta-dm-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.insta-dm-badge { font-size: 10px; padding: 1px 6px; border-radius: 99px; margin-left: 6px; }
.insta-dm-preview { font-size: 11.5px; color: #8e8e8e; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insta-dm-item.unread .insta-dm-preview { color: #fff; font-weight: 600; }

/* 🎬 매드무비 시네마틱 & 📸 인스타 앨범 전용 스타일 */
.mm-screen{position:relative;width:100%;height:220px;background:#050811;border-radius:14px;overflow:hidden;border:2px solid #3b82f6;box-shadow:0 0 25px rgba(59,130,246,0.3);margin-bottom:10px}
.mm-canvas{width:100%;height:100%;display:block}
.mm-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.mm-kill-banner{font-size:28px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#ffd23f;text-shadow:0 0 20px #f59e0b, 0 0 40px #ef4444;animation:pop .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);background:rgba(0,0,0,0.65);padding:6px 18px;border-radius:99px;border:1px solid #ffd23f;margin-bottom:6px}
.mm-sub-banner{font-size:13px;font-weight:800;color:#fff;background:rgba(239,68,68,0.85);padding:3px 12px;border-radius:99px;letter-spacing:0.5px}

.mm-caster-tag{color:#38bdf8;font-weight:800;margin-right:6px}
.gallery-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:7px;margin:10px 0;max-height:280px;overflow-y:auto;padding-right:2px}
.gallery-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#151c30;border:2px solid #232d48;cursor:pointer;position:relative;transition:border-color .2s}

.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-tag{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.75);font-size:10px;color:#fff;padding:1px 5px;border-radius:4px;font-weight:700}


/* ⚔️ LCK 챔피언 선택창 & 조합 시너지 스타일 */
.lck-draft-box{background:#0c111e;border:1px solid #1f2b48;border-radius:14px;padding:12px;margin-bottom:10px}

.champ-pick-card:hover, .champ-pick-card.sel{border-color:#f59e0b;background:#241d3b;box-shadow:0 0 10px rgba(245,158,11,0.5)}

.champ-pick-card b{font-size:12.5px;color:#fff;display:block}
.champ-pick-card small{font-size:10px;color:#94a3b8}

/* 🎨 인스타그램 필터 효과 */
.filter-normal { filter: none; }
.filter-clarendon { filter: contrast(1.2) saturate(1.25); }
.filter-juno { filter: contrast(1.15) saturate(1.4) sepia(0.08); }
.filter-ludwig { filter: contrast(1.05) brightness(1.05) saturate(0.9); }
.filter-valencia { filter: contrast(1.08) brightness(1.08) sepia(0.15); }
.filter-moon { filter: grayscale(1) contrast(1.1) brightness(1.1); }

/* 인스타 새 게시물 생성 플로우 */
.insta-create-flow { background: #000; border-radius: 14px; overflow: hidden; border: 1px solid #262626; }
.insta-create-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #1f1f1f; background: #080808; }
.insta-text-btn { background: none; border: none; color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.insta-share-btn { background: none; border: none; color: #0095f6; font-size: 13.5px; font-weight: 800; cursor: pointer; }
.insta-share-btn:hover { color: #38bdf8; }
.insta-preview-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #111; overflow: hidden; }
.insta-preview-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .2s; }
.insta-filter-scroll { display: flex; gap: 10px; padding: 10px 14px; overflow-x: auto; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; -webkit-overflow-scrolling: touch; }
.insta-filter-scroll::-webkit-scrollbar { display: none; }
.insta-filter-thumb { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; }
.insta-filter-box { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; }
.insta-filter-thumb.sel .insta-filter-box { border-color: #0095f6; }
.insta-filter-box img { width: 100%; height: 100%; object-fit: cover; }
.insta-filter-name { font-size: 10.5px; color: #8e8e8e; }
.insta-filter-thumb.sel .insta-filter-name { color: #fff; font-weight: 700; }
.insta-caption-area { padding: 12px 14px; background: #050505; border-bottom: 1px solid #1a1a1a; }
.insta-caption-input { width: 100%; min-height: 60px; background: none; border: none; color: #fff; font-size: 16px; resize: none; outline: none; font-family: inherit; line-height: 1.5; }
.insta-tag-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.insta-chip { background: #1a1a1a; border: 1px solid #333; color: #38bdf8; font-size: 11px; padding: 3px 8px; border-radius: 99px; cursor: pointer; font-weight: 600; }
.insta-chip:active { background: #333; }
.insta-meta-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #141414; background: #080808; font-size: 12.5px; color: #d4d4d4; }
.insta-meta-row select { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 11.5px; outline: none; }
.insta-posting-bar { height: 3px; background: linear-gradient(90deg, #f09433, #dc2743, #bc1888); animation: posting 1.5s infinite linear; }
@keyframes posting { 0% { width: 0%; margin-left: 0%; } 50% { width: 70%; margin-left: 15%; } 100% { width: 100%; margin-left: 100%; } }

/* 🏠 부동산 & 🏎️ 슈퍼카 럭셔리 상점 스타일 */
.luxury-card { background: linear-gradient(135deg, #0e1424, #131c36); border: 1px solid #233560; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.luxury-card.own { border-color: #22c55e; background: linear-gradient(135deg, #0d2218, #0e1c28); }
.luxury-card.equipped { border-color: #ffd23f; box-shadow: 0 0 14px rgba(255, 210, 63, 0.35); }
.luxury-head { display: flex; justify-content: space-between; align-items: center; }
.luxury-name { font-size: 13.5px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
.luxury-desc { font-size: 11.5px; color: #94a3b8; line-height: 1.45; }
.luxury-buffs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.buff-pill { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 10.5px; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
.buff-pill.gold { background: rgba(250, 204, 21, 0.15); color: #fde047; border-color: rgba(250, 204, 21, 0.3); }
.buff-pill.pink { background: rgba(244, 114, 182, 0.15); color: #f472b6; border-color: rgba(244, 114, 182, 0.3); }


/* 🎬 대형 시네마틱 돌발 이벤트 & 히로인 표정/무드 스타일 */
.cine-event-card { background: #0c101d; border: 1px solid #233560; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin-bottom: 12px; }
.cine-banner-wrap { position: relative; width: 100%; height: 180px; background: #050811; overflow: hidden; }
.cine-banner-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.9); }
.cine-banner-tag { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 900; padding: 3px 10px; border-radius: 99px; letter-spacing: 0.5px; text-transform: uppercase; }
.cine-banner-tag.red { background: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(239,68,68,0.5); }
.cine-banner-tag.gold { background: #f59e0b; color: #000; box-shadow: 0 0 10px rgba(245,158,11,0.5); }
.cine-banner-tag.pink { background: #ec4899; color: #fff; box-shadow: 0 0 10px rgba(236,72,153,0.5); }
.cine-banner-tag.blue { background: #3b82f6; color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
.cine-banner-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 14px 8px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.95)); font-size: 16px; font-weight: 900; color: #fff; }

.cine-heroine-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px 6px; background: #0f1526; border-bottom: 1px solid #1c2744; }
.cine-heroine-portrait-box { position: relative; width: 56px; height: 72px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 2.5px solid #3b82f6; transition: all .2s; }
.cine-heroine-img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.cine-mood-badge { position: absolute; bottom: 0; left: 0; right: 0; font-size: 9px; font-weight: 800; text-align: center; background: rgba(0,0,0,0.85); color: #fff; padding: 1px 0; }

.mood-shock { border-color: #ef4444 !important; box-shadow: 0 0 15px rgba(239,68,68,0.65) !important; animation: shake 0.4s; }
.mood-shock .cine-mood-badge { background: #ef4444 !important; }
.mood-blush { border-color: #ec4899 !important; box-shadow: 0 0 15px rgba(236,72,153,0.65) !important; }
.mood-blush .cine-mood-badge { background: #ec4899 !important; }
.mood-happy { border-color: #22c55e !important; box-shadow: 0 0 15px rgba(34,197,94,0.65) !important; }
.mood-happy .cine-mood-badge { background: #22c55e !important; }
.mood-alert { border-color: #f59e0b !important; box-shadow: 0 0 15px rgba(245,158,11,0.65) !important; }
.mood-alert .cine-mood-badge { background: #f59e0b !important; color: #000 !important; }
.mood-cool { border-color: #38bdf8 !important; box-shadow: 0 0 15px rgba(56,189,248,0.65) !important; }
.mood-cool .cine-mood-badge { background: #38bdf8 !important; color: #000 !important; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

.cine-dialogue-bubble { flex: 1; background: #151d33; border: 1px solid #28375c; border-radius: 10px; padding: 9px 12px; position: relative; }
.cine-dialogue-bubble::before { content: ""; position: absolute; left: -6px; top: 18px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #28375c; }
.cine-dialogue-speaker { font-size: 12.5px; font-weight: 800; color: #f472b6; margin-bottom: 3px; display: flex; align-items: center; justify-content: space-between; }
.cine-dialogue-text { font-size: 12px; color: #f1f5f9; line-height: 1.45; }

.cine-desc-text { padding: 12px 14px; font-size: 12.5px; color: #cbd5e1; line-height: 1.55; }
.cine-buff-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px 12px; }

/* v2.3 공통 UI: 상태는 짧게, 선택은 크게, 세부 설명은 펼침으로 제공한다. */
:root{--ui-bg:#090e19;--ui-panel:#121b2b;--ui-panel-2:#182438;--ui-line:#28364b;--ui-text:#f3f6fb;--ui-muted:#99a9bf;--ui-accent:#9aafff;--ui-gold:#e5c38c}
html,body{background:var(--ui-bg);color:var(--ui-text);letter-spacing:-.02em}

.result-card{--result-tone:#becce2;transition:border-color .2s ease,background-color .2s ease}
.result-card.result-positive{--result-tone:#86dfbd;border-color:#4f8d7b;background-color:#182e32}
.result-card.result-negative{--result-tone:#f2a3af;border-color:#825666;background-color:#302431}
.result-card.result-neutral{--result-tone:#becce2}
.brief-metric.result-card>strong,.season-result-grid>.result-card>b{color:var(--result-tone);font-variant-numeric:tabular-nums}
.brief-metric.result-card>b{color:var(--result-tone);font-weight:600}
.result-enter{animation:result-enter .44s ease-out both}

function initMobileViewport() {
  const viewport = window.visualViewport;
  if (!viewport) return;
  const root = document.documentElement;
  let width = window.innerWidth;
  let fullHeight = Math.max(window.innerHeight, root.clientHeight, viewport.height);
  function update() {
    const height = Math.max(window.innerHeight, root.clientHeight, viewport.height);
    if (width !== window.innerWidth) {
      width = window.innerWidth;
      fullHeight = height;
    } else {
      fullHeight = Math.max(fullHeight, height);
    }
    root.style.setProperty('--visual-viewport-height', `${viewport.height}px`);
    root.style.setProperty('--visual-viewport-top', `${viewport.offsetTop}px`);
    const active = document.activeElement;
    const editable = active && !active.readOnly && !active.disabled && (
      active.isContentEditable || active.tagName === 'TEXTAREA' ||
      (active.tagName === 'INPUT' && !/^(button|submit|reset|checkbox|radio|file|range|color|hidden|image)$/.test(active.type))
    );
    const keyboardOpen = !!editable && window.matchMedia('(pointer: coarse)').matches &&
      Math.abs(viewport.scale - 1) < 0.05 && fullHeight - viewport.height > Math.max(150, fullHeight * 0.2);
    root.classList.toggle('keyboard-open', keyboardOpen);
  }
  const schedule = () => requestAnimationFrame(update);
  viewport.addEventListener('resize', schedule);
  viewport.addEventListener('scroll', schedule);
  window.addEventListener('resize', schedule);
  document.addEventListener('focusin', schedule);
  document.addEventListener('focusout', schedule);
  update();
}

function renderButtons(btns, res) {

      e.onclick = () => {

        res(i);
      };
      f.appendChild(e);
    });
    $('#modal').classList.remove('hidden');
}

function askWithTabs(html, buttons, tabs) {
  const pending = ask(html, buttons);
  for (const [id, tab] of Object.entries(tabs)) {

      const resolve = currentAskResolve;
      currentAskResolve = null;
      $('#modal').classList.add('hidden');
      if (resolve) resolve({ tab });
    };
  }
  return pending;
}

  if (!bond?.unlocked || !date || (P.weeklyDates || 0) >= 1 || P.money < date.c || P.hp < 8) return false;

  P.money -= date.c;

function settleWeeklyResources() {
  const key = `${P.year}:${P.week}`;
  if (P.lastEconomyWeek === key) return;
  P.lastEconomyWeek = key;
  const previousMoney = P.money;
  const house = HOUSES[P.house] || {};
  hpAdd(house.hpRegen || 0); stressAdd(house.stressRegen || 0);
  if (P.fanclub?.founded) P.money += Math.round(100000 + (P.fans || 0) * 3);
  P.money += P.salary || 0;
  P.money += (P.properties || []).reduce((sum, id) => sum + (REAL_ESTATE.find(r => r.id === id)?.rent || 0), 0);
  if (P.signatureSkin?.weeklyRoyalty) P.money += P.signatureSkin.weeklyRoyalty;
  if (P.hallOfFame) P.money += 50000000;
  if (P.isOwnerMode) {
    P.owner ||= { coachLevel: 0 };
    P.money += 500000;
    const cost = (P.owner.coachLevel || 0) * 200000;
    if (P.money >= cost && cost > 0) {
      P.money -= cost;
      const primary = Object.entries(POS[P.pos].w).sort((a,b) => b[1]-a[1])[0][0];
      grow(primary, .3 * P.owner.coachLevel);
    }
  }
  if (P.money > previousMoney) P.money = previousMoney + Math.round((P.money - previousMoney) * (1 + heroineBonus('income')));
}

    try {
      const raw = store.get(key);
      if (!raw) continue;
      const p = JSON.parse(raw);
      if (!p || typeof p !== 'object' || Array.isArray(p)) continue;
      const legacySchema = !p.balanceSchema;
      if (p.age == null) p.age = 17 + (p.year || 1) - 1;
      const baseStats = { mech: 20, lane: 20, macro: 20, team: 20, pool: 20, mental: 40 };
      p.s ||= {};
      for (const [stat, value] of Object.entries(baseStats)) if (p.s[stat] == null) p.s[stat] = value;
      const defaults = makePlayer(p.name || '무명', POS[p.pos] ? p.pos : 'mid', p.s);
      for (const [field, value] of Object.entries(defaults)) if (p[field] == null) p[field] = value;
      p.year ||= 1; p.week ||= 1; p.age ||= 17 + p.year - 1;
      if (!p.bonds) p.bonds = {};
      for (const k of Object.keys(HEROINES)) {
        p.bonds[k] = { aff: k === 'jieun' ? 20 : 0, lv: 0, unlocked: k === 'jieun', ...p.bonds[k] };
        const last = p.bonds[k].lastInteractWeek;
        if (legacySchema && last > 0) p.bonds[k].lastInteractWeek = Math.floor((last - 1) / 48) * YEAR_WEEKS + ((last - 1) % 48) + 1;
      }
      if (!p.skins) p.skins = {};
      if (!p.achieves) p.achieves = {};
      p.gear ||= {}; p.stocks ||= {}; p.properties ||= [];
      p.hist = { ...defaults.hist, ...p.hist };
      for (const [field, value] of Object.entries(defaults.hist)) if (p.hist[field] == null) p.hist[field] = value;
      p.maxHp = Math.max(100, p.maxHp || 100, p.hp || 0);
      if ((p.bonds.camila?.aff || 0) >= 75 && !p.camilaHpGranted) { p.maxHp += 40; p.camilaHpGranted = true; }
      p.weeklyDates = p.weeklyDates || 0;
      p.weeklyBriefingHistory = validWeekBriefings(p.weeklyBriefingHistory || []);
      p.seasonJourney = validSeasonJourney(p.seasonJourney, p.year) ? p.seasonJourney : null;
      p.seasonArchive = validSeasonArchive(p.seasonArchive || []);
      p.career = validCareer(p.career) ? p.career : null;
      p.contractBonus = validContractBonus(p.contractBonus) ? p.contractBonus : null;
      p.contractBonusHistory = validContractBonusHistory(p.contractBonusHistory) ? p.contractBonusHistory : [];
      p.sns = { posts: [], followers: 120, ...p.sns };
      p.dms = { list: [], unread: 0, ...p.dms };
      if (!Array.isArray(p.sns.posts)) p.sns.posts = [];
      if (!Array.isArray(p.dms.list)) p.dms.list = [];
      const houseAliases = { goshiwon: 'house_goshiwon', officetel: 'house_officetel', apartment: 'house_apt', penthouse: 'house_pent', mansion: 'house_castle' };
      if (houseAliases[p.house]) p.house = houseAliases[p.house];
      p.houses ||= {}; p.houses[p.house] = 1;
      p.cars ||= {}; p.cars[p.car] = 1;
      const league = p.stage === 'pro' ? p.pro : p.stage === 'aca' ? p.aca : null;
      if (league && !league[p.teamId]) {
        p.legacyTeamId = p.teamId;
        p.teamId = Math.max(0, league.findIndex(t => t.id === p.teamId));
      }
      p.balanceSchema = 1;
      // 옛 키와 알 수 없는 필드는 삭제하지 않고 기본값만 보완한다.
      for (const stock of STOCKS) stock.p = p.stockPrices?.[stock.id] || stock.base;
      return p;
    } catch (e) { /* 손상된 최신 슬롯이 있어도 이전 슬롯을 확인한다. */ }
  }
  return null;
}

// ======================================================================
// 계산 & 버프 (모든 연인 버프 중첩 가능!)
// ======================================================================
function skinStatBonus(k) {
  if (!P || !P.equippedSkin) return 0;
  const s = SKINS.find(x => x.k === P.equippedSkin);
  return s?.st?.[k] || 0;
}
function ovr(p = P) {
  if (!p || !p.pos || !p.s) return 0;
  const posConfig = POS[p.pos];
  if (!posConfig || !posConfig.w) return 0;
  const w = posConfig.w; let t = 0;
  for (const k in w) t += (p.s[k] + skinStatBonus(k)) * w[k];
  return t;
}
const condF = () => (0.8 + 0.2 * P.hp / 100) * (1 - Math.max(0, P.stress - 50) / 250);
function gearB() {
  let b = 1 + Object.keys(P.gear).reduce((a, k) => a + (GEAR.find(g => g.k === k)?.b || 0), 0);
  if (P.bonds?.harin?.aff >= 50) b += 0.25; // 하린 훈련 보너스
  return b;
}
function updateKrRank() {
  if (!P) return;
  if (!P.krLeaderboard || P.krLeaderboard.length < 50) {
    P.krLeaderboard = generateKrLeaderboard();
  }
  if (!P.rank) return;

  // 천상계 랭킹 판정 (마스터 1~800, 그마 800~1200, 챌린저 1200+ & Top 50)
  if (P.rank.t >= 7) {
    const lp = P.rank.lp;
    if (lp >= 1200) {
      const cut50 = P.krLeaderboard[49]?.baseLp || 1200;
      if (lp >= cut50) {
        P.rank.t = 9; // 챌린저
        let rank = 1;
        for (let i = 0; i < 50; i++) {
          if (lp < P.krLeaderboard[i].baseLp) rank++;
          else break;
        }
        P.rankNum = Math.min(50, rank);
        if (P.rankNum === 1 && !P.rank1Notified) {
          P.rank1Notified = true;
          toast('👑 한국 서버 솔로랭크 1위(솔랭 패왕)에 등극했습니다!');
        }
      } else {
        P.rank.t = 8; // 그랜드마스터 (1200점 이상이나 50위 밖)
        P.rankNum = null;
      }
    } else if (lp >= 800) {
      P.rank.t = 8; // 그랜드마스터
      P.rankNum = null;
    } else {
      P.rank.t = 7; // 마스터
      P.rankNum = null;
    }
  }
}

function tierName(r = P.rank) {
  if (r.t < 7) {
    const bName = BASE_TIERS[r.t] || '골드';
    const div = DIVISIONS[r.div !== undefined ? r.div : 3];
    return `${bName} ${div} ${Math.floor(r.lp)}LP`;
  }
  updateKrRank();
  if (r.t === 7) return `마스터 ${Math.floor(r.lp)}LP`;
  if (r.t === 8) return `그랜드마스터 ${Math.floor(r.lp)}LP`;
  if (r.t === 9) {
    if (P.rankNum === 1) return `👑 챌린저 1위 (${Math.floor(r.lp)}LP)`;
    return `챌린저 ${P.rankNum ? P.rankNum + '위' : ''} (${Math.floor(r.lp)}LP)`;
  }
  return `마스터 ${Math.floor(r.lp)}LP`;
}

function tierSkill(r = P.rank) {
  if (r.t < 7) {
    const divStep = (r.div || 0) * 1.5;
    return TIER_SK[r.t] + divStep + (r.lp / 100) * 1.5;
  }
  return 62 + (r.lp / 40);
}
function myTeam() {
  if (P.stage === 'pro') return P.pro[P.teamId];
  if (P.stage === 'aca') return P.aca[P.teamId];
  return null;
}
function teamPow() {
  const t = myTeam();
  let baseSyn = P.syn;
  if (P.bonds?.mina?.aff >= 50) baseSyn = Math.min(5, baseSyn + 2); // 민아 시너지 보너스
  let skinBonus = P.equippedSkin === 'skin_legend' ? 2 : P.equippedSkin === 'skin_mythic' ? 5 : 0;
  return t.str * 0.62 + ovr() * condF() * 0.38 + baseSyn + skinBonus;
}

function grow(k, base) {
  if (!P?.s || !Object.prototype.hasOwnProperty.call(P.s, k) || !Number.isFinite(P.s[k])) return 0;
  const cur = P.s[k];
  let decay;
  if (cur < 60) {
    decay = 1.0;
  } else if (cur < 85) {
    decay = 1.0 - (cur - 60.0) / 45.0;
  } else if (cur < 100) {
    decay = 0.44 * (1.0 - (cur - 85.0) / 25.0);
  } else {
    decay = 0.15 * Math.exp(-(cur - 100.0) / 20.0);
  }

  let g = base * gearB() * (0.55 + 0.45 * P.hp / 100) * (1 - P.stress / 220) * decay * rnd(.85, 1.15) * (P.talent || 1);
  if (P.perk === 'mech' && (k === 'mech' || k === 'lane')) g *= 1.25;
  if (P.bonds?.seolah?.aff >= 75) g *= 1.4;
  else if (P.bonds?.seolah?.aff >= 25) g *= 1.2;
  if (k === 'mental') g = base * decay * rnd(.85, 1.15);

  g *= 1 + heroineBonus(k);
  g = Math.max(0.05, g);
  const nextVal = +(cur + g).toFixed(2);
  P.s[k] = Math.max(cur, Math.min(130, nextVal));

  if (cur < 100 && P.s[k] >= 100) {
    playJackpotSound();
    toast(`⚡ [스탯 초월] ${STATS[k].n} 100 돌파! 초월의 경지에 올랐습니다!`);
  }

  checkAchievements();
  return g;
}
function addLP(d) {
  const r = P.rank;
  r.lp += d;
  if (r.t < 7) {
    while (r.lp >= 100 && r.t < 7) { r.lp -= 100; r.t++; if (r.t === 7) { r.lp = Math.max(0, r.lp); } }
    while (r.lp < 0 && r.t > 0) { r.t--; r.lp += 100; r.lp = Math.min(r.lp, 75); }
    if (r.t === 0) r.lp = Math.max(0, r.lp);
  }
  if (r.t >= 7) {
    if (r.lp < 0) { r.t = 6; r.lp = 75; }
    else updateKrRank();
  }
  P.bestT = Math.max(P.bestT, r.t);
  const unlocks = checkHeroineUnlocks();
  if (activeWeekBriefing?.player===P) activeWeekBriefing.pendingUnlocks.push(unlocks);
  checkAchievements();
}
function stressAdd(v) {
  if (v > 0) v *= (P.gear?.chair1 ? .8 : 1) * (1 - heroineBonus('stress'));
  let mult = (1.25 - P.s.mental / 160);
  if (P.bonds?.jieun?.aff >= 50 && v > 0) mult *= 0.6; // 지은 힐링 보너스
  P.stress = clamp(P.stress + v * mult, 0, 100);
}
function hpAdd(v) {
  if (v < 0 && P.gear.sleeve1) v *= .85;
  if (v < 0 && P.gear.chair1) v *= .85;
  if (v < 0 && P.bonds?.jieun?.aff >= 75) v *= .85;
  if (v > 0 && P.bonds?.jieun?.aff >= 25) v *= 1.4;
  P.hp = clamp(P.hp + v, 0, Math.max(100, P.maxHp || 100));
}

function checkAchievements() {
  if (!P || !P.achieves) return;
  for (const ach of ACHIEVES) {
    if (!P.achieves[ach.k] && ach.check()) {
      P.achieves[ach.k] = Date.now();
      if (ach.m) P.money += ach.m;
      if (ach.f) ach.f();
      toast(`🏆 업적 달성: [${ach.n}] ${ach.r}`);
      save();
    }
  }
}

async function showHeroineCutscene(hid, bodyHtml, btns = [{ t: '확인', cls: 'pink' }], sceneImg = null, sceneLabel = null, outfitLabel = null, mood = 'normal', youthScene = null) {
  // 솔랭 LP 갱신에서 동시에 발생한 장면도 한 장씩 감상한 뒤 주간 결과로 이어진다.
  const turn=activeWeekBriefing;
  const show=()=>presentHeroineCutscene(hid,bodyHtml,btns,sceneImg,sceneLabel,outfitLabel,mood,youthScene);
  if (!turn || turn.player!==P) return await show();
  const scene=(turn.sceneTail || Promise.resolve()).then(show);
  turn.sceneTail=scene;
  return await scene;
}
async function presentHeroineCutscene(hid, bodyHtml, btns, sceneImg, sceneLabel, outfitLabel, mood, youthScene=null) {
  const h = HEROINES[hid];
  const authored=youthScene && SAFE_YOUTH_PRESENTATIONS.has(youthScene) && youthScene.hid===hid;
  if(authored){sceneImg=h.img;sceneLabel=youthScene.place;outfitLabel='편안한 일상복';mood='normal';
    bodyHtml='<h4>'+uiText(youthScene.title)+'</h4><div class="vn-dialogue">'+uiText(youthScene.text)+'</div>';
    btns=youthScene.options.map(x=>({t:uiText(x.t),cls:'pink'}));
  }
  if (!authored && !canAdultRomance(hid)) {
    const narrative = bodyHtml.includes('class="vn-dialogue');
    // 미성년 참여자에게는 원본 CG/복장/신체 접촉 문구가 렌더링되지 않도록 공통 경계에서 보호한다.
    sceneImg = h.img; sceneLabel = '함께 나누는 응원'; outfitLabel = '편안한 일상복'; mood = 'normal';
    bodyHtml = bodyHtml.replace(/<div class="vn-dialogue[^\"]*">[\s\S]*?<\/div>/g,
      '<div class="vn-dialogue">오늘 연습도 수고했어. 건강을 챙기면서 다음 목표를 준비하자. 언제나 응원할게.</div>');
    bodyHtml = bodyHtml.replace(/<h[34][^>]*>[\s\S]*?<\/h[34]>/g, '<h4>인연 이야기</h4>');
    btns = btns.map((b, i) => narrative ? { ...b, t: btns.length === 1 ? '대화 마치기' : i === 0 ? '응원의 마음을 전한다' : '차분하게 이야기를 나눈다' } : b);
  }
  const imgSrc = sceneImg || h.img;
  const fallbackSrc = h.fallback;
  const labelHtml = sceneLabel ? `<span class="vn-scene">📍 ${sceneLabel}</span>` : '';
  const outfitHtml = outfitLabel ? `<span class="vn-outfit-badge">👗 ${outfitLabel}</span>` : '';

  const portraitHtml = `
    <div class="vn-portrait mood-${mood}">
      <img src="${imgSrc}" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${fallbackSrc}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${fallbackSrc}';}else{this.onerror=null;this.src='assets/jieun.jpg';}" alt="${h.name}">
      <span class="vn-tag">${h.tag}</span>
      ${outfitHtml}
      ${labelHtml}
    </div>
    <div class="c"><span class="vn-speaker">${h.name} (${h.age}세)</span></div>
  `;
  return await ask(portraitHtml + bodyHtml, btns);
}

async function doAction(k, recommendedDate = null) {
  const a = ACTS.find(x => x.k === k);
  const before = JSON.parse(JSON.stringify(P.s)), r0 = { ...P.rank }, m0 = P.money, f0 = P.fans;
  let extra = '';
  if (a.cost) P.money -= a.cost;

  if (k === 'date') {
    if (recommendedDate) {
      const {hid,dateId}=recommendedDate;
      const date=P.bonds?.[hid]?.unlocked && getHeroineDates(hid).find(d=>(d.id || d.n)===dateId);
      if(!date || (P.weeklyDates || 0)>=1 || P.hp<8 || P.money<date.c)return null;
      const choice=await ask(`<h3>${uiText(HEROINES[hid].name)} · 추천 인연 일정</h3><p class="dialog-intro">${uiText(date.n)}<br>비용 ${won(date.c)}원 · 체력 -8 · 스트레스 ${date.st}<br>이번 주 소통으로 기록되며 주간 데이트 1회를 사용합니다.</p>`,[{t:'이 코스로 만난다',cls:'pink'},{t:'취소',cls:'gray'}]);
      if(choice!==0)return null;
      return await performHeroineDate(hid,dateId)?'<div class="delta">추천한 인연 일정을 마쳤습니다.</div>':null;
    }
    return await handleDatingAction();
  }

  if (k === 'pcbang') {
    hpAdd(a.hp); stressAdd(a.st);
    return await playPcBangTournament();
  }

  switch (k) {
    case 'solo': {
      let w = 0, l = 0;
      const n = 15;
      let eff = ovr() * condF();
      if (P.bonds?.harin?.aff >= 30) eff += 3;
      for (let i = 0; i < n; i++) {
        const p = clamp(sig((eff - tierSkill()) / 5.5), .15, .85);
        const master = P.rank.t >= 7;
        if (Math.random() < p) { w++; addLP(master ? rint(12, 18) : rint(18, 24)); }
        else { l++; addLP(master ? -rint(12, 18) : -rint(16, 21)); }
      }
      // 총 기본 성장량 3.1은 유지하며 라인별 OVR 가중치에 맞춰 분배한다.
      for (const [stat, weight] of Object.entries(POS[P.pos].w)) grow(stat, 3.1 * weight);
      if (P.rank.t >= 7) P.fans += Math.round((P.rank.t - 6) * 40 * rnd(.6, 1.4));
      extra = `<div>📊 ${w}승 ${l}패 (승률 ${Math.round(w / n * 100)}%)</div>`;
      if (l > w + 3) stressAdd(8);
      break;
    }
    case 'lane': grow('lane', 2.6); grow('mech', 1.0); break;
    case 'mech': grow('mech', 2.7); break;
    case 'vod': grow('macro', 2.6); grow('team', .9); break;
    case 'pool': grow('pool', 3.0); break;
    case 'scrim': grow('team', 2.5); grow('macro', 1.4); P.syn = Math.min(5, P.syn + (P.perk === 'order' ? 2 : 1)); break;
    case 'stream': {
      let mul = 1;
      if (P.bonds?.sora?.aff >= 30) mul = 1.6;
      const inc = (100000 + P.fans * 25 * rnd(.7, 1.3)) * mul;
      P.money += inc; P.fans += Math.round((20 + P.fans * .04 * rnd(.5, 1.5)) * mul); grow('mech', .3);
      break;
    }
    case 'rest': break;
    case 'care': grow('mental', 2.2); break;
  }
  hpAdd(a.hp); stressAdd(a.st);
  if (k !== 'scrim' && P.stage !== 'ama') P.syn = Math.max(0, P.syn - .3);

  let statBadges = [];
  for (const s in STATS) {
    const d = P.s[s] - before[s];
    if (d >= .05) statBadges.push(`<span class="badge-pill bg-purple">${STATS[s].n} +${d.toFixed(1)}</span>`);
  }
  let rankHtml = '';
  if (k === 'solo') {
    const up = P.rank.t > r0.t ? ' 🎉 승급!' : P.rank.t < r0.t ? ' 😢 강등' : '';
    rankHtml = `<div style="margin:4px 0">🏅 <span style="color:${TIER_C[r0.t]}">${tierName(r0)}</span> → <b style="color:${TIER_C[P.rank.t]}">${tierName()}</b>${up}</div>`;
  }
  let moneyBadge = P.money !== m0 ? `<span class="badge-pill ${P.money > m0 ? 'bg-gold' : 'bg-red'}">💰 ${P.money > m0 ? '+' : ''}${won(P.money - m0)}원</span>` : '';
  let fanBadge = P.fans !== f0 ? `<span class="badge-pill bg-green">👥 팬 +${num(P.fans - f0)}</span>` : '';
  let hpBadge = `<span class="badge-pill ${a.hp >= 0 ? 'bg-green' : 'bg-red'}">❤️ 체력 ${a.hp >= 0 ? '+' : ''}${a.hp}</span>`;
  let stBadge = `<span class="badge-pill ${a.st <= 0 ? 'bg-green' : 'bg-red'}">😵 스트레스 ${a.st <= 0 ? '' : '+'}${a.st}</span>`;

  return `
    <div class="delta" style="padding:10px">
      ${extra}
      ${rankHtml}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
        ${hpBadge}${stBadge}${moneyBadge}${fanBadge}
        ${statBadges.join('')}
      </div>
    </div>
  `;
}

// ======================================================================
// Web Audio 사운드 신디사이저 (외부 파일 없이 순수 JS로 구현)
// ======================================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSoundTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1, delay = 0) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  } catch (e) {}
}

function playJackpotSound() {
  // 경쾌하고 화려한 팡파레 아르페지오 (C5 - E5 - G5 - C6 - E6 - G6)
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
  notes.forEach((freq, idx) => {
    playSoundTone(freq, 'triangle', 0.28, 0.18, idx * 0.08);
  });
}

function playDateSound() {
  // 로맨틱한 하프 화음 (F5 - A5 - C6)
  [698.46, 880.00, 1046.50].forEach((freq, idx) => {
    playSoundTone(freq, 'sine', 0.45, 0.12, idx * 0.1);
  });
}

function playCoinSound() {
  playSoundTone(987.77, 'square', 0.1, 0.08, 0);
  playSoundTone(1318.51, 'square', 0.2, 0.08, 0.08);
}

async function checkBondMilestone(hid) {
  const player=P,h = HEROINES[hid], b = P.bonds[hid];
  for (const st of h.story) {
    if (b.aff >= st.req && b.lv < st.lv) {
      b.lv = st.lv;
      const chBtns = st.choice.map((c, i) => ({ t: c, cls: i === 0 ? 'pink' : 'purple' }));
      const youth=!canAdultRomance(hid)?youthMilestonePresentation(hid,st.lv):null;
      const choice = youth?await showYouthPresentation(hid,youth):await showHeroineCutscene(hid, `
        <h4 style="color:#f472b6;margin:4px 0 8px;text-align:center">[인연 스토리] ${st.title}</h4>
        <div class="vn-dialogue">${st.dialogue}</div>
        <div class="c" style="color:#4ade80;font-size:12.5px;font-weight:700;margin-bottom:6px">적용 패시브: ${h.buff} · 선택한 대화 방식이 관계에 기록됩니다.</div>
      `, chBtns, st.img, st.title);
      if(P!==player)return;
      if (choice < 0) { b.lv = Math.max(0, st.lv - 1); return; }
      b.storyChoices ||= {}; b.storyChoices[st.lv] = choice;
      b.relationshipStyle = choice === 0 ? 'support' : 'independent';
      if(!canAdultRomance(hid)){b.youthMilestones=Array.isArray(b.youthMilestones)?b.youthMilestones.filter(x=>Number.isInteger(x)&&x>=1&&x<=4):[];if(!b.youthMilestones.includes(st.lv))b.youthMilestones.push(st.lv);}
      else if(st.lv===4)b.adultLifetimePromise=true;
      if(youth){if(!b.youthStoryTags || typeof b.youthStoryTags!=='object' || Array.isArray(b.youthStoryTags))b.youthStoryTags={};b.youthStoryTags[st.lv]=youth.options[choice]?.tag || 'listened';}
      if (choice === 0) stressAdd(-5); else grow('mental', 0.3);
      toast('인연 Lv.' + b.lv + ' 달성: ' + h.name);
      save();
    }
  }
  // 청춘의 완주를 성인 동반자 약속으로 오인하지 않는다. 성인 도달 후 새 의사를 묻는다.
  if(canAdultRomance(hid) && b.aff>=100 && b.lv>=4 && Array.isArray(b.youthMilestones) && b.youthMilestones.includes(4) && !b.adultLifetimePromise && !b.married){
    const st=h.story.find(x=>x.lv===4);if(!st)return;
    const choice=await showHeroineCutscene(hid,'<h4>'+uiText(st.title)+'</h4><div class="vn-dialogue">'+uiText(st.dialogue)+'</div>',st.choice.map(t=>({t,cls:'pink'})),st.img,st.title);
    if(P!==player || choice<0)return;
    b.adultLifetimePromise=true;b.adultLifetimeChoice=choice;save();
  }
}

function contractBonusTerms(baseSal) {
  const base = Math.max(0, Math.round(Number.isFinite(baseSal) ? baseSal : 0));
  return { baseSal: base, pog: Math.min(100000, Math.round(base * .1)), title: Math.min(500000, Math.round(base * .5)), cap: Math.min(1000000, base * 2) };
}
function salaryContractYear() { return P.year + (P.week >= 24 ? 1 : 0); }
function validContractBonus(c) {
  if (!c || typeof c !== 'object' || Array.isArray(c)) return false;
  const terms = contractBonusTerms(c.baseSal);
  return Number.isInteger(c.year) && c.year >= 1 && Number.isInteger(c.teamId) && ['pro','aca'].includes(c.stage) &&
    Number.isInteger(c.startGames) && c.startGames >= 0 && Number.isInteger(c.signedWeek) && c.signedWeek >= 1 && c.signedWeek <= YEAR_WEEKS &&
    c.baseSal > 0 && ['pog','title','cap'].every(k => c[k] === terms[k]) && Number.isFinite(c.paid) && c.paid >= 0 && c.paid <= c.cap;
}
function validContractBonusHistory(history) {
  return Array.isArray(history) && history.length <= 480 && history.every(x => x && Number.isInteger(x.year) && x.year >= 1 &&
    Number.isInteger(x.week) && x.week >= 1 && x.week <= YEAR_WEEKS && ['pog','title'].includes(x.kind) && typeof x.key === 'string' &&
    typeof x.label === 'string' && Number.isInteger(x.amount) && x.amount > 0 && x.amount <= (x.kind === 'pog' ? 100000 : 500000));
}
function commitSalaryContract(draft, finalSal) {
  if (!draft || draft.player !== P || draft.salary !== finalSal || draft.committed) return false;
  draft.committed = true;
  // 일반 계약으로 갈아타면 옵션은 끝난다. 취소한 협상은 이 확정 경로를 지나지 않는다.
  P.contractBonus = draft.incentive ? { ...contractBonusTerms(draft.baseSal), year:draft.year, signedWeek:P.week,
    teamId:P.teamId, stage:P.stage, startGames:P.hist.games || 0, paid:0 } : null;
  return true;
}
function payContractBonus(kind, key, label) {
  const c = P?.contractBonus;
  if (!validContractBonus(c) || c.year !== P.year || c.stage !== P.stage || c.teamId !== P.teamId || !['pog','title'].includes(kind)) return 0;
  const history = validContractBonusHistory(P.contractBonusHistory) ? P.contractBonusHistory : [];
  if (history.some(x => x.year === P.year && x.key === key)) return 0;
  // 같은 해 계약을 다시 맺어도 이미 받은 성과급은 연간 한도에 포함한다.
  const yearPaid = history.filter(x => x.year === P.year).reduce((sum,x) => sum+x.amount,0);
  const amount = Math.min(c[kind], c.cap-c.paid, c.cap-yearPaid);
  if (amount <= 0) return 0;
  c.paid += amount; P.money += amount;
  P.contractBonusHistory = [...history,{year:P.year,week:P.week,kind,key,label:String(label),amount}].slice(-480);
  P.hist.log.push(`${P.year}년차 ${label} · 계약 성과급 +${num(amount)}원`);
  toast(`계약 성과급 +${num(amount)}원 · ${label}`);
  return amount;
}
function recordTitleReward(title) {
  P.hist.titles.push(title);
  return payContractBonus('title',`title:${title}`,title);
}
function renderContractBonusLedger() {
  const c = validContractBonus(P?.contractBonus) ? P.contractBonus : null;
  const history = validContractBonusHistory(P?.contractBonusHistory) ? P.contractBonusHistory : [];
  if (!c && !history.length) return '';
  const active = c && c.year === P.year && c.stage === P.stage && c.teamId === P.teamId;
  const yearPaid = history.filter(x => x.year === (c?.year || P.year)).reduce((sum,x) => sum+x.amount,0);
  return `<details class="brief-details" data-contract-bonus><summary>계약 성과급 · 지급 내역</summary><p>${c ? `${c.year}년차 적용 계약 (${active ? '적용 중' : c.year > P.year ? '다음 시즌 대기' : '적용 종료'}) · POG ${num(c.pog)}원 / 우승 ${num(c.title)}원<br>연간 한도 ${num(c.cap)}원 · 적용 시즌 지급 ${num(yearPaid)}원 · 남은 한도 ${num(Math.max(0,c.cap-yearPaid))}원` : '현재 유효한 성과급 옵션 없음'}</p>${history.length ? history.slice().reverse().map(x=>`<p>${x.year}년차 ${x.week}주 · ${uiText(x.label)} · +${num(x.amount)}원</p>`).join('') : '<p>지급 내역이 없습니다.</p>'}<p class="subtle">표시한 시즌에만 적용하며, 새 계약으로 교체됩니다. 24주 이후 서명한 계약은 다음 시즌에 적용됩니다. 재열람은 보상을 지급하지 않습니다.</p></details>`;
}
async function negotiateSalary(team, baseSal, isRenew, draft = null) {
  const player = P;

  const html = `

    <h3>${team.name} 연봉 협상 테이블</h3>
    <div class="c" style="color:#9aa4b2;margin-bottom:10px">

    </div>

  `;

  const stratBtns = [
    { t: '✍️ 1. 제시액에 만족하고 즉시 서명<br><small style="font-weight:500;color:#94a3b8">안전 · 구단 신뢰도↑ (팀 호흡 +1)</small>', cls: 'green' },
    { t: '📈 2. 활약상 어필 (+25% 인상 요구)<br><small style="font-weight:500;color:#94a3b8">평점과 실력에 근거한 정당한 인상 요구</small>', cls: 'gold' },
    { t: '💼 3. 리그 최고 대우 요구 (+50% 파격 인상)<br><small style="font-weight:500;color:#94a3b8">성공 시 역대급 초대형 계약! 실패 시 구단 난색 & 삭감 리스크</small>', cls: 'purple' },
    { t: `🏆 4. 성과급 인센티브 옵션 계약<br><small style="font-weight:500;color:#94a3b8">+10% 기본급 · POG ${num(contractBonusTerms(baseSal).pog)}원 / 우승 ${num(contractBonusTerms(baseSal).title)}원<br>${contractYear}년차 적용 · 연간 한도 ${num(contractBonusTerms(baseSal).cap)}원 · 다음 계약 시 교체</small>`, cls: 'gray' }
  ];

  if (hasMina) {
    stratBtns.unshift({
      t: '💖 [민아 찬스] 매니저 민아의 막후 중재 협상<br><small style="font-weight:500;color:#fbcfe8">100% 안전하게 +30% 기본급 인상</small>',
      cls: 'pink'
    });
  }

  const cIdx = await ask(html, stratBtns);
  if (P !== player || cIdx < 0 || !stratBtns[cIdx]) return null;
  let choice = stratBtns[cIdx].t;

  if (choice.includes('민아 찬스')) {
    sal = Math.round(sal * 1.3);
    signed = await showHeroineCutscene('mina', `
      <div class="vn-dialogue">"단장님이랑 프런트 회의 다녀왔어! 네 경기 지표랑 해외 오퍼 루머 들이밀면서 설득했지. 30% 파격 인상에 성공했어! 누나 멋있지?"</div>

    }

    } else {
      sal = Math.round(sal * 0.9);
      stressAdd(15);
      signed = await ask(`<div class="em">📉</div><h3>협상 난항 & 삭감</h3><p class="c">구단 프런트: "무리한 요구로 협상 분위기가 냉각되었습니다. 재조정된 10% 삭감안이 최종 통보입니다."</p><div class="c" style="color:#ef4444;font-size:15px;font-weight:800">조정 주급 ${won(sal)}원</div>`, [{ t: '어쩔 수 없이 서명', cls: 'red' }]);
    }

    sal = Math.round(sal * 1.1);
    const terms = contractBonusTerms(baseSal);
    signed = await ask(`<div class="em">🏆</div><h3>인센티브 옵션 계약</h3><p class="c">기본 주급 10% 인상 + 공식 경기 POG ${num(terms.pog)}원 / 대회 우승 ${num(terms.title)}원.<br>${contractYear}년차에만 적용하며 연간 총 ${num(terms.cap)}원까지 지급합니다.${contractYear > P.year ? ' 이번 스토브리그 계약은 다음 시즌부터 적용됩니다.' : ''} 새 계약을 맺으면 옵션이 교체됩니다. 일반 승리는 별도 성과급이 없습니다.</p><div class="c" style="color:#ffd23f;font-size:16px;font-weight:900">최종 주급 ${won(sal)}원</div>`, [{ t: '옵션 서명', cls: 'gold' }]);
  }

  if (P !== player || signed < 0) return null;
  if (draft) Object.assign(draft,{player,baseSal,year:contractYear,salary:sal,incentive:choice.includes('4.')});
  return sal;
}

function teamName() { const t = myTeam(); return t ? t.name : '아마추어'; }

function matchSetScore(label, win, phaseWins, adv, rating) {
  const target = /그랜드 파이널|월즈 결승|월드 챔피언십 결승|아시안게임 결승|한중 결승/.test(label) ? 3 : 2;
  const loser = phaseWins === 0 ? (win ? target - 1 : 0) : phaseWins >= 2 && (adv >= 2 || rating >= 8) ? (win ? 0 : target - 1) : 1;
  return { mySetW: win ? target : Math.min(target - 1, loser), mySetL: win ? Math.min(target - 1, loser) : target };
}
function settleMatchResult({ win, rating, phaseWins, big, label = '공식 경기', opponent = null }) {
  const mvp = win && rating >= 8.3 && phaseWins >= 2;
  P.hist.games++; if (win) P.hist.wins++; if (mvp) P.hist.mvp++;
  if (mvp) payContractBonus('pog',`pog:${P.hist.games}`,`${label} POG`);
  P.hist.winStreak = win ? (P.hist.winStreak || 0) + 1 : 0;
  if (phaseWins === 3) P.hist.superplays = (P.hist.superplays || 0) + 1;
  P.ratings.push(rating);
  let fanMul = 1;
  if (P.bonds?.sora?.aff >= 50) fanMul += 0.6;
  if (P.bonds?.chloe?.aff >= 50) fanMul += 1;
  if (P.bonds?.sea?.aff >= 50) fanMul += 0.5;
  fanMul *= (P.perk === 'fame' ? 2 : 1) * (1 + (VEHICLES[P.car]?.fanBonus || 0) / 100 + heroineBonus('fans'));
  const base = phaseWins === 0 ? (win ? 50 : -Math.round(P.fans * .02 + 150)) : Math.round((win ? (phaseWins === 3 ? 1200 : 600) : 150) * (P.stage === 'pro' ? 1.5 : 1) * (big ? 2 : 1) * fanMul * rnd(.8,1.2));
  P.fans = Math.max(0, P.fans + base);
  if (win) stressAdd(phaseWins === 0 ? 5 : -6); else stressAdd(big ? 15 : 9);
  hpAdd(-8); grow('team', .5); grow('mental', .25); checkAchievements();
  if (activeWeekBriefing?.player===P) activeWeekBriefing.matches.push({label,win,rating,mvp});
  recordSeasonMatch(opponent,label,win);
  return { mvp, fanGain: base };
}

async function playMatch(opp, label, big = false, isFastAuto = false) {
  if (P.fastSkip || isFastAuto) {
    // 빠른 진행: 챔피언 선택 모달 생략 & AI 최적 픽 자동 시뮬레이션
    const myPos = P.pos || 'mid';
    const myCandidates = CHAMPIONS.filter(c => c.role === myPos);
    const selChamp = myCandidates[0] || CHAMPIONS[0];
    const myPow = teamPow();
    const opPow = opp.str;
    const winProb = clamp(0.5 + (myPow - opPow) * 0.035, 0.1, 0.9);
    const isWin = Math.random() < winProb;
    const phaseWins = isWin ? (Math.random() < .5 ? 3 : 2) : (Math.random() < .4 ? 1 : 0);
    const rating = phaseWins === 3 ? 8.7 : phaseWins === 2 ? 7.1 : phaseWins === 1 ? 4.5 : 2;
    const adv = isWin ? 3.5 : -3.5;
    const sets = matchSetScore(label, isWin, phaseWins, adv, rating);
    const rewards = settleMatchResult({ win: isWin, rating, phaseWins, big, label, opponent:opp });
    addChampMastery(selChamp.id, 80); P.currentChamp = selChamp;
    await checkHeroineUnlocks();
    toast('[' + label + '] ' + (isWin ? '승리 ' : '패배 ') + sets.mySetW + ':' + sets.mySetL);
    return { win: isWin, rating, ...sets, ...rewards, adv };
  }
  const bp = await showLckChampionSelectModal(opp);
  const main = $('#main');
  main.dataset.view = 'match';
  const my = teamPow(), op = opp.str;
  const isCounter = !!bp?.isCounter;
  const synergy = bp?.synergy;
  let adv = (my - op) * 0.08 + (isCounter ? 1.5 : 0), perf = 0, kills = 0, deaths = 0, assists = 0, bdWin = null;
  let phaseWins = 0;
  const myName = teamName();

  let skinNameTxt = '';
  if (P.equippedSkin) {
    const sk = SKINS.find(x => x.k === P.equippedSkin);
    if (sk) skinNameTxt = `<span class="skin-tag ${sk.tagCls}" style="margin-left:6px">${sk.n} 착용</span>`;
  }

  const renderHead = () => {
    const pct = clamp(sig(adv / 2.8) * 100, 4, 96);
    const gd = adv * 1000;
    return `<div class="card"><div class="mlabel">${label} ${skinNameTxt}</div>
      <div class="mhead"><div class="tm">${myName}<small>전력 ${my.toFixed(1)}</small></div><div class="vs">VS</div>
      <div class="tm">${opp.name}<small>전력 ${op.toFixed(1)}</small></div></div>
      <div class="gold"><div class="tr"><div class="fi" style="width:${pct}%"></div></div>
      <div class="gl"><span>골드 ${gd >= 0 ? '+' + num(gd) : ''}</span><span>${gd < 0 ? '+' + num(-gd) : ''}</span></div></div></div>`;
  };
  let log = '';

    Array.isArray(r.events) && r.events.every(x=>typeof x==='string') && Array.isArray(r.matches) && r.matches.every(x=>x && typeof x.label==='string' && Number.isFinite(x.rating)) &&

async function weekEnd(isFastAuto = false, beforeCareerEnd = null) {

    if (cohabiter) {
      hpAdd(P.perk === 'love' ? 30 : 20);

    }
  }
  const ph = phaseOf(P.week);
  const lg = P.stage === 'pro' ? P.pro : P.stage === 'aca' ? P.aca : null;

  if (lg && ph.t === 'reg') {

    const opps = lg.filter(t => t.id !== me.id);
    const opp = opps[(ph.r - 1 + P.year) % opps.length];

    if (!opp.setW) { opp.setW = opp.w * 2; opp.setL = opp.l * 2; }
    if (res.win) {
      me.w++; opp.l++;
      me.setW += (res.mySetW || 2); me.setL += (res.mySetL || 0);
      opp.setW += (res.mySetL || 0); opp.setL += (res.mySetW || 2);
    } else {
      me.l++; opp.w++;
      me.setW += (res.mySetW || 0); me.setL += (res.mySetL || 2);
      opp.setW += (res.mySetL || 2); opp.setL += (res.mySetW || 0);
    }
    simRound(lg, [me.id, opp.id]);
    if (P.stage === 'aca') await checkCallUp();
  }
  if (ph.t === 'reg') {
    if (P.stage !== 'pro') simRound(P.pro, []);
    if (P.stage !== 'aca') simRound(P.aca, []);
  }
  // 아시안게임은 checkAsianGames의 2/4년차 13주차 조건 한 곳에서 진행한다.
  if (ph.t === 'po') await playoffs(ph.sp);
  if (ph.t === 'wg' || ph.t === 'wk' || ph.t === 'wf') await worlds(ph.t);
  if (ph.t === 'con') await contracts();

  settleWeeklyResources();
  updateStockMarket();
  await checkAsianGames();


  if (P.stress >= 100) {
    if (P.perk === 'clutch') { P.stress = 60; } else if (P.bonds?.jieun?.aff >= 75) {
      P.stress = 60;
      await showHeroineCutscene('jieun', `<h3>💖 지은이의 따뜻한 간호</h3><div class="vn-dialogue">"너 번아웃 온 것 같아서 숙소 앞으로 바로 뛰어왔어. 오늘은 아무 생각도 하지 말고 푹 쉬어... 내가 곁에 있어줄게."<br><br><b>소꿉친구 지은의 헌신으로 번아웃 위기를 넘겼습니다!</b></div>`, [{ t: '고마워 지은아', cls: 'pink' }], 'assets/jieun_night.jpg', '숙소 앞 밤거리');
    } else {
      P.stress = 55; P.hp = Math.min(P.hp, 40);
      if (P.stage === 'ama') addLP(-60);
      // LP 차감에서도 인연 해금이 발생할 수 있으므로 다음 알림 전에 마친다.
      await Promise.all(activeWeekBriefing?.pendingUnlocks || []);
      await ask(`<div class="em">🫠</div><h3>번아웃</h3><p class="c">스트레스가 한계에 달했다. 아무것도 손에 잡히지 않는다...</p><p class="c" style="color:#9aa4b2">체력·티어 하락. 휴식과 인연 데이트를 챙기세요.</p>`);
    }
  } else if (P.hp <= 0) {
    P.hp = 35; stressAdd(10);
    await ask(`<div class="em">🤒</div><h3>몸살</h3><p class="c">무리한 일정에 몸이 버티지 못했다.</p>`);
  }

  // 복수 연인 질투/삼자대면 이벤트 (호감도 50 이상 히로인이 2명 이상일 때)
  const highLoves = Object.keys(P.bonds).filter(k => P.bonds[k].aff >= 50);
  if (highLoves.length >= 2 && Math.random() < 0.2) {
    await triggerJealousyEvent(highLoves);
  } else if (ph.t !== 'po' && !ph.t.startsWith('w') && Math.random() < .45) {
    await randomEvent();
  }

  await scouting();
  checkAchievements();

  checkWeeklyDM();
  checkNeglectedHeroineDMs();
  await checkEndgameMilestones();
  await recordSeasonWeek(activeWeekBriefing);
  P.weeklyDates = 0;
  P.week++;
  if (P.week > YEAR_WEEKS) {
    P.week = 1; P.year++; P.age++;
    P.seasonJourney = null; // 완료한 시즌은 archive에 보존하고 새해의 진행장은 개막 때 만든다.
    syncHeroineAges();
    toast('새 시즌이 시작되었습니다. 인연의 나이와 콘텐츠 조건을 갱신했습니다.');
    P.worldsQ = false; P.springChamp = -1;
    for (const t of P.pro) { t.str = clamp(t.str + rint(-5, 5), 56, 86); t.starter = clamp(t.str + rint(-10, 2), 50, 92); }
    for (const t of P.aca) t.str = clamp(t.str + rint(-4, 4), 36, 60);
    if (P.age >= RETIRE_AGE) { if (beforeCareerEnd) await beforeCareerEnd(); await ending(true); return; }
    await ask(`<div class="em">🎆</div><h3>${P.year}년차 시즌 시작</h3><p class="c">${P.name} 선수 ${P.age}세. 새로운 시즌이 밝았다!</p>`);
  }
  const nph = phaseOf(P.week);
  if (nph.t === 'reg' && nph.r === 1) { for (const t of P.pro.concat(P.aca)) { t.w = 0; t.l = 0; t.setW = 0; t.setL = 0; } P.ratings = []; }
}

// 질투/삼자대면 이벤트
async function triggerJealousyEvent(loves) {
  const [a, b] = shuffle(loves).slice(0, 2);
  const ha = HEROINES[a], hb = HEROINES[b];

  const response = await showHeroineCutscene(a, `
    <h4 style="color:#f472b6;margin:0 0 8px;text-align:center">⚡ [깜짝 질투] 소문의 진실은?!</h4>
    <div class="vn-dialogue">"너 요즘... <b>${hb.name}</b> 씨랑 엄청 가깝게 지낸다는 소문 들었는데, 진짜야? 나한테 숨기는 거 없지?"</div>
    <div class="c" style="color:#ffd23f;font-weight:700">위기의 순간! 어떻게 대처할까요?</div>
  `, [
    { t: '💖 "내 마음속 1순위는 언제나 너야." (다정하게 포옹)', cls: 'pink' },
    { t: '🎮 "프로게이머로서의 비즈니스 관계일 뿐이야!" (철벽 해명)', cls: 'gray' },
    { t: '🎁 "너 주려고 산 선물이 있는데..." (선물로 위기 모면)', cls: 'gold' }
  ], ha.dates[0].img, '질투의 순간');

  if (response < 0) return;
  P.bonds[a].lastJealousyChoice = response;
  if (response === 0) { affectionGain(a, 3); stressAdd(-5); }
  else if (response === 1) { P.bonds[a].aff = Math.max(0, P.bonds[a].aff - 2); grow('mental', .3); }
  else if (P.money >= 30000) { P.money -= 30000; affectionGain(a, 5); }
  toast('선택한 방식으로 관계를 정리했습니다.');
}

async function checkCallUp() {
  const pro = P.pro[P.teamId];
  if (ovr() >= pro.starter - 1 && Math.random() < .6) {
    await ask(`<div class="em">📞</div><h3>1군 콜업!</h3><p class="c">${pro.name} 감독: "요즘 폼이 좋더라. 다음 경기부터 1군 주전으로 뛰어보자."</p>
      <p class="c" style="color:#9aa4b2">기존 주전(${Math.round(pro.starter)})을 밀어냈다!</p>`, [{ t: '1군 합류!', cls: 'gold' }]);
    P.stage = 'pro'; P.hist.bestStage = 'pro';
    P.salary = salaryFor(pro); P.syn = 1; P.contractBonus = null;
    pro.starter = Math.max(pro.starter, ovr());
    P.hist.log.push(`${P.year}년차 ${pro.name} 1군 콜업`);
    await checkHeroineUnlocks();
    checkAchievements();
  }
}

function salaryFor(team) {
  if (P.stage === 'aca') return 300000;
  const o = ovr();
  let sal = (800000 + Math.pow(Math.max(0, o - 50), 2) * 18000 + P.fans * 8);
  if (P.bonds?.mina?.aff >= 50) sal *= 1.25;
  return Math.round(sal / 10000) * 10000;
}

async function playoffs(sp) {
  for (const key of ['pro', 'aca']) {
    const lg = P[key];
    const top = standings(lg).slice(0, 6);
    const mine = P.stage === key ? myTeam() : null;
    const lname = key === 'pro' ? 'LCK' : 'LCK 챌린저스';
    const inPO = mine && top.includes(mine);
    const myRank = inPO ? top.indexOf(mine) + 1 : -1;

    if (mine && !inPO) {
      await ask(`<div class="em">📉</div><h3>플레이오프 진출 실패</h3><p class="c">${lname} ${sp} 정규시즌 ${standings(lg).indexOf(mine) + 1}위로 마감했습니다. 아쉽지만 오프시즌 동안 전력을 재정비해야 합니다.</p>`);
      stressAdd(10);
    }

    const play = async (a, b, label) => {
      if (inPO && (a === mine || b === mine)) {
        const opp = a === mine ? b : a;
        const r = await playMatch(opp, label, true);
        return r.win ? mine : opp;
      }
      return simGame(a, b) ? a : b;
    };

    if (inPO) {
      await ask(`
        <div class="em">🏟️</div>
        <h3>${lname} ${sp} 6강 플레이오프 개막!</h3>
        <p class="c">정규시즌 <b>${myRank}위</b>로 포스트시즌 진출에 성공했습니다!</p>
        <div style="background:#11162a;border:1px solid #3b82f6;border-radius:10px;padding:12px;margin:10px 0;font-size:12.5px;line-height:1.7">
          <div style="color:#4ade80;font-weight:700">🏆 1~2위 (${top[0].name}, ${top[1].name}): PO 2라운드(준결승) 직행</div>
          <div style="color:#fde047;font-weight:700">⚔️ PO 1R Match 1: 3위 ${top[2].name} VS 6위 ${top[5].name}</div>
          <div style="color:#fde047;font-weight:700">⚔️ PO 1R Match 2: 4위 ${top[3].name} VS 5위 ${top[4].name}</div>
        </div>
      `, [{ t: '토너먼트 돌입!', cls: 'gold' }]);
    }

    // 1라운드: 3위 vs 6위, 4위 vs 5위
    let r1_winA, r1_winB;
    if (inPO && (mine === top[2] || mine === top[5])) {
      r1_winA = await play(top[2], top[5], `${lname} ${sp} PO 1라운드 (Match 1)`);
    } else {
      r1_winA = simGame(top[2], top[5]) ? top[2] : top[5];
    }
    if (inPO && (mine === top[3] || mine === top[4])) {
      r1_winB = await play(top[3], top[4], `${lname} ${sp} PO 1라운드 (Match 2)`);
    } else {
      r1_winB = simGame(top[3], top[4]) ? top[3] : top[4];
    }

    // 1라운드 탈락 체크
    if (inPO && (myRank >= 3 && myRank <= 6)) {
      if (mine !== r1_winA && mine !== r1_winB) {
        await ask(`<div class="em">😭</div><h3>플레이오프 1라운드 탈락</h3><p class="c">치열한 다전제 접전 끝에 1라운드에서 무릎을 꿇었습니다. 다음 시즌을 기약합시다.</p>`);
        stressAdd(12);
      }
    }

    // 1~2위 휴식 보너스
    if (inPO && (myRank === 1 || myRank === 2)) {
      hpAdd(30);
      stressAdd(-20);
      toast('✨ 1/2위 2라운드 직행 어드밴티지: 충분한 휴식으로 컨디션 회복 (체력 +30, 스트레스 -20)!');
    }

    // 2라운드 (준결승) 매칭:
    const r1_winners = [r1_winA, r1_winB].sort((a, b) => top.indexOf(a) - top.indexOf(b));
    const semi1_opp = r1_winners[1]; // 낮은 시드
    const semi2_opp = r1_winners[0]; // 높은 시드

    if (inPO && (mine === top[0] || mine === top[1] || mine === r1_winA || mine === r1_winB)) {
      await ask(`
        <div class="em">⚔️</div>
        <h3>${lname} ${sp} 플레이오프 2라운드 (준결승)</h3>
        <p class="c">결승전 티켓을 건 운명의 맞대결!</p>
        <div style="background:#11162a;border:1px solid #6366f1;border-radius:10px;padding:10px;margin:8px 0;font-size:12px;line-height:1.6">
          <div><b>준결승 1경기:</b> ${top[0].name} (1위) VS ${semi1_opp.name}</div>
          <div><b>준결승 2경기:</b> ${top[1].name} (2위) VS ${semi2_opp.name}</div>
        </div>
      `, [{ t: '준결승 출전!', cls: 'gold' }]);
    }

    const f1 = await play(top[0], semi1_opp, `${lname} ${sp} 준결승 1경기`);
    const f2 = await play(top[1], semi2_opp, `${lname} ${sp} 준결승 2경기`);

    const finalist = mine && (f1 === mine || f2 === mine);
    if (inPO && !finalist && (mine === top[0] || mine === top[1] || mine === r1_winA || mine === r1_winB)) {
      await ask(`<div class="em">😭</div><h3>준결승 탈락</h3><p class="c">아쉽게 결승 문턱에서 멈췄습니다. 3/4위전 순위로 시즌을 마감합니다.</p>`);
      stressAdd(10);
    }

    // 결승전 (Grand Finals)
    if (finalist) {
      await ask(`
        <div class="em">🎆</div>
        <h3>🏆 ${lname} ${sp} 대망의 결승전!</h3>
        <p class="c">수만 관중이 운집한 특설 무대, 소환사의 컵이 눈앞에 있습니다!</p>
        <div style="background:#281534;border:2px solid #facc15;border-radius:10px;padding:12px;margin:10px 0;text-align:center">
          <div style="font-size:18px;font-weight:900;color:#facc15">${f1.name} VS ${f2.name}</div>
          <div style="font-size:12px;color:#cbd5e1;margin-top:4px">5전 3선승제 결승 매치</div>
        </div>
      `, [{ t: '결승 무대로 입장!', cls: 'gold' }]);
    }

    const champ = await play(f1, f2, `${lname} ${sp} 그랜드 파이널 (결승전)`);

    if (key === 'pro') {
      if (sp === '스프링') P.springChamp = champ.id;
      if (sp === '서머' && mine && key === P.stage) {
        P.worldsQ = finalist || P.springChamp === mine.id;
      }
    }

    if (mine && champ === mine) {
      const title = `${P.year}년차 ${lname} ${sp} 우승`;
      recordTitleReward(title);
      P.hist.log.push(title);
      const bonus = key === 'pro' ? 50000000 : 5000000;
      P.money += bonus;
      P.fans += key === 'pro' ? 20000 : 3000;
      stressAdd(-35);
      playJackpotSound();
      postToInsta(
        `🏆 ${lname} ${sp} 우승 트로피를 들어올렸습니다!`,
        'assets/harin_stage.jpg',
        `모두의 응원 덕분에 해냈습니다. 끝까지 믿어준 팬들과 팀원들에게 영광을 돌립니다! #LCK #우승 #${teamName()} #소환사의컵`
      );
      await ask(`
        <div class="em">🏆</div>
        <h3>🎉 ${lname} ${sp} 챔피언 등극!!</h3>
        <p class="c">황금빛 꽃가루가 쏟아지는 무대 한가운데서 트로피를 번쩍 들어올렸습니다!</p>
        <div class="c" style="color:#ffd23f;font-weight:900;font-size:15px;margin:10px 0">상금 +${won(bonus)}원 · 👥 팬 +${num(key === 'pro' ? 20000 : 3000)}명</div>
      `, [{ t: '우승의 감격', cls: 'gold' }]);
      checkAchievements();
    } else if (finalist) {
      await ask(`<div class="em">🥈</div><h3>준우승</h3><p class="c">결승에서 아쉽게 패배했다. 다음엔 반드시...</p>`);
      P.money += key === 'pro' ? 15000000 : 2000000;
    }
    if (key === 'pro' && sp === '서머' && P.stage === 'pro' && P.worldsQ) {
      P.worldsAlive = true; P.worldsWins = 0;
      await ask(`<div class="em">🌍</div><h3>월드 챔피언십 진출!</h3><p class="c">LCK 대표로 세계 무대에 선다!</p>`, [{ t: '가자!', cls: 'gold' }]);
    }
  }
}

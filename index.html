function checkWeeklyDM() {
  if (!P.dms) P.dms = { unread: 0, list: [] };
  if (!P.sns) P.sns = { posts: [], followers: 120 };

  // 읽지 않은 DM이 2개 이상이면 추가 발송 대기
  if (P.dms.unread >= 2) return;

  // 40% 확률로 새 DM 수신
  if (Math.random() > 0.40) return;

  const validTemplates = DM_TEMPLATES.filter(t => {
    if (!t.req(P)) return false;
    // 최근 3개 안에 같은 템플릿이 없으면 가능
    return !P.dms.list.slice(0, 3).some(m => m.templateId === t.id);
  });

  if (validTemplates.length === 0) return;
  const picked = pick(validTemplates);

  const newDm = {
    id: 'dm_' + Date.now(),
    templateId: picked.id,
    sender: picked.sender,
    badge: picked.badge,
    tagCls: picked.tagCls,
    avatar: picked.avatar,
    fallback: picked.fallback,
    msg: picked.msg,
    choices: picked.choices,
    read: false,
    time: `${P.year}년차 ${P.week}주차`
  };

  P.dms.list.unshift(newDm);
  P.dms.unread = (P.dms.unread || 0) + 1;
  toast(`[새 메시지] ${picked.sender}님으로부터 메시지가 도착했습니다!`);
}

function postToInsta(title, img, caption, comments = []) {
  if (!P.sns) P.sns = { posts: [], followers: 120 };
  const id = 'post_' + Date.now();
  const likes = rint(3000, 15000) + Math.round((P.fans || 0) * 0.35);
  
  const defaultComments = [
    { u: 'lol_pro_fan', t: '와 미쳤다 진짜 ㄷㄷ 다음 경기도 캐리 가즈아!!' },
    { u: 'esports_today', t: '오늘 경기 폼 미쳤던데요, 인터뷰도 최고였습니다 🔥' }
  ];

  P.sns.posts.unshift({
    id,
    title,
    img: img || 'assets/jieun_cafe.jpg',
    caption,
    likes,
    comments: comments.length > 0 ? comments : defaultComments,
    time: `${P.year}년차 ${P.week}주차`
  });

  const followerGain = rint(500, 2500) + Math.round((P.fans || 0) * 0.05);
  P.sns.followers = (P.sns.followers || 120) + followerGain;
  P.fans = (P.fans || 0) + Math.round(followerGain * 0.8);

  playJackpotSound();
  toast(`📸 인스타 피드 게시 완료! (❤️ 좋아요 +${num(likes)} / 팔로워 +${num(followerGain)})`);
}

async function showSnsModal() {
  if (P) {
    if (!P.sns) P.sns = { posts: [], followers: 120 };
    if (!P.dms) P.dms = { unread: 0, list: [] };
  }

  while (true) {
    const unreadCount = P.dms.list.filter(d => !d.read).length;
    let body = `
      <div class="tab-row" style="margin-bottom:12px">
        <button class="${activeSnsTab === 'feed' ? 'act' : ''}" id="tabFeed">📸 인스타 피드 (${P.sns.posts.length})</button>
        <button class="${activeSnsTab === 'dm' ? 'act' : ''}" id="tabDm">💬 DM 수신함 ${unreadCount > 0 ? `<span style="background:#ef4444;color:#fff;border-radius:99px;padding:2px 7px;font-size:11px">${unreadCount}</span>` : ''}</button>
      </div>
    `;

    let btns = [];

    if (activeSnsTab === 'feed') {
      const followersNum = (P.sns.followers || 120) + Math.round((P.fans || 0) * 1.5);
      body += `
        <div class="sns-profile">
          <div class="sns-avatar"><img src="assets/jieun.jpg" onerror="this.src='jieun.jpg'"></div>
          <div>
            <div style="font-weight:900;font-size:15px;color:#fff">${P.name} <span style="color:#38bdf8">✓</span></div>
            <div style="font-size:12px;color:#94a3b8;margin-top:2px">PRO GAMER · ${stageName()}</div>
            <div class="sns-stats" style="margin-top:8px">
              <div>게시물 <b>${P.sns.posts.length}</b></div>
              <div>팔로워 <b>${num(followersNum)}</b></div>
              <div>팔로잉 <b>10</b></div>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:12px">
          <button class="btn gold" id="bCreatePost" style="flex:1;padding:8px 4px;font-size:12.5px">➕ 새 피드 올리기</button>
          <button class="btn pink" id="bPickGallery" style="flex:1;padding:8px 4px;font-size:12.5px">📸 앨범 사진 선택</button>
        </div>
      `;

      if (P.sns.posts.length === 0) {
        body += `<div class="c" style="padding:26px 10px;color:#94a3b8;font-size:13px">아직 게시한 피드가 없습니다.<br>상단의 <b>[➕ 새 피드 올리기]</b>를 눌러 첫 게시물을 올려보세요!</div>`;
      } else {
        body += P.sns.posts.map(p => `
          <div class="feed-card">
            <div class="feed-head">
              <span style="color:#ec4899">📸</span> <b>${P.name}</b> <small style="color:#64748b;margin-left:auto">${p.time}</small>
            </div>
            <img class="feed-img" src="${p.img}" onerror="this.src='icon-512.png'" alt="피드 사진">
            <div class="feed-body">
              <div class="feed-actions">
                <span style="color:#ef4444">❤️</span> <b style="font-size:12.5px">${num(p.likes)}명이 좋아합니다</b>
              </div>
              <div class="feed-caption"><b>${P.name}</b> ${p.caption}</div>
              <div class="feed-comments">
                ${(p.comments || []).map(c => `<div class="comment-item"><b>${c.u}</b> ${c.t}</div>`).join('')}
              </div>
              <button class="btn-reply" data-replyid="${p.id}" style="margin-top:8px;width:100%;background:#1e2640;border:1px solid #33406a;border-radius:8px;padding:6px;color:#38bdf8;font-size:12px;font-weight:700;cursor:pointer">💬 팬 댓글에 답글 달기 (소통 + 팬덤 UP)</button>
            </div>
          </div>
        `).join('');
      }

    } else {
      // DM Tab
      body += `
        <div style="margin-bottom:10px">
          <button class="btn purple" id="bSendNewDm" style="width:100%;padding:10px;font-size:13.5px">✉️ 인연에게 먼저 DM(선톡) 보내기</button>
        </div>
      `;
      if (P.dms.list.length === 0) {
        body += `<div class="c" style="padding:40px 10px;color:#94a3b8;font-size:13px">수신된 다이렉트 메시지(DM)가 없습니다.<br>상단의 <b>[✉️ 선톡 보내기]</b>로 먼저 말을 걸어보세요!</div>`;
      } else {
        body += P.dms.list.map((d, idx) => `
          <div class="dm-card ${d.read ? '' : 'unread'}" data-dmidx="${idx}">
            ${d.read ? '' : '<div class="badge-unread"></div>'}
            <div class="dm-avatar"><img src="${d.avatar}" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${d.fallback}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${d.fallback}';}else{this.onerror=null;this.src='icon-512.png';}" alt="${d.sender}"></div>
            <div class="dm-info">
              <div class="dm-sender">
                ${d.sender} <span class="${d.tagCls}">${d.badge}</span>
                <small style="color:#64748b;margin-left:auto;font-weight:400">${d.time}</small>
              </div>
              <div class="dm-preview">${d.msg}</div>
            </div>
          </div>
        `).join('');
      }
    }

    btns.push({ t: '닫기', cls: 'gray', type: 'close' });

    // ask 모달 띄우기
    const choiceIdx = await new Promise(res => {
      $('#mBody').innerHTML = `<h3>📱 인스타그램 &amp; DM 센터</h3>${body}`;
      
      const tabF = $('#mBody #tabFeed');
      const tabD = $('#mBody #tabDm');
      if (tabF) tabF.onclick = () => { activeSnsTab = 'feed'; showSnsModal(); };
      if (tabD) tabD.onclick = () => { activeSnsTab = 'dm'; showSnsModal(); };

      const createBtn = $('#mBody #bCreatePost');
      if (createBtn) createBtn.onclick = () => { $('#modal').classList.add('hidden'); res({ type: 'createPost' }); };

      const pickBtn = $('#mBody #bPickGallery');
      if (pickBtn) pickBtn.onclick = () => { $('#modal').classList.add('hidden'); res({ type: 'pickFromGallery' }); };

      const sendDmBtn = $('#mBody #bSendNewDm');
      if (sendDmBtn) sendDmBtn.onclick = () => { $('#modal').classList.add('hidden'); res({ type: 'sendNewDm' }); };

      // DM 카드 클릭 이벤트
      $('#mBody').querySelectorAll('[data-dmidx]').forEach(card => {
        card.onclick = () => {
          const idx = parseInt(card.dataset.dmidx);
          $('#modal').classList.add('hidden');
          openDmChat(idx).then(() => showSnsModal());
        };
      });

      // 댓글 답글 버튼 클릭 이벤트
      $('#mBody').querySelectorAll('[data-replyid]').forEach(btn => {
        btn.onclick = () => {
          const pid = btn.dataset.replyid;
          $('#modal').classList.add('hidden');
          replyToFeedComment(pid).then(() => showSnsModal());
        };
      });

      const f = $('#mBtns'); f.innerHTML = '';
      btns.forEach((b, i) => {
        const e = document.createElement('button');
        e.className = 'btn ' + (b.cls || '');
        e.innerHTML = b.t;
        e.onclick = () => { $('#modal').classList.add('hidden'); res(b); };
        f.appendChild(e);
      });
      $('#modal').classList.remove('hidden');
    });

    if (!choiceIdx || choiceIdx.type === 'close') break;

    if (choiceIdx.type === 'createPost') {
      await openCreatePostModal();
    } else if (choiceIdx.type === 'pickFromGallery') {
      await openPhotoGalleryPicker();
    } else if (choiceIdx.type === 'sendNewDm') {
      await openSendDmModal();
    }
  }
}

async function openDmChat(idx) {
  const d = P.dms.list[idx];
  if (!d) return;
  d.read = true;
  P.dms.unread = P.dms.list.filter(x => !x.read).length;

  const chatHtml = `
    <div style="display:flex;align-items:center;gap:12px;background:#11162a;padding:12px;border-radius:12px;margin-bottom:12px">
      <div class="dm-avatar" style="width:52px;height:52px"><img src="${d.avatar}" onerror="if(this.dataset.fb!=='1'){this.dataset.fb='1';this.src='${d.fallback}';}else if(this.dataset.fb==='1'){this.dataset.fb='2';this.src='assets/${d.fallback}';}else{this.onerror=null;this.src='icon-512.png';}"></div>
      <div>
        <div style="font-weight:900;font-size:15px;color:#fff">${d.sender} <span class="${d.tagCls}">${d.badge}</span></div>
        <div style="font-size:11.5px;color:#38bdf8">${d.time} 수신</div>
      </div>
    </div>
    <div style="background:#0e1322;border:1px solid #232c48;border-radius:12px;padding:14px;font-size:14px;line-height:1.65;color:#f1f5f9;margin-bottom:12px">
      ${d.msg}
    </div>
    <div style="font-size:12px;color:#cbd5e1;margin-bottom:6px">💬 답장 선택지를 골라주세요:</div>
  `;

  const btns = d.choices.map((c, i) => ({
    t: `<b>${c.t}</b><small style="display:block;color:#4ade80;font-size:11px;margin-top:2px">${c.gain}</small>`,
    cls: i === 0 ? 'gold' : 'gray',
    act: c.act
  }));
  btns.push({ t: '나중에 답장하기', cls: 'gray' });

  const chosenIdx = await ask(chatHtml, btns);
  const chosen = btns[chosenIdx];
  if (chosen && chosen.act) {
    chosen.act(P);
    playDateSound();
    toast('💬 답장을 전송했습니다!');
    save(); render();
  }
}

const TEAM_COMPS = {
  dive: { name: '🔥 돌진·이니시 조합 (Dive)', desc: '한타 개시력 +18% · 킬 캐치', champs: ['vi', 'nautilus', 'kaisa', 'sylas', 'aatrox'] },
  wombo: { name: '🛡️ 밸런스 한타 조합 (Wombo)', desc: '후반 30분 한타 승률 +22%', champs: ['orianna', 'azir', 'ksante', 'jinx', 'thresh'] },
  poke: { name: '⚡ 포킹·암살 조합 (Poke & Pick)', desc: '초반 라인전 주도권 +18%', champs: ['zed', 'leblanc', 'zeri', 'leesin', 'yasuo'] }
};

function getChampIcon(c) {
  return `assets/champs/${c.id}.png`;
}

function analyzeCompSynergy(champList) {
  const ids = champList.map(c => c.id);
  for (const [k, comp] of Object.entries(TEAM_COMPS)) {
    const matchCount = ids.filter(id => comp.champs.includes(id)).length;
    if (matchCount >= 2) {
      return { key: k, ...comp, count: matchCount };
    }
  }
  return { key: 'standard', name: '⚖️ 스탠다드 밸런스 조합', desc: '모든 국면 안정적인 경기력', count: 1 };
}

async function showLckChampionSelectModal(opp) {
  const myPos = P.pos || 'mid';
  const posOrder = ['top', 'jg', 'mid', 'adc', 'sup'];

  // 상대팀 5인 픽 생성
  const oppRoster = {};
  posOrder.forEach(p => {
    const cand = CHAMPIONS.filter(c => c.role === p);
    oppRoster[p] = cand.length > 0 ? pick(cand) : pick(CHAMPIONS);
  });

  // 우리팀 4인 픽 생성 (내 포지션 제외)
  const myTeamRoster = {};
  posOrder.forEach(p => {
    if (p !== myPos) {
      const cand = CHAMPIONS.filter(c => c.role === p && c.id !== oppRoster[p]?.id);
      myTeamRoster[p] = cand.length > 0 ? pick(cand) : pick(CHAMPIONS);
    }
  });

  const oppLaner = oppRoster[myPos] || CHAMPIONS[0];

  // 추천 기본 픽
  const myCandidates = CHAMPIONS.filter(c => c.role === myPos);
  let selectedChamp = myCandidates.sort((a,b) => getChampMastery(b.id).lv - getChampMastery(a.id).lv)[0] || CHAMPIONS[0];

  while (true) {
    const fullMyTeam = Object.values(myTeamRoster).concat([selectedChamp]);
    const synergy = analyzeCompSynergy(fullMyTeam);
    const isCounter = (selectedChamp.strongVs || []).includes(oppLaner.id);

    const draftHtml = `
      <h3>⚔️ LCK 공식 밴픽 &amp; 챔피언 선택</h3>
      <div class="c" style="color:#9aa4b2;font-size:12px;margin-bottom:8px">
        상대: <b>${opp.name}</b> (전력 ${opp.str}) vs 우리 팀 (전력 ${Math.round(teamPow())})
      </div>

      <!-- 양 팀 픽 현황 -->
      <div class="draft-teams">
        <div class="draft-team-col my-col">
          <div style="font-weight:900;font-size:12px;color:#60a5fa;margin-bottom:6px">🔵 우리 팀 조합</div>
          ${posOrder.map(p => {
            const isMe = p === myPos;
            const c = isMe ? selectedChamp : myTeamRoster[p];
            return `
              <div class="draft-slot ${isMe ? 'my-slot' : ''}">
                <span class="pos-tag">${p.toUpperCase()}</span>
                <img src="${getChampIcon(c)}" onerror="this.src='champs/${c.id}.png'">
                <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <b>${c.n}</b> ${isMe ? '<span style="color:#fde047;font-size:10px">[MY]</span>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="draft-team-col opp-col">
          <div style="font-weight:900;font-size:12px;color:#f87171;margin-bottom:6px">🔴 ${opp.name}</div>
          ${posOrder.map(p => {
            const c = oppRoster[p];
            const isOppLaner = p === myPos;
            return `
              <div class="draft-slot ${isOppLaner ? 'opp-target' : ''}">
                <span class="pos-tag">${p.toUpperCase()}</span>
                <img src="${getChampIcon(c)}" onerror="this.src='champs/${c.id}.png'">
                <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  <b>${c.n}</b> ${isOppLaner ? '<span style="color:#fca5a5;font-size:10px">[맞라이너]</span>' : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <!-- 상성 & 시너지 분석 박스 -->
      <div style="background:#11182c;border:1px solid #28375c;border-radius:10px;padding:9px 12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
          <span>맞라인 상성:</span>
          <b>${isCounter ? `<span style="color:#4ade80">🎯 카운터 우세! (${selectedChamp.n} > ${oppLaner.n} 라인전 +15%)</span>` : `<span style="color:#cbd5e1">⚖️ 팽팽한 호각세</span>`}</b>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px">
          <span>팀 시너지:</span>
          <b style="color:#fde047">${synergy.name} <small style="color:#94a3b8">(${synergy.desc})</small></b>
        </div>
      </div>

      <!-- 챔피언 선택 그리드 -->
      <div style="font-size:12px;font-weight:800;color:#cbd5e1;margin-bottom:4px">내 챔피언 선택 (Riot Data Dragon 연동):</div>
      <div class="champ-pick-grid">
        ${myCandidates.map(c => {
          const isSel = c.id === selectedChamp.id;
          const cm = getChampMastery(c.id);
          const counterAdv = (c.strongVs || []).includes(oppLaner.id);
          return `
            <div class="champ-pick-card ${isSel ? 'sel' : ''}" data-cid="${c.id}">
              <img src="${getChampIcon(c)}" onerror="this.src='champs/${c.id}.png'">
              <b>${c.n}</b>
              <small style="color:${counterAdv ? '#4ade80' : '#94a3b8'}">${counterAdv ? '⭐카운터' : `Lv.${cm.lv}`}</small>
            </div>
          `;
        }).join('')}
      </div>

    const choiceIdx = await new Promise(res => {
      $('#mBody').innerHTML = draftHtml;

      $('#mBody').querySelectorAll('[data-cid]').forEach(card => {

          if (cObj) {
            selectedChamp = cObj;
            res({ type: 'reselect' });
          }
        };
      });

      const f = $('#mBtns'); f.innerHTML = '';
      const btns = [
        { t: `✨ [${selectedChamp.n}] 출전 확정!`, cls: 'gold', type: 'confirm' },
        { t: '⚡ [AI 최적 추천 픽으로 즉시 출전]', cls: 'purple', type: 'auto' }
      ];
      btns.forEach((b, i) => {
        const e = document.createElement('button');
        e.className = 'btn ' + (b.cls || '');
        e.innerHTML = b.t;
        e.onclick = () => { $('#modal').classList.add('hidden'); res(b); };
        f.appendChild(e);
      });
      $('#modal').classList.remove('hidden');
    });

    if (choiceIdx.type === 'reselect') continue;

    if (choiceIdx.type === 'auto') {
      // 카운터 또는 최고 숙련도 픽
      const counterPick = myCandidates.find(c => (c.strongVs || []).includes(oppLaner.id));
      selectedChamp = counterPick || myCandidates[0];
      toast(`⚡ [AI 최적 픽] ${selectedChamp.n} 자동 선택 완료!`);
    }

    const finalIsCounter = (selectedChamp.strongVs || []).includes(oppLaner.id);
    const finalFullTeam = Object.values(myTeamRoster).concat([selectedChamp]);
    const finalSynergy = analyzeCompSynergy(finalFullTeam);
    addChampMastery(selectedChamp.id, 100);
    P.currentChamp = selectedChamp;
    const bonusVal = finalIsCounter ? 15 : 5;
    return { myChamp: selectedChamp, bannedChamp: oppRoster.mid?.id, bonus: bonusVal, isCounter: finalIsCounter, synergy: finalSynergy };
  }
}

let shopTab = 'gear';
async function showHubShop() {
  while (true) {
    let body = `
      <div class="tab-row">
        <button class="${shopTab === 'gear' ? 'act' : ''}" id="stGear">🖱️ 게이밍 기어</button>
        <button class="${shopTab === 'skin' ? 'act' : ''}" id="stSkin">🎨 챔피언 스킨</button>
      </div>
      <div class="c" style="color:#9aa4b2;font-size:12px;margin-bottom:8px">보유 자산: 💰<b>${won(P.money)}원</b></div>
    `;

    let btns = [];
    if (shopTab === 'gear') {
      const items = GEAR.map(g => {
        const own = P.gear[g.k];
        return `<div class="shopi"><div class="t"><b>${g.n}</b><small>${g.d}</small></div>${own ? '<b style="color:#22c55e">보유 중</b>' : `<span>💰${won(g.c)}</span>`}</div>`;
      }).join('');
      body += `<div>${items}</div>`;
      const avail = GEAR.filter(g => !P.gear[g.k]);
      btns = avail.map(g => ({ t: `${g.n} (${won(g.c)}원)`, cls: 'gold', disabled: P.money < g.c, item: g, type: 'gear' }));
    } else {
      const isWorldsChamp = P.hist.titles.some(t => t.includes('월드 챔피언십 우승'));
      const items = SKINS.map(s => {
        const own = P.skins[s.k];
        const isEq = P.equippedSkin === s.k;
        let cost = s.c;
        if (s.k === 'skin_mythic' && isWorldsChamp) cost = Math.round(cost * 0.5);

        return `
          <div class="shopi ${s.k === 'skin_legend' ? 'skin-legend' : s.k === 'skin_mythic' ? 'skin-mythic' : ''}">
            <div class="t">
              <b><span class="skin-tag ${s.tagCls}">${s.tag}</span> ${s.n}</b>
              <small>${s.d}</small>
            </div>
            ${isEq ? '<b style="color:#ffd23f">착용 중</b>' : own ? '<b style="color:#22c55e">보유</b>' : `<span>💰${won(cost)}</span>`}
          </div>
        `;
      }).join('');
      body += `<div>${items}</div>`;

      SKINS.forEach(s => {
        const own = P.skins[s.k];
        const isEq = P.equippedSkin === s.k;
        let cost = s.c;
        if (s.k === 'skin_mythic' && isWorldsChamp) cost = Math.round(cost * 0.5);

        if (own) {
          if (!isEq) btns.push({ t: `✨ [${s.n}] 장착하기`, cls: 'purple', skin: s, type: 'equip' });
        } else {
          btns.push({ t: `🎨 ${s.n} 구매 (${won(cost)}원)`, cls: 'gold', disabled: P.money < cost, skin: s, cost, type: 'buySkin' });
        }
      });
      if (P.equippedSkin) {
        btns.push({ t: '기본 스킨으로 해제', cls: 'gray', type: 'unequip' });
      }
    }
    btns.push({ t: '닫기', cls: 'gray' });

    const i = await ask(`<h3>🛒 종합 e스포츠 상점</h3>${body}`, btns);
    const chosen = btns[i];
    if (!chosen || chosen.t === '닫기') break;

    if (chosen.type === 'gear') {
      P.money -= chosen.item.c;
      P.gear[chosen.item.k] = 1;
      toast(`${chosen.item.n} 구매 완료!`);
    } else if (chosen.type === 'buySkin') {
      P.money -= chosen.cost;
      P.skins[chosen.skin.k] = 1;
      P.equippedSkin = chosen.skin.k;
      toast(`🎨 ${chosen.skin.n} 스킨 구매 및 장착!`);
    } else if (chosen.type === 'equip') {
      P.equippedSkin = chosen.skin.k;
      toast(`${chosen.skin.n} 스킨을 장착했습니다!`);
    } else if (chosen.type === 'unequip') {
      P.equippedSkin = null;
      toast('스킨 장착을 해제했습니다.');
    }
    save(); renderTop();
  }
  render();
}

// ======================================================================
// 회사 로고 오프닝 비디오 연출 & 인앱 자동 업데이트 (v1.7.0)
// ======================================================================
const CURRENT_VERSION = '2.0.0';
const CURRENT_VERSION_CODE = 10;

function initIntroVideo() {
  const splash = document.getElementById('introSplash');
  const video = document.getElementById('introVideo');
  const skipBtn = document.getElementById('skipIntroBtn');
  if (!splash) return;

  let dismissed = false;
  function dismissSplash() {
    if (dismissed) return;
    dismissed = true;
    splash.style.opacity = '0';
    setTimeout(() => {
      try {
        splash.style.display = 'none';
        splash.remove();
      } catch (e) {}
      checkForUpdates(true);
    }, 350);
  }

  // 1-터치 즉시 스킵: 화면 어디든 탭하면 바로 게임으로 진입
  splash.onclick = (e) => {
    e.stopPropagation();
    dismissSplash();
  };

  if (skipBtn) {
    skipBtn.onclick = (e) => {
      e.stopPropagation();
      dismissSplash();
    };
  }

  if (video) {
    const isPortrait = window.innerHeight > window.innerWidth;
    const videoSrc = isPortrait ? 'assets/logo_portrait.mp4' : 'assets/logo_landscape.mp4';
    const fallbackSrc = isPortrait ? 'logo_portrait.mp4' : 'logo_landscape.mp4';

    video.src = videoSrc;
    video.playbackRate = 1.65;

    // 비디오가 정상 재생 시작되면 부드럽게 페이드인 노출
    video.onplaying = () => {
      video.style.opacity = '1';
    };

    video.onended = () => {
      dismissSplash();
    };

    video.onerror = () => {
      // 비디오 재생 실패 시 조용히 스플래시 종료하여 게임 화면 즉시 표시
      if (video.src.indexOf('assets/') !== -1) {
        video.src = fallbackSrc;
        video.play().catch(() => { dismissSplash(); });
      } else {
        dismissSplash();
      }
    };

    const p = video.play();
    if (p !== undefined) {
      p.catch(() => {
        video.muted = true;
        video.play().catch(() => {
          // 비디오 재생 불가능한 기기에서는 1.5초 후 자동 게임 진입
          setTimeout(dismissSplash, 1500);
        });
      });
    }
  }

  // 안전 타임아웃: 어떤 기기든 최대 3.0초 후 무조건 게임 메인 화면 노출 보장!
  setTimeout(() => {
    dismissSplash();
  }, 3000);
}

async function checkForUpdates(silent = true) {
  try {
    const urls = [
      'https://raw.githubusercontent.com/JyHwa0702/pro-gamer/master/version.json',
      'version.json',
      'assets/version.json'
    ];
    let remoteData = null;
    for (const url of urls) {
      try {
        const res = await fetch(url + '?_t=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          remoteData = await res.json();
          break;
        }
      } catch (e) {}
    }

    if (!remoteData || !remoteData.version) return;

    if (isNewerVersion(remoteData.version, CURRENT_VERSION)) {
      showUpdateModal(remoteData);
    } else if (!silent) {
      toast(`✨ 현재 최신 버전(v${CURRENT_VERSION})을 이용 중입니다.`);
    }
  } catch (err) {
    console.warn('Update check failed:', err);
  }
}

function isNewerVersion(remote, local) {
  const r = (remote || '').split('.').map(Number);
  const l = (local || '').split('.').map(Number);
  for (let i = 0; i < Math.max(r.length, l.length); i++) {
    const rv = r[i] || 0, lv = l[i] || 0;
    if (rv > lv) return true;
    if (rv < lv) return false;
  }
  return false;
}

function showUpdateModal(info) {
  const modalHtml = `
    <div style="text-align:center">

      <div style="display:flex;flex-direction:column;gap:8px">

  `;
  ask(modalHtml, [{ t: '나중에 하기', cls: 'gray' }]);
}
